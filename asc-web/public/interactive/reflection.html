  }).join('');

            <div class="sd" style="background:${d.c}"></div>
            <span>${item}</span>
          </div>`).join('')}
      </div>
    </div>`).join('');
}

function pick(i){
  cur=i;

  rContent();
  RI.forEach((id,j)=>{

}
