<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560"><rect width="920" height="560" fill="#FFFFFF"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1E2761"/></marker><marker id="ahT" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#028090"/></marker><marker id="ahA" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#B85042"/></marker><marker id="ahG" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#5A6472"/></marker></defs><text x="460.0" y="40" font-family="NanumGothic" font-size="23" font-weight="bold" fill="#1E2761" text-anchor="middle">같은 볼트, 세 개의 코드 — 데이터 정위치의 반례</text><text x="460.0" y="66" font-family="NanumGothic" font-size="13.5" font-weight="normal" fill="#5A6472" text-anchor="middle">하나의 사실이 세 자리에 흩어지는 순간, 그 사실에 관한 진실은 어디에도 없다</text><polygon points="116,230 150,210 184,230 184,270 150,290 116,270" fill="#CADCFC" stroke="#1E2761" stroke-width="2"/><rect x="139" y="288" width="22" height="86" fill="#E8F0FB" stroke="#1E2761" stroke-width="2"/><line x1="139" y1="304" x2="161" y2="304" stroke="#1E2761" stroke-width="1.4"/><line x1="139" y1="318" x2="161" y2="318" stroke="#1E2761" stroke-width="1.4"/><line x1="139" y1="332" x2="161" y2="332" stroke="#1E2761" stroke-width="1.4"/><line x1="139" y1="346" x2="161" y2="346" stroke="#1E2761" stroke-width="1.4"/><line x1="139" y1="360" x2="161" y2="360" stroke="#1E2761" stroke-width="1.4"/><text x="150" y="192" font-family="NanumGothic" font-size="14" font-weight="bold" fill="#1E2761" text-anchor="middle">실물은 하나</text><text x="150" y="400" font-family="NanumGothic" font-size="12.5" font-weight="normal" fill="#5A6472" text-anchor="middle">M8 육각볼트</text><rect x="380" y="110" width="300" height="92" rx="9" fill="#FFFFFF" stroke="#1E2761" stroke-width="1.6"/><text x="398" y="136" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="start">자재팀 등록</text><text x="398" y="160" font-family="NanumGothic" font-size="15" font-weight="bold" fill="#1E2761" text-anchor="start">BOLT-M8-020</text><text x="398" y="184" font-family="NanumGothic" font-size="12" font-weight="normal" fill="#454C57" text-anchor="start">장부 재고 120 EA</text><line x1="220" y1="260" x2="374" y2="156" stroke="#5A6472" stroke-width="1.8" marker-end="url(#ahG)" stroke-dasharray="5,4"/><text x="700" y="152" font-family="NanumGothic" font-size="12" font-weight="normal" fill="#5A6472" text-anchor="start">이 코드로는 재고 과잉</text><rect x="380" y="240" width="300" height="92" rx="9" fill="#FFFFFF" stroke="#1E2761" stroke-width="1.6"/><text x="398" y="266" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="start">구매팀 등록</text><text x="398" y="290" font-family="NanumGothic" font-size="15" font-weight="bold" fill="#1E2761" text-anchor="start">BT-M8-STD</text><text x="398" y="314" font-family="NanumGothic" font-size="12" font-weight="normal" fill="#454C57" text-anchor="start">장부 재고 45 EA</text><line x1="220" y1="260" x2="374" y2="286" stroke="#5A6472" stroke-width="1.8" marker-end="url(#ahG)" stroke-dasharray="5,4"/><text x="700" y="282" font-family="NanumGothic" font-size="12" font-weight="normal" fill="#5A6472" text-anchor="start">이 코드로는 어중간</text><rect x="380" y="370" width="300" height="92" rx="9" fill="#FFFFFF" stroke="#B85042" stroke-width="1.6"/><text x="398" y="396" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="start">설계 도면 등록</text><text x="398" y="420" font-family="NanumGothic" font-size="15" font-weight="bold" fill="#B85042" text-anchor="start">볼트 M8 아연</text><text x="398" y="444" font-family="NanumGothic" font-size="12" font-weight="normal" fill="#454C57" text-anchor="start">장부 재고 0 EA</text><line x1="220" y1="260" x2="374" y2="416" stroke="#5A6472" stroke-width="1.8" marker-end="url(#ahG)" stroke-dasharray="5,4"/><text x="700" y="412" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#B85042" text-anchor="start">결품! → 긴급 발주</text><text x="460.0" y="500" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#B85042" text-anchor="middle">장부 합계 165 EA — 그러나 어느 코드도 진실이 아니다. 남는 재고 옆에서 결품 발주가 나간다</text><text x="460.0" y="526" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#028090" text-anchor="middle">처방: 데이터 정돈 — 1품목 1코드로 통합, 나머지 코드는 보관(archive) 처리 (2장 디지털 3정5S)</text><text x="460.0" y="548" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">1부 2장 — 정위치·정품·정량이 동시에 무너지는 대표 병리</text></svg>