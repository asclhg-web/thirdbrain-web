<svg xmlns="http://www.w3.org/2000/svg" width="940" height="600" viewBox="0 0 940 600"><rect width="940" height="600" fill="#FFFFFF"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1E2761"/></marker><marker id="ahT" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#028090"/></marker><marker id="ahA" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#B85042"/></marker><marker id="ahG" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#5A6472"/></marker></defs><text x="470.0" y="38" font-family="NanumGothic" font-size="22" font-weight="bold" fill="#1E2761" text-anchor="middle">두 개의 뇌 — 뉴로-심볼릭의 쉬운 그림</text><text x="470.0" y="64" font-family="NanumGothic" font-size="13" font-weight="normal" fill="#5A6472" text-anchor="middle">하나는 가설을 내고, 하나는 근거로 거른다</text><rect x="70" y="110" width="340" height="150" rx="34" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.8"/><text x="240" y="156" font-family="NanumGothic" font-size="17" font-weight="bold" fill="#1E2761" text-anchor="middle">제안하는 뇌</text><text x="240" y="184" font-family="NanumGothic" font-size="13.5" font-weight="normal" fill="#5A6472" text-anchor="middle">LLM · 직관</text><text x="240" y="212" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#028090" text-anchor="middle">(가설을 낸다)</text><rect x="530" y="110" width="340" height="150" rx="2" fill="#EEF1F5" stroke="#1E2761" stroke-width="1.8"/><text x="700" y="156" font-family="NanumGothic" font-size="17" font-weight="bold" fill="#1E2761" text-anchor="middle">검증하는 뇌</text><text x="700" y="184" font-family="NanumGothic" font-size="13.5" font-weight="normal" fill="#5A6472" text-anchor="middle">온톨로지 · 규칙</text><text x="700" y="212" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#B85042" text-anchor="middle">(근거로 거른다)</text><line x1="414" y1="172" x2="526" y2="172" stroke="#1E2761" stroke-width="2.2" marker-end="url(#ah)"/><text x="470" y="160" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#1E2761" text-anchor="middle">가설</text><path d="M240,264 Q260,310 360,348" fill="none" stroke="#028090" stroke-width="2.2" marker-end="url(#ahT)"/><text x="238" y="316" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#028090" text-anchor="middle">제안</text><path d="M700,264 Q680,310 580,348" fill="none" stroke="#028090" stroke-width="2.2" marker-end="url(#ahT)"/><text x="716" y="316" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#028090" text-anchor="middle">검증 근거</text><rect x="370" y="320" width="200" height="106" rx="10" fill="#FFFFFF" stroke="#028090" stroke-width="2"/><text x="470" y="346" font-family="NanumGothic" font-size="14.5" font-weight="bold" fill="#028090" text-anchor="middle">근거 카드</text><line x1="392" y1="356" x2="548" y2="356" stroke="#BFE3E0" stroke-width="1.4"/><text x="470" y="380" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">제안 내용 + 판단 근거</text><text x="470" y="402" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">확신도와 대안</text><line x1="470" y1="428" x2="470" y2="462" stroke="#1E2761" stroke-width="2.5" marker-end="url(#ah)"/><circle cx="470" cy="486" r="13" fill="#CADCFC" stroke="#1E2761" stroke-width="2"/><path d="M442,532 Q470,498 498,532 z" fill="#CADCFC" stroke="#1E2761" stroke-width="2"/><g transform="rotate(-12 546 502)"><circle cx="546" cy="502" r="23" fill="#FFFFFF" stroke="#B85042" stroke-width="2.5"/><circle cx="546" cy="502" r="18" fill="none" stroke="#B85042" stroke-width="1"/><text x="546" y="507" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#B85042" text-anchor="middle">승인</text></g><text x="470" y="552" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#1E2761" text-anchor="middle">사람이 보고 결정한다 (HITL)</text><text x="470.0" y="578" font-family="NanumGothic" font-size="15" font-weight="bold" fill="#1E2761" text-anchor="middle">제안은 자유롭게, 실행은 검증된 것만</text><text x="470.0" y="596" font-family="NanumGothic" font-size="11" font-weight="normal" fill="#5A6472" text-anchor="middle">3부 20장 — 뉴로-심볼릭: 두 뇌의 분업</text></svg>