<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"><rect width="960" height="540" fill="#FFFFFF"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1E2761"/></marker><marker id="ahT" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#028090"/></marker><marker id="ahA" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#B85042"/></marker><marker id="ahG" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#5A6472"/></marker></defs><text x="480.0" y="38" font-family="NanumGothic" font-size="22" font-weight="bold" fill="#1E2761" text-anchor="middle">지도와 내비게이션 — ERP 원장과 온톨로지</text><text x="480.0" y="64" font-family="NanumGothic" font-size="13" font-weight="normal" fill="#5A6472" text-anchor="middle">기록은 지도가 하고, 다음 길은 내비게이션이 제안한다</text><rect x="55" y="95" width="400" height="370" rx="12" fill="#FFFFFF" stroke="#5A6472" stroke-width="1.6"/><rect x="55" y="95" width="400" height="44" rx="12" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.6"/><rect x="55.8" y="118" width="398.4" height="20.2" fill="#EEF1F5"/><text x="255" y="123" font-family="NanumGothic" font-size="16" font-weight="bold" fill="#454C57" text-anchor="middle">지도 (ERP 원장)</text><path d="M186,180 L232,168 L232,246 L186,258 z" fill="#FDFDFD" stroke="#5A6472" stroke-width="1.5"/><path d="M232,168 L278,180 L278,258 L232,246 z" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.5"/><path d="M278,180 L324,168 L324,246 L278,258 z" fill="#FDFDFD" stroke="#5A6472" stroke-width="1.5"/><path d="M198,236 Q244,198 310,192" fill="none" stroke="#5A6472" stroke-width="2" stroke-dasharray="5,4"/><circle cx="198" cy="236" r="4" fill="#5A6472"/><circle cx="310" cy="192" r="4" fill="#5A6472"/><text x="255" y="284" font-family="NanumGothic" font-size="12" font-weight="normal" fill="#5A6472" text-anchor="middle">과거를 담는다</text><text x="85" y="316" font-family="NanumGothic" font-size="13.5" font-weight="normal" fill="#454C57" text-anchor="start">· 지나온 길의 기록이다</text><text x="85" y="350" font-family="NanumGothic" font-size="13.5" font-weight="normal" fill="#454C57" text-anchor="start">· 조회하면 보여준다</text><text x="85" y="384" font-family="NanumGothic" font-size="13.5" font-weight="normal" fill="#454C57" text-anchor="start">· 갱신은 사람이 한다</text><rect x="505" y="95" width="400" height="370" rx="12" fill="#FFFFFF" stroke="#028090" stroke-width="1.8"/><rect x="505" y="95" width="400" height="44" rx="12" fill="#028090" stroke="#028090" stroke-width="1.8"/><rect x="505.9" y="118" width="398.2" height="20.1" fill="#028090"/><text x="705" y="123" font-family="NanumGothic" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">내비게이션 (온톨로지)</text><path d="M620,240 C680,228 720,224 778,196" fill="none" stroke="#5A6472" stroke-width="2" stroke-dasharray="5,4"/><line x1="694" y1="219" x2="710" y2="235" stroke="#B85042" stroke-width="3"/><line x1="710" y1="219" x2="694" y2="235" stroke="#B85042" stroke-width="3"/><path d="M620,240 C650,262 700,258 728,238 C748,224 760,210 774,199" fill="none" stroke="#028090" stroke-width="3.5" marker-end="url(#ahT)"/><circle cx="620" cy="240" r="7" fill="#1E2761"/><circle cx="790" cy="180" r="11" fill="#B85042"/><circle cx="790" cy="180" r="4" fill="#FFFFFF"/><path d="M780,187 L790,208 L800,187 z" fill="#B85042"/><text x="660" y="205" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#B85042" text-anchor="middle">막힘</text><text x="705" y="284" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#028090" text-anchor="middle">다음 길을 제안한다</text><text x="535" y="316" font-family="NanumGothic" font-size="13.5" font-weight="normal" fill="#454C57" text-anchor="start">· 관계를 알고 있다</text><text x="535" y="350" font-family="NanumGothic" font-size="13.5" font-weight="normal" fill="#454C57" text-anchor="start">· 막히면 길을 다시 계산한다</text><text x="535" y="384" font-family="NanumGothic" font-size="13.5" font-weight="normal" fill="#454C57" text-anchor="start">· 묻기 전에 제안한다</text><text x="480.0" y="497" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">같은 데이터 위에서 — 지도는 묻는 사람에게 답하고, 내비게이션은 먼저 말을 건다</text><text x="480.0" y="526" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">3부 18장 — 사각지대: ERP가 비추지 못하는 곳</text></svg>