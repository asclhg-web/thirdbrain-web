<svg xmlns="http://www.w3.org/2000/svg" width="980" height="440" viewBox="0 0 980 440"><rect width="980" height="440" fill="#FFFFFF"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1E2761"/></marker><marker id="ahT" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#028090"/></marker><marker id="ahA" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#B85042"/></marker><marker id="ahG" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#5A6472"/></marker></defs><text x="490.0" y="40" font-family="NanumGothic" font-size="21" font-weight="bold" fill="#1E2761" text-anchor="middle">관통 문제해결 5단계 — 문제의 성격과 무관하게 같은 순서</text><text x="490.0" y="66" font-family="NanumGothic" font-size="12.5" font-weight="normal" fill="#5A6472" text-anchor="middle">재고든 병목이든 품질이든, 같은 좌표계·같은 분류·같은 검증·같은 실행 계층을 통과한다</text><path d="M30,120 h184 l20,32.0 l-20,32.0 h-184 l20,-32.0 z" fill="#028090"/><text x="142.0" y="148" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">① 6 Station 진단</text><text x="142.0" y="168" font-family="NanumGothic" font-size="10.8" font-weight="normal" fill="#CADCFC" text-anchor="middle">위화감의 언어화</text><rect x="48.0" y="200" width="164" height="44" rx="8" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.2"/><text x="130.0" y="218" font-family="NanumGothic" font-size="10" font-weight="normal" fill="#5A6472" text-anchor="middle">산출물</text><text x="130.0" y="235" font-family="NanumGothic" font-size="10.8" font-weight="bold" fill="#1E2761" text-anchor="middle">Linguistic Seed·TA 후보</text><path d="M214,120 h184 l20,32.0 l-20,32.0 h-184 l20,-32.0 z" fill="#028090"/><text x="326.0" y="148" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">② 문제 확정</text><text x="326.0" y="168"