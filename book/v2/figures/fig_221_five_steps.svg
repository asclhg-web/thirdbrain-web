0 l-20,32.0 h-184 l20,-32.0 z" fill="#028090"/><text x="878.0" y="148" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">⑤ 표준 흐름 반영</text><text x="878.0" y="168" font-family="NanumGothic" font-size="10.8" font-weight="normal" fill="#CADCFC" text-anchor="middle">O2C 등 자동 반영</text><rect x="784.0" y="200" width="164" height="44" rx="8" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.2"/><text x="866.0" y="218" font-family="NanumGothic" font-size="10" font-weight="normal" fill="#5A6472" text-anchor="middle">산출물</text><text x="866.0" y="235" font-family="NanumGothic" font-size="10.8" font-weight="bold" fill="#1E2761" text-anchor="middle">갱신된 실행변수</text><path d="M920,260 Q490.0,334 100,264" fill="none" stroke="#B85042" stroke-width="2.4" marker-end="url(#ahA)" stroke-dasharray="7,5"/><text x="490.0" y="342" font-family="NanumGothic" font-size="12.2" font-weight="bold" fill="#B85042" text-anchor="middle">War Room 이상 신호 → 다시 ①의 진단 대상으로 — 프로젝트가 아니라 사이클</text><text x="490.0" y="376" font-family="NanumGothic" font-size="11.8" font-weight="normal" fill="#5A6472" text-anchor="middle">④에서 갈라지는 분기: 계산 가능한 사안은 담당자 승인으로, 계산할 수 없는 사안(설비·인력·납기)은 경영진 안건으로</text><text x="490.0" y="424" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">3부 22장 — JEDAIX 운영 매뉴얼 v9의 관통 방법론 (정인호, 2026)</text></svg>