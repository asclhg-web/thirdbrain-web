<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640"><rect width="940" height="640" fill="#FFFFFF"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1E2761"/></marker><marker id="ahT" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#028090"/></marker><marker id="ahA" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#B85042"/></marker><marker id="ahG" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#5A6472"/></marker></defs><text x="470.0" y="40" font-family="NanumGothic" font-size="21" font-weight="bold" fill="#1E2761" text-anchor="middle">SECI 나선과 지식센터 — 암묵지와 형식지의 변환 사이클</text><text x="470.0" y="66" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#5A6472" text-anchor="middle">조직 지식은 네 가지 변환의 나선으로 자란다 (Nonaka, 1994)</text><rect x="80" y="100" width="360" height="170" rx="12" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.8" stroke-dasharray="6,5"/><text x="260" y="134" font-family="NanumGothic" font-size="15" font-weight="bold" fill="#1E2761" text-anchor="middle">공동화 Socialization</text><text x="260" y="158" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#028090" text-anchor="middle">암묵지 → 암묵지</text><text x="260" y="186" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">디스커스 채팅 · 현장 동행</text><text x="260" y="206" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">(시스템 밖 영역이 아직 크다)</text><text x="260" y="248" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#5A6472" text-anchor="middle">사람의 영역 — 시스템 밖</text><rect x="500" y="100" width="360" height="170" rx="12" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.8"/><text x="680" y="134" font-family="NanumGothic" font-size="15" font-weight="bold" fill="#1E2761" text-anchor="middle">표출화 Externalization</text><text x="680" y="158" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#028090" text-anchor="middle">암묵지 → 형식지</text><text x="680" y="186" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">음성 기록·요약 · AI Fields</text><text x="680" y="206" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">지식센터 아티클 작성</text><text x="680" y="248" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#028090" text-anchor="middle">지식센터가 담당하는 장(場)</text><rect x="500" y="390" width="360" height="170" rx="12" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.8"/><text x="680" y="424" font-family="NanumGothic" font-size="15" font-weight="bold" fill="#1E2761" text-anchor="middle">연결화 Combination</text><text x="680" y="448" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#028090" text-anchor="middle">형식지 → 형식지</text><text x="680" y="476" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">아티클 트리 체계화 · 템플릿</text><text x="680" y="496" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">업무 레코드-문서 연결</text><text x="680" y="538" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#028090" text-anchor="middle">지식센터가 담당하는 장(場)</text><rect x="80" y="390" width="360" height="170" rx="12" fill="#E5F4F3" stroke="#028090" stroke-width="1.8"/><text x="260" y="424" font-family="NanumGothic" font-size="15" font-weight="bold" fill="#1E2761" text-anchor="middle">내면화 Internalization</text><text x="260" y="448" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#028090" text-anchor="middle">형식지 → 암묵지</text><text x="260" y="476" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">AI 질의응답 · 에이전트 안내</text><text x="260" y="496" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">온보딩 교육</text><text x="260" y="538" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#1E2761" text-anchor="middle">AI 질의응답의 통로</text><line x1="444" y1="150" x2="496" y2="150" stroke="#028090" stroke-width="3" marker-end="url(#ahT)"/><line x1="680" y1="274" x2="680" y2="386" stroke="#028090" stroke-width="3" marker-end="url(#ahT)"/><line x1="496" y1="510" x2="444" y2="510" stroke="#028090" stroke-width="3" marker-end="url(#ahT)"/><line x1="260" y1="386" x2="260" y2="274" stroke="#028090" stroke-width="3" marker-end="url(#ahT)"/><circle cx="470" cy="330" r="56" fill="#1E2761"/><text x="470" y="324" font-family="NanumGothic" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">지식의</text><text x="470" y="344" font-family="NanumGothic" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">나선</text><text x="470.0" y="596" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#1E2761" text-anchor="middle">지식센터는 표출화·연결화의 장(場), AI 질의응답은 내면화의 통로 — 회전할수록 조직지식이 두터워진다</text><text x="470.0" y="626" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">2부 15장 — 지식센터: 암묵지의 형식지화 거점</text></svg>