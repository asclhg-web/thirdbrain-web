<svg xmlns="http://www.w3.org/2000/svg" width="940" height="600" viewBox="0 0 940 600"><rect width="940" height="600" fill="#FFFFFF"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1E2761"/></marker><marker id="ahT" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#028090"/></marker><marker id="ahA" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#B85042"/></marker><marker id="ahG" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#5A6472"/></marker></defs><text x="470.0" y="40" font-family="NanumGothic" font-size="23" font-weight="bold" fill="#1E2761" text-anchor="middle">동기생산 × ERP — 경쟁이 아니라 역할 분담</text><text x="470.0" y="66" font-family="NanumGothic" font-size="13.5" font-weight="bold" fill="#5A6472" text-anchor="middle">ERP가 큰 계획을 세우고, 현장의 풀(pull)이 그것을 실시간으로 동기화한다</text><rect x="130" y="100" width="620" height="110" rx="10" fill="#1E2761" stroke="#1E2761" stroke-width="1.6"/><text x="440.0" y="132" font-family="NanumGothic" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ERP — 전사의 계획 (위에서 아래로, push)</text><text x="440.0" y="160" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#CADCFC" text-anchor="middle">수주 관리 · 소요량 전개(MRP) · 조달 · 대일정계획</text><text x="440.0" y="184" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#CADCFC" text-anchor="middle">중앙의 계산 — 전사가 같은 숫자를 본다</text><rect x="130" y="270" width="620" height="96" rx="10" fill="#E8F0FB" stroke="#028090" stroke-width="1.8"/><text x="440.0" y="302" font-family="NanumGothic" font-size="15" font-weight="bold" fill="#028090" text-anchor="middle">동기화 지점 — 중일정·실행</text><text x="440.0" y="330" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#5A6472" text-anchor="middle">계획과 현장이 실시간으로 맞물린다 = 동기(同期)생산</text><rect x="130" y="426" width="620" height="110" rx="10" fill="#028090" stroke="#028090" stroke-width="1.6"/><text x="440.0" y="458" font-family="NanumGothic" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">현장 — 풀(pull)의 실행 (아래에서 위로)</text><text x="440.0" y="486" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#D9F0EE" text-anchor="middle">간판 · 후공정 인수 · 필요한 것을 필요한 때 필요한 만큼</text><text x="440.0" y="510" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#D9F0EE" text-anchor="middle">현장의 자율 — 실적·이상이 즉시 신호가 된다</text><line x1="280" y1="214" x2="280" y2="264" stroke="#1E2761" stroke-width="3" marker-end="url(#ah)"/><text x="268" y="244" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#1E2761" text-anchor="end">계획</text><line x1="280" y1="370" x2="280" y2="420" stroke="#1E2761" stroke-width="3" marker-end="url(#ah)"/><line x1="600" y1="422" x2="600" y2="372" stroke="#028090" stroke-width="3" marker-end="url(#ahT)"/><text x="612" y="400" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#028090" text-anchor="start">풀 신호·실적</text><line x1="600" y1="266" x2="600" y2="216" stroke="#028090" stroke-width="3" marker-end="url(#ahT)"/><rect x="775" y="128" width="150" height="40" rx="8" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.2"/><text x="850" y="153" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">Odoo MRP·MPS</text><rect x="775" y="292" width="150" height="40" rx="8" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.2"/><text x="850" y="317" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">frePPLe 동기화</text><rect x="775" y="454" width="150" height="40" rx="8" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.2"/><text x="850" y="479" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">칸반·POP 태블릿</text><text x="470.0" y="558" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#1E2761" text-anchor="middle">중앙의 계산(push)과 현장의 자율(pull)이 층을 나누어 맞물린다 — 후쿠시마 『동기ERP』의 사상</text><text x="470.0" y="584" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">1부 1장 — 다품종소량·수주생산의 정답에 가장 가까운 분업</text></svg>