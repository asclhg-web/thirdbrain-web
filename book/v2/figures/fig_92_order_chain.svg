<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500"><rect width="960" height="500" fill="#FFFFFF"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1E2761"/></marker><marker id="ahT" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#028090"/></marker><marker id="ahA" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#B85042"/></marker><marker id="ahG" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#5A6472"/></marker></defs><text x="480.0" y="38" font-family="NanumGothic" font-size="24" font-weight="bold" fill="#1E2761" text-anchor="middle">주문 한 건의 자동 연쇄 — 사람 손 없이</text><text x="480.0" y="64" font-family="NanumGothic" font-size="13.5" font-weight="normal" fill="#5A6472" text-anchor="middle">온라인 주문이 확정되는 순간, 네 개의 기록이 한 사건에서 이어진다</text><rect x="20.0" y="96" width="164" height="88" rx="9" fill="#E5F4F3" stroke="#028090" stroke-width="1.5"/><text x="102.0" y="126" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#028090" text-anchor="middle">웹 주문 확정</text><text x="102.0" y="149" font-family="NanumGothic" font-size="11" font-weight="normal" fill="#5A6472" text-anchor="middle">고객 결제 완료</text><line x1="186.0" y1="140.0" x2="207.0" y2="140.0" stroke="#028090" stroke-width="2.4" marker-end="url(#ahT)"/><text x="196.5" y="130.0" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#028090" text-anchor="middle">자동</text><rect x="209.0" y="96" width="164" height="88" rx="9" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.5"/><text x="291.0" y="126" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">판매 주문(SO)</text><text x="291.0" y="149" font-family="NanumGothic" font-size="11" font-weight="normal" fill="#5A6472" text-anchor="middle">주문 즉시</text><text x="291.0" y="166" font-family="NanumGothic" font-size="11" font-weight="normal" fill="#5A6472" text-anchor="middle">자동 생성</text><line x1="375.0" y1="140.0" x2="396.0" y2="140.0" stroke="#028090" stroke-width="2.4" marker-end="url(#ahT)"/><text x="385.5" y="130.0" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#028090" text-anchor="middle">자동</text><rect x="398.0" y="96" width="164" height="88" rx="9" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.5"/><text x="480.0" y="126" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">재고 예약</text><text x="480.0" y="149" font-family="NanumGothic" font-size="11" font-weight="normal" fill="#5A6472" text-anchor="middle">가용 재고에서</text><text x="480.0" y="166" font-family="NanumGothic" font-size="11" font-weight="normal" fill="#5A6472" text-anchor="middle">즉시 분리</text><line x1="564.0" y1="140.0" x2="585.0" y2="140.0" stroke="#028090" stroke-width="2.4" marker-end="url(#ahT)"/><text x="574.5" y="130.0" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#028090" text-anchor="middle">자동</text><rect x="587.0" y="96" width="164" height="88" rx="9" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.5"/><text x="669.0" y="126" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">출고·배송</text><text x="669.0" y="149" font-family="NanumGothic" font-size="11" font-weight="normal" fill="#5A6472" text-anchor="middle">출고 지시가</text><text x="669.0" y="166" font-family="NanumGothic" font-size="11" font-weight="normal" fill="#5A6472" text-anchor="middle">창고 화면에</text><line x1="753.0" y1="140.0" x2="774.0" y2="140.0" stroke="#028090" stroke-width="2.4" marker-end="url(#ahT)"/><text x="763.5" y="130.0" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#028090" text-anchor="middle">자동</text><rect x="776.0" y="96" width="164" height="88" rx="9" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.5"/><text x="858.0" y="126" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">청구서·회계 분개</text><text x="858.0" y="149" font-family="NanumGothic" font-size="11" font-weight="normal" fill="#5A6472" text-anchor="middle">결제 확인과</text><text x="858.0" y="166" font-family="NanumGothic" font-size="11" font-weight="normal" fill="#5A6472" text-anchor="middle">함께 자동 기표</text><rect x="150.0" y="232" width="660" height="56" rx="9" fill="#FFFFFF" stroke="#B85042" stroke-width="1.5" stroke-dasharray="6,5"/><text x="480.0" y="266" font-family="NanumGothic" font-size="12.5" font-weight="normal" fill="#5A6472" text-anchor="middle">별도 쇼핑몰의 공정: 주문 엑셀 다운로드 → ERP 재입력 → 오류와 지연</text><line x1="206.0" y1="262" x2="754.0" y2="262" stroke="#B85042" stroke-width="2"/><line x1="172.0" y1="250" x2="192.0" y2="270" stroke="#B85042" stroke-width="2.5"/><line x1="172.0" y1="270" x2="192.0" y2="250" stroke="#B85042" stroke-width="2.5"/><line x1="768.0" y1="250" x2="788.0" y2="270" stroke="#B85042" stroke-width="2.5"/><line x1="768.0" y1="270" x2="788.0" y2="250" stroke="#B85042" stroke-width="2.5"/><text x="480.0" y="312" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#B85042" text-anchor="middle">이 공정 자체가 존재하지 않는다</text><rect x="130.0" y="348" width="700" height="52" rx="10" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.4"/><text x="480.0" y="380" font-family="NanumGothic" font-size="13.5" font-weight="bold" fill="#1E2761" text-anchor="middle">하나의 데이터베이스 위에서 주문·재고·물류·회계는 한 사건의 네 기록이 된다</text><text x="480.0" y="438" font-family="NanumGothic" font-size="12" font-weight="normal" fill="#5A6472" text-anchor="middle">판매와 동시에 재고·회계 데이터가 즉시 반영되는 완전 자동화 (Odoo 공식 소개자료)</text><text x="480.0" y="484" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">2부 9장 — 웹사이트·이커머스</text></svg>