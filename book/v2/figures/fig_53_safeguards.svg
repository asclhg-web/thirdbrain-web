198" stroke="#028090" stroke-width="2.5" marker-end="url(#ahT)"/><line x1="547" y1="198" x2="572" y2="198" stroke="#028090" stroke-width="2.5" marker-end="url(#ahT)"/><line x1="727" y1="198" x2="752" y2="198" stroke="#028090" stroke-width="2.5" marker-end="url(#ahT)"/><path d="M270,126 Q180,92 115,146" fill="none" stroke="#B85042" stroke-width="2" marker-end="url(#ahA)" stroke-dasharray="6,4"/><text x="186" y="86" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#B85042" text-anchor="middle">기각 — 재분석</text><path d="M650,126 Q560,92 495,146" fill="none" stroke="#B85042" stroke-width="2" marker-end="url(#ahA)" stroke-dasharray="6,4"/><text x="566" y="86" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#B85042" text-anchor="middle">반려 — 근거 보강</text><line x1="110" y1="248" x2="110" y2="328" stroke="#5A6472" stroke-width="1" stroke-dasharray="3,3"/><line x1="290" y1="268" x2="290" y2="328" stroke="#5A6472" stroke-width="1" stroke-dasharray="3,3"/><line x1="470" y1="248" x2="470" y2="328" stroke="#5A6472" stroke-width="1" stroke-dasharray="3,3"/><line x1="650" y1="268" x2="650" y2="328" stroke="#5A6472" stroke-width="1" stroke-dasharray="3,3"/><line x1="830" y1="248" x2="830" y2="328" stroke="#5A6472" stroke-width="1" stroke-dasharray="3,3"/><rect x="35" y="330" width="870" height="76" rx="10" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.4"/><text x="470.0" y="358" font-family="NanumGothic" font-size="13.5" font-weight="bold" fill="#1E2761" text-anchor="middle">안전장치 3 — 감사 로그 · 폭주 방지</text><text x="470.0" y="382" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">모든 회전의 데이터→분석→제안→승인→결과 기록  |  회전·변경 한도, 임계 초과 시 사람을 호출하는 서킷 브레이커</text><text x="470.0" y="444" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">로그가 없는 루프는 반성할 수 없고, 반성하지 못하는 루프는 개선되지 않는다 (5.8절)</text></svg>