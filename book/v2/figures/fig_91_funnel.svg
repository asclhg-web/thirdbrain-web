<svg xmlns="http://www.w3.org/2000/svg" width="920" height="640" viewBox="0 0 920 640"><rect width="920" height="640" fill="#FFFFFF"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1E2761"/></marker><marker id="ahT" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#028090"/></marker><marker id="ahA" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#B85042"/></marker><marker id="ahG" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#5A6472"/></marker></defs><text x="460.0" y="38" font-family="NanumGothic" font-size="24" font-weight="bold" fill="#1E2761" text-anchor="middle">전환 퍼널 — 방문에서 재구매까지</text><text x="460.0" y="64" font-family="NanumGothic" font-size="13.5" font-weight="normal" fill="#5A6472" text-anchor="middle">어느 단계에서 몇 명이 빠지는가 (수치는 예시)</text><path d="M70.0,108 L730.0,108 L630.0,190 L170.0,190 z" fill="#CADCFC" stroke="#1E2761" stroke-width="1.2"/><text x="400" y="144" font-family="NanumGothic" font-size="14.5" font-weight="bold" fill="#1E2761" text-anchor="middle">방문  10,000명</text><text x="400" y="168" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">방문 대비 100%</text><line x1="400" y1="194" x2="400" y2="220" stroke="#028090" stroke-width="2.4" marker-end="url(#ahT)"/><text x="656.0" y="212.0" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#028090" text-anchor="start">전환율 8.5%</text><line x1="182.0" y1="203.0" x2="150.0" y2="215.0" stroke="#B85042" stroke-width="2" marker-end="url(#ahA)"/><text x="142.0" y="216.0" font-family="NanumGothic" font-size="12" font-weight="normal" fill="#B85042" text-anchor="end">이탈 91.5% — 9,150명</text><path d="M190.0,224 L610.0,224 L550.0,306 L250.0,306 z" fill="#9FC2E4" stroke="#1E2761" stroke-width="1.2"/><text x="400" y="260" font-family="NanumGothic" font-size="14.5" font-weight="bold" fill="#1E2761" text-anchor="middle">장바구니 담기  850명</text><text x="400" y="284" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">방문 대비 8.5%</text><line x1="400" y1="310" x2="400" y2="336" stroke="#028090" stroke-width="2.4" marker-end="url(#ahT)"/><text x="576.0" y="328.0" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#028090" text-anchor="start">결제 전환 47%</text><line x1="262.0" y1="319.0" x2="230.0" y2="331.0" stroke="#B85042" stroke-width="2" marker-end="url(#ahA)"/><text x="222.0" y="332.0" font-family="NanumGothic" font-size="12" font-weight="normal" fill="#B85042" text-anchor="end">이탈 53% — 450명</text><path d="M270.0,340 L530.0,340 L498.0,422 L302.0,422 z" fill="#3E7CB8" stroke="#1E2761" stroke-width="1.2"/><text x="400" y="376" font-family="NanumGothic" font-size="14.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">결제·주문 완료  400명</text><text x="400" y="400" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#FFFFFF" text-anchor="middle">방문 대비 4.0%</text><line x1="400" y1="426" x2="400" y2="452" stroke="#028090" stroke-width="2.4" marker-end="url(#ahT)"/><text x="524.0" y="444.0" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#028090" text-anchor="start">재구매율 30%</text><line x1="314.0" y1="435.0" x2="282.0" y2="447.0" stroke="#B85042" stroke-width="2" marker-end="url(#ahA)"/><text x="274.0" y="448.0" font-family="NanumGothic" font-size="12" font-weight="normal" fill="#B85042" text-anchor="end">미재구매 70% — 280명</text><path d="M322.0,456 L478.0,456 L460.0,538 L340.0,538 z" fill="#028090" stroke="#1E2761" stroke-width="1.2"/><text x="400" y="492" font-family="NanumGothic" font-size="14.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">재구매  120명</text><text x="400" y="516" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#FFFFFF" text-anchor="middle">방문 대비 1.2%</text><text x="460.0" y="578" font-family="NanumGothic" font-size="12.5" font-weight="normal" fill="#5A6472" text-anchor="middle">단계별 통과율에 관리 한계(최근 4주 관리 범위)를 정의하면 정상과 이상의 경계가 화면에 새겨진다</text><text x="460.0" y="624" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">2부 9장 — 웹사이트·이커머스</text></svg>