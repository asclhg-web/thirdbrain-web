<svg xmlns="http://www.w3.org/2000/svg" width="1301" height="900" viewBox="0 0 1301 900"><rect width="1301" height="900" fill="#FFFFFF"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1E2761"/></marker><marker id="ahT" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#028090"/></marker><marker id="ahA" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#B85042"/></marker></defs><text x="60" y="74" font-family="NanumGothic" font-size="34" font-weight="bold" fill="#111111" text-anchor="start">1. 수요예측을 통한 영업 지능화</text><text x="62" y="104" font-family="NanumGothic" font-size="16" font-weight="normal" fill="#1CA5E5" text-anchor="start">Sales Intelligence via AI Demand Forecasting</text><line x1="60" y1="122" x2="1241" y2="122" stroke="#1CA5E5" stroke-width="3"/><text x="1241" y="66" font-family="NanumGothic" font-size="40" font-weight="bold" fill="#1CA5E5" text-anchor="end">ASC</text><path d="M1135,72 q50,14 106,2" stroke="#B85042" stroke-width="3" fill="none"/><text x="1238" y="92" font-family="NanumGothic" font-size="12" font-weight="normal" fill="#B85042" text-anchor="end">AI System Creator</text><rect x="60" y="150" width="560" height="420" rx="14" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.8"/><text x="340" y="184" font-family="NanumGothic" font-size="19" font-weight="bold" fill="#1E2761" text-anchor="middle">현장 시나리오 — 말하면 5초 안에 예측까지</text><rect x="88" y="208" width="504" height="56" rx="10" fill="#FFFFFF" stroke="#1CA5E5" stroke-width="1.6"/><text x="110" y="232" font-family="NanumGothic" font-size="16.5" font-weight="bold" fill="#1E2761" text-anchor="start">음성 주문 (마이크)</text><text x="110" y="253" font-family="NanumGothic" font-size="13" font-weight="normal" fill="#5A6472" text-anchor="start">“OO상사, 브래킷 A” — 거래처·상품명을 말한다</text><line x1="340" y1="265" x2="340" y2="277" stroke="#1CA5E5" stroke-width="2.2" marker-end="url(#ah)"/><rect x="88" y="278" width="504" height="56" rx="10" fill="#FFFFFF" stroke="#1CA5E5" stroke-width="1.6"/><text x="110" y="302" font-family="NanumGothic" font-size="16.5" font-weight="bold" fill="#1E2761" text-anchor="start">문자 변환(STT)</text><text x="110" y="323" font-family="NanumGothic" font-size="13" font-weight="normal" fill="#5A6472" text-anchor="start">음성이 텍스트 데이터로 자동 변환</text><line x1="340" y1="335" x2="340" y2="347" stroke="#1CA5E5" stroke-width="2.2" marker-end="url(#ah)"/><rect x="88" y="348" width="504" height="56" rx="10" fill="#FFFFFF" stroke="#1CA5E5" stroke-width="1.6"/><text x="110" y="372" font-family="NanumGothic" font-size="16.5" font-weight="bold" fill="#1E2761" text-anchor="start">자동 매칭</text><text x="110" y="393" font-family="NanumGothic" font-size="13" font-weight="normal" fill="#5A6472" text-anchor="start">거래처·제품 마스터에서 해당 레코드 탐색</text><line x1="340" y1="405" x2="340" y2="417" stroke="#1CA5E5" stroke-width="2.2" marker-end="url(#ah)"/><rect x="88" y="418" width="504" height="56" rx="10" fill="#FFFFFF" stroke="#B85042" stroke-width="1.6"/><text x="110" y="442" font-family="NanumGothic" font-size="16.5" font-weight="bold" fill="#1E2761" text-anchor="start">RFM 분석 (5초 이내)</text><text x="110" y="463" font-family="NanumGothic" font-size="13" font-weight="normal" fill="#5A6472" text-anchor="start">최근구매일 · 구매빈도 · 누적구매금액</text><line x1="340" y1="475" x2="340" y2="487" stroke="#1CA5E5" stroke-width="2.2" marker-end="url(#ah)"/><rect x="88" y="488" width="504" height="56" rx="10" fill="#FFFFFF" stroke="#1CA5E5" stroke-width="1.6"/><text x="110" y="512" font-family="NanumGothic" font-size="16.5" font-weight="bold" fill="#1E2761" text-anchor="start">판매 예측·주문 제안</text><text x="110" y="533" font-family="NanumGothic" font-size="13" font-weight="normal" fill="#5A6472" text-anchor="start">RFM+이력 결합 예측 → 주문 명세 지시</text><rect x="660" y="150" width="581" height="420" rx="14" fill="#FFFFFF" stroke="#1E2761" stroke-width="1.8"/><text x="950" y="184" font-family="NanumGothic" font-size="19" font-weight="bold" fill="#1E2761" text-anchor="middle">Odoo 표준 프로세스 — 파이프라인이 예측이 된다</text><rect x="688" y="208" width="524" height="56" rx="10" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.2"/><text x="710" y="232" font-family="NanumGothic" font-size="16" font-weight="bold" fill="#1E2761" text-anchor="start">CRM 파이프라인</text><text x="710" y="253" font-family="NanumGothic" font-size="13" font-weight="normal" fill="#5A6472" text-anchor="start">기회 카드 — 예상 수익 · AI 성공 확률</text><line x1="950" y1="265" x2="950" y2="277" stroke="#5A6472" stroke-width="2" marker-end="url(#ah)"/><rect x="688" y="278" width="524" height="56" rx="10" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.2"/><text x="710" y="302" font-family="NanumGothic" font-size="16" font-weight="bold" fill="#1E2761" text-anchor="start">예측 보고서</text><text x="710" y="323" font-family="NanumGothic" font-size="13" font-weight="normal" fill="#5A6472" text-anchor="start">예상 수익 × 확률 = 가중 수익(월별 전망)</text><line x1="950" y1="335" x2="950" y2="347" stroke="#5A6472" stroke-width="2" marker-end="url(#ah)"/><rect x="688" y="348" width="524" height="56" rx="10" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.2"/><text x="710" y="372" font-family="NanumGothic" font-size="16" font-weight="bold" fill="#1E2761" text-anchor="start">구간 예측 결합</text><text x="710" y="393" font-family="NanumGothic" font-size="13" font-weight="normal" fill="#5A6472" text-anchor="start">제품군 계층 ML 예측 + 파이프라인 신호</text><line x1="950" y1="405" x2="950" y2="417" stroke="#5A6472" stroke-width="2" marker-end="url(#ah)"/><rect x="688" y="418" width="524" height="56" rx="10" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.2"/><text x="710" y="442" font-family="NanumGothic" font-size="16" font-weight="bold" fill="#1E2761" text-anchor="start">공급 연계</text><text x="710" y="463" font-family="NanumGothic" font-size="13" font-weight="normal" fill="#5A6472" text-anchor="start">재주문 규칙 · MPS/MRP로 수요 신호 전달</text><line x1="950" y1="475" x2="950" y2="487" stroke="#5A6472" stroke-width="2" marker-end="url(#ah)"/><rect x="688" y="488" width="524" height="56" rx="10" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.2"/><text x="710" y="512" font-family="NanumGothic" font-size="16" font-weight="bold" fill="#1E2761" text-anchor="start">실적 검증</text><text x="710" y="533" font-family="NanumGothic" font-size="13" font-weight="normal" fill="#5A6472" text-anchor="start">MAPE 점검 → 다음 회전의 학습 재료</text><text x="650.0" y="630" font-family="NanumGothic" font-size="15.5" font-weight="bold" fill="#028090" text-anchor="middle">AI 에이전트 파이프라인 (상시 루프)</text><rect x="120.0" y="640" width="200.8" height="52" rx="10" fill="#E5F4F3" stroke="#028090" stroke-width="1.5"/><text x="220.4" y="662" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">수집</text><text x="220.4" y="680" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">Odoo·CRM</text><line x1="321.8" y1="666" x2="333.8" y2="666" stroke="#028090" stroke-width="2.2" marker-end="url(#ahT)"/><rect x="334.8" y="640" width="200.8" height="52" rx="10" fill="#E5F4F3" stroke="#028090" stroke-width="1.5"/><text x="435.20000000000005" y="662" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">예측</text><text x="435.20000000000005" y="680" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">ML·구간</text><line x1="536.6" y1="666" x2="548.6" y2="666" stroke="#028090" stroke-width="2.2" marker-end="url(#ahT)"/><rect x="549.6" y="640" width="200.8" height="52" rx="10" fill="#E5F4F3" stroke="#028090" stroke-width="1.5"/><text x="650.0" y="662" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">검증</text><text x="650.0" y="680" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">MAPE·규칙</text><line x1="751