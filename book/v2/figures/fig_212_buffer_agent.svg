<svg xmlns="http://www.w3.org/2000/svg" width="980" height="480" viewBox="0 0 980 480"><rect width="980" height="480" fill="#FFFFFF"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1E2761"/></marker><marker id="ahT" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#028090"/></marker><marker id="ahA" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#B85042"/></marker><marker id="ahG" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#5A6472"/></marker></defs><text x="490.0" y="40" font-family="NanumGothic" font-size="22" font-weight="bold" fill="#1E2761" text-anchor="middle">InventoryBufferAgent — 알림으로 끝나지 않는 실행</text><text x="490.0" y="66" font-family="NanumGothic" font-size="12.5" font-weight="normal" fill="#5A6472" text-anchor="middle">확정된 사각지대가 재고 파라미터 갱신으로 이어지는 네 단계와 두 관문</text><rect x="16.0" y="130" width="148" height="110" rx="10" fill="#CADCFC" stroke="#1E2761" stroke-width="1.6"/><text x="90.0" y="162" font-family="NanumGothic" font-size="12.8" font-weight="bold" fill="#1E2761" text-anchor="middle">문제 확정</text><text x="90.0" y="188" font-family="NanumGothic" font-size="10.6" font-weight="normal" fill="#5A6472" text-anchor="middle">TA06 (KPI 충돌)</text><text x="90.0" y="205" font-family="NanumGothic" font-size="10.6" font-weight="normal" fill="#5A6472" text-anchor="middle">PTGDA 임계 돌파</text><line x1="165.0" y1="185.0" x2="175.0" y2="185.0" stroke="#028090" stroke-width="2.3" marker-end="url(#ahT)"/><rect x="176.0" y="130" width="148" height="110" rx="10" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.6"/><text x="250.0" y="162" font-family="NanumGothic" font-size="12.8" font-weight="bold" fill="#1E2761" text-anchor="middle">① 증거 정량화</text><text x="250.0" y="188" font-family="NanumGothic" font-size="10.6" font-weight="normal" fill="#5A6472" text-anchor="middle">신호의 최근 발생</text><text x="250.0" y="205" font-family="NanumGothic" font-size="10.6" font-weight="normal" fill="#5A6472" text-anchor="middle">빈도를 수치화</text><line x1="325.0" y1="185.0" x2="335.0" y2="185.0" stroke="#028090" stroke-width="2.3" marker-end="url(#ahT)"/><rect x="336.0" y="130" width="148" height="110" rx="10" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.6"/><text x="410.0" y="162" font-family="NanumGothic" font-size="12.8" font-weight="bold" fill="#1E2761" text-anchor="middle">② 보정계수 계산</text><text x="410.0" y="188" font-family="NanumGothic" font-size="10.6" font-weight="normal" fill="#5A6472" text-anchor="middle">안전재고 100→115</text><text x="410.0" y="205" font-family="NanumGothic" font-size="10.6" font-weight="normal" fill="#5A6472" text-anchor="middle">ROP 150→173 제안</text><line x1="485.0" y1="185.0" x2="495.0" y2="185.0" stroke="#028090" stroke-width="2.3" marker-end="url(#ahT)"/><rect x="496.0" y="130" width="148" height="110" rx="10" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.6"/><text x="570.0" y="162" font-family="NanumGothic" font-size="12.8" font-weight="bold" fill="#1E2761" text-anchor="middle">③ Digital Twin</text><text x="570.0" y="188" font-family="NanumGothic" font-size="10.6" font-weight="normal" fill="#5A6472" text-anchor="middle">재고 소진 예측 비교</text><text x="570.0" y="205" font-family="NanumGothic" font-size="10.6" font-weight="normal" fill="#5A6472" text-anchor="middle">실제 값은 불변</text><line x1="645.0" y1="185.0" x2="655.0" y2="185.0" stroke="#028090" stroke-width="2.3" marker-end="url(#ahT)"/><rect x="656.0" y="130" width="148" height="110" rx="10" fill="#F6E8E5" stroke="#B85042" stroke-width="1.6"/><text x="730.0" y="162" font-family="NanumGothic" font-size="12.8" font-weight="bold" fill="#B85042" text-anchor="middle">④ HITL 승인</text><text x="730.0" y="188" font-family="NanumGothic" font-size="10.6" font-weight="normal" fill="#5A6472" text-anchor="middle">담당자가 성적표</text><text x="730.0" y="205" font-family="NanumGothic" font-size="10.6" font-weight="normal" fill="#5A6472" text-anchor="middle">확인 후 승인·반려</text><line x1="805.0" y1="185.0" x2="815.0" y2="185.0" stroke="#028090" stroke-width="2.3" marker-end="url(#ahT)"/><rect x="816.0" y="130" width="148" height="110" rx="10" fill="#E5F4F3" stroke="#028090" stroke-width="1.6"/><text x="890.0" y="162" font-family="NanumGothic" font-size="12.8" font-weight="bold" fill="#028090" text-anchor="middle">O2C 반영</text><text x="890.0" y="188" font-family="NanumGothic" font-size="10.6" font-weight="normal" fill="#5A6472" text-anchor="middle">모든 표준 프로세스에</text><text x="890.0" y="205" font-family="NanumGothic" font-size="10.6" font-weight="normal" fill="#5A6472" text-anchor="middle">새 값 자동 적용</text><line x1="180.0" y1="112" x2="640.0" y2="112" stroke="#1E2761" stroke-width="1.8"/><line x1="180.0" y1="112" x2="180.0" y2="120" stroke="#1E2761" stroke-width="1.8"/><line x1="640.0" y1="112" x2="640.0" y2="120" stroke="#1E2761" stroke-width="1.8"/><text x="410.0" y="104" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#1E2761" text-anchor="middle">Agent(Skill)의 자동 수행 — 여기까지 시스템은 바뀌지 않는다</text><rect x="721.0" y="252" width="18" height="22" rx="3" fill="#B85042"/><text x="730.0" y="292" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#B85042" text-anchor="middle">승인의 순간에만</text><text x="730.0" y="308" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#B85042" text-anchor="middle">실제 값이 바뀐다</text><text x="490.0" y="350" font-family="NanumGothic" font-size="12.2" font-weight="bold" fill="#1E2761" text-anchor="middle">발굴된 지식이 문서가 아니라 파라미터가 되므로, 지키는 데 별도의 의지가 필요 없다</text><text x="490.0" y="370" font-family="NanumGothic" font-size="12.2" font-weight="bold" fill="#1E2761" text-anchor="middle">— 출하 때마다 새 재주문점 기준으로 부족 여부가 자동 판단된다</text><text x="490.0" y="464" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">3부 21장 — JEDAIX 운영 매뉴얼 v9 4~5장의 가상 사례(A정밀부품㈜) 재구성 (정인호, 2026)</text></svg>