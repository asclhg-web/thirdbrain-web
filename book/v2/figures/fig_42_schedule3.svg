<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560"><rect width="960" height="560" fill="#FFFFFF"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1E2761"/></marker><marker id="ahT" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#028090"/></marker><marker id="ahA" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#B85042"/></marker></defs><text x="480.0" y="40" font-family="NanumGothic" font-size="24" font-weight="bold" fill="#1E2761" text-anchor="middle">대·중·소 일정계획의 3층 구조</text><text x="480.0" y="66" font-family="NanumGothic" font-size="13.5" font-weight="bold" fill="#5A6472" text-anchor="middle">수주 변경은 중일정이 흡수하고, 소일정과 발송으로 즉시 전달된다</text><rect x="150" y="100" width="620" height="100" rx="10" fill="#1E2761" stroke="#1E2761" stroke-width="1.6"/><text x="200" y="140" font-family="NanumGothic" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="start">대일정계획</text><text x="200" y="166" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#CADCFC" text-anchor="start">수주~출하의 큰 흐름 · 능력·설비·인원의 대강</text><rect x="40" y="122" width="92" height="56" rx="8" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.2"/><text x="86" y="145" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">월 단위</text><text x="86" y="163" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">1년</text><rect x="790" y="122" width="130" height="56" rx="8" fill="#E8F0FB" stroke="#028090" stroke-width="1.3"/><text x="855" y="144" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#1E2761" text-anchor="middle">경영·영업·생산관리</text><text x="855" y="164" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#028090" text-anchor="middle">Odoo MPS</text><line x1="460" y1="202" x2="460" y2="214" stroke="#1E2761" stroke-width="2.5" marker-end="url(#ah)"/><rect x="150" y="216" width="620" height="100" rx="10" fill="#028090" stroke="#1E2761" stroke-width="1.6"/><text x="200" y="256" font-family="NanumGothic" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="start">중일정계획</text><text x="200" y="282" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#CADCFC" text-anchor="start">공정별 부하·능력 조정 · 자재 수배 · 변경 흡수</text><rect x="40" y="238" width="92" height="56" rx="8" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.2"/><text x="86" y="261" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">주 단위</text><text x="86" y="279" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">1~3개월</text><rect x="790" y="238" width="130" height="56" rx="8" fill="#E8F0FB" stroke="#028090" stroke-width="1.3"/><text x="855" y="260" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#1E2761" text-anchor="middle">생산관리</text><text x="855" y="280" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#028090" text-anchor="middle">frePPLe APS</text><line x1="460" y1="318" x2="460" y2="330" stroke="#1E2761" stroke-width="2.5" marker-end="url(#ah)"/><rect x="150" y="332" width="620" height="100" rx="10" fill="#CADCFC" stroke="#1E2761" stroke-width="1.6"/><text x="200" y="372" font-family="NanumGothic" font-size="17" font-weight="bold" fill="#1E2761" text-anchor="start">소일정계획</text><text x="200" y="398" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#5A6472" text-anchor="start">작업자·설비 배정 · 작업 순서 · 발송(디스패칭)</text><rect x="40" y="354" width="92" height="56" rx="8" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.2"/><text x="86" y="377" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">일 단위</text><text x="86" y="395" font-family="NanumGothic" font-size="11.5" font