<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545"><rect width="960" height="545" fill="#FFFFFF"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1E2761"/></marker><marker id="ahT" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#028090"/></marker><marker id="ahA" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#B85042"/></marker><marker id="ahG" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#5A6472"/></marker></defs><text x="480.0" y="40" font-family="NanumGothic" font-size="22" font-weight="bold" fill="#1E2761" text-anchor="middle">지식의 3정 — 문서 체계의 정위치·정품·정량</text><text x="480.0" y="66" font-family="NanumGothic" font-size="13" font-weight="normal" fill="#5A6472" text-anchor="middle">그릇이 있다고 지식이 고이지는 않는다 — 위키의 실패를 막는 세 개의 기준</text><rect x="40" y="100" width="285" height="380" rx="10" fill="#FFFFFF" stroke="#1E2761" stroke-width="1.6"/><rect x="40" y="100" width="285" height="36" rx="10" fill="#1E2761" stroke="#1E2761" stroke-width="1.6"/><rect x="40" y="118" width="285" height="18" fill="#1E2761"/><text x="182" y="123" font-family="NanumGothic" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">정위치 — 문서의 주소</text><rect x="58" y="152" width="112" height="28" rx="6" fill="#CADCFC" stroke="#1E2761" stroke-width="1.3"/><text x="114" y="170" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#1E2761" text-anchor="middle">지식센터</text><line x1="76" y1="180" x2="76" y2="349" stroke="#5A6472" stroke-width="1.2"/><line x1="76" y1="209" x2="94" y2="209" stroke="#5A6472" stroke-width="1.2"/><rect x="94" y="196" width="118" height="26" rx="5" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.1"/><text x="153" y="213" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#1E2761" text-anchor="middle">제품</text><line x1="76" y1="247" x2="94" y2="247" stroke="#5A6472" stroke-width="1.2"/><rect x="94" y="234" width="118" height="26" rx="5" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.1"/><text x="153" y="251" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#1E2761" text-anchor="middle">고객 응대</text><line x1="76" y1="285" x2="94" y2="285" stroke="#5A6472" stroke-width="1.2"/><rect x="94" y="272" width="118" height="26" rx="5" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.1"/><text x="153" y="289" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#1E2761" text-anchor="middle">설비</text><line x1="76" y1="349" x2="94" y2="349" stroke="#5A6472" stroke-width="1.2"/><rect x="94" y="336" width="118" height="26" rx="5" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.1"/><text x="153" y="353" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#1E2761" text-anchor="middle">규정</text><line x1="112" y1="298" x2="112" y2="316" stroke="#5A6472" stroke-width="1.2"/><line x1="112" y1="316" x2="130" y2="316" stroke="#5A6472" stroke-width="1.2"/><rect x="130" y="304" width="152" height="24" rx="5" fill="#FFFFFF" stroke="#028090" stroke-width="1.1"/><text x="206" y="320" font-family="NanumGothic" font-size="11" font-weight="normal" fill="#028090" text-anchor="middle">설비 E-42 조치 절차</text><text x="182" y="398" font-family="NanumGothic" font-size="11" font-weight="normal" fill="#5A6472" text-anchor="middle">한 주제 = 한 아티클, 트리의 단 한 곳</text><text x="182" y="415" font-family="NanumGothic" font-size="11" font-weight="normal" fill="#5A6472" text-anchor="middle">1층은 조직도가 아니라 질문 유형으로</text><rect x="350" y="100" width="285" height="380" rx="10" fill="#FFFFFF" stroke="#028090" stroke-width="1.6"/><rect x="350" y="100" width="285" height="36" rx="10" fill="#028090" stroke="#028090" stroke-width="1.6"/><rect x="350" y="118" width="285" height="18" fill="#028090"/><text x="492" y="123" font-family="NanumGothic" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">정품 — 검증된 내용만</text><rect x="375" y="150" width="235" height="215" rx="6" fill="#FFFFFF" stroke="#1E2761" stroke-width="1.3"/><rect x="375" y="150" width="235" height="30" rx="6" fill="#CADCFC"/><rect x="375" y="168" width="235" height="12" fill="#CADCFC"/><text x="492" y="170" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#1E2761" text-anchor="middle">표준 템플릿</text><text x="390" y="203" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#1E2761" text-anchor="start">목적</text><line x1="470" y1="199" x2="595" y2="199" stroke="#C6CCD5" stroke-width="1.4"/><line x1="375" y1="217" x2="610" y2="217" stroke="#D5DAE1" stroke-width="1"/><text x="390" y="240" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#1E2761" text-anchor="start">적용 범위</text><line x1="470" y1="236" x2="595" y2="236" stroke="#C6CCD5" stroke-width="1.4"/><line x1="375" y1="254" x2="610" y2="254" stroke="#D5DAE1" stroke-width="1"/><text x="390" y="277" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#1E2761" text-anchor="start">절차</text><line x1="470" y1="273" x2="595" y2="273" stroke="#C6CCD5" stroke-width="1.4"/><line x1="375" y1="291" x2="610" y2="291" stroke="#D5DAE1" stroke-width="1"/><text x="390" y="314" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#1E2761" text-anchor="start">예외</text><line x1="470" y1="310" x2="595" y2="310" stroke="#C6CCD5" stroke-width="1.4"/><line x1="375" y1="328" x2="610" y2="328" stroke="#D5DAE1" stroke-width="1"/><text x="390" y="351" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#1E2761" text-anchor="start">개정 이력</text><line x1="470" y1="347" x2="595" y2="347" stroke="#C6CCD5" stroke-width="1.4"/><text x="492" y="398" font-family="NanumGothic" font-size="11" font-weight="normal" fill="#5A6472" text-anchor="middle">소유자 검증을 통과한 문서만</text><text x="492" y="415" font-family="NanumGothic" font-size="11" font-weight="normal" fill="#5A6472" text-anchor="middle">AI 학습 소스로 지정한다</text><text x="492" y="445" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#B85042" text-anchor="middle">구버전·오류는 발견 즉시 교정</text><rect x="660" y="100" width="285" height="380" rx="10" fill="#FFFFFF" stroke="#1E2761" stroke-width="1.6"/><rect x="660" y="100" width="285" height="36" rx="10" fill="#1E2761" stroke="#1E2761" stroke-width="1.6"/><rect x="660" y="118" width="285" height="18" fill="#1E2761"/><text x="802" y="123" font-family="NanumGothic" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">정량 — 최신성의 관리</text><rect x="676" y="152" width="253" height="56" rx="7" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.2"/><text x="690" y="175" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#1E2761" text-anchor="start">소유자·차기 검토일</text><text x="690" y="194" font-family="NanumGothic" font-size="11" font-weight="normal" fill="#5A6472" text-anchor="start">모든 아티클에 지정</text><rect x="676" y="218" width="253" height="56" rx="7" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.2"/><text x="690" y="241" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#1E2761" text-anchor="start">참조 수 진단(분기)</text><text x="690" y="260" font-family="NanumGothic" font-size="11" font-weight="normal" fill="#5A6472" text-anchor="start">상위·하위 아티클 점검</text><rect x="676" y="284" width="253" height="56" rx="7" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.2"/><text x="690" y="307" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#1E2761" text-anchor="start">오답 신고 → 원인 문서 교정</text><text x="690" y="326" font-family="NanumGothic" font-size="11" font-weight="normal" fill="#5A6472" text-anchor="start">AI가 틀리면 문서를 고친다</text><rect x="676" y="350" width="253" height="56" rx="7" fill="#FFFFFF" stroke="#B85042" stroke-width="1.2" stroke-dasharray="6,5"/><text x="690" y="373" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#B85042" text-anchor="start">빨간 패 — 보관 처리</text><text x="690" y="392" font-family="NanumGothic" font-size="11" font-weight="normal" fill="#5A6472" text-anchor="start">2년 무참조·담당 변경 문서</text><text x="802" y="432" font-family="NanumGothic" font-size="11" font-weight="normal" fill="#5A6472" text-anchor="middle">중복도 공백도 없이 —</text><text x="802" y="449" font-family="NanumGothic" font-size="11" font-weight="normal" fill="#5A6472" text-anchor="middle">필요한 문서가 필요한 만큼만</text><text x="480.0" y="508" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#1E2761" text-anchor="middle">죽은 문서가 AI 답변을 오염시키기 전에 — 문서의 3정은 AI 도입의 전제 조건이다</text><text x="480.0" y="531" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">2부 15장 — 지식센터: 트리의 정위치 · 템플릿의 정품 · 최신성의 정량</text></svg>