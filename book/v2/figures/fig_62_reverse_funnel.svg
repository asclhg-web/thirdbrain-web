<svg xmlns="http://www.w3.org/2000/svg" width="940" height="570" viewBox="0 0 940 570"><rect width="940" height="570" fill="#FFFFFF"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1E2761"/></marker><marker id="ahT" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#028090"/></marker><marker id="ahA" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#B85042"/></marker><marker id="ahG" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#5A6472"/></marker></defs><text x="470.0" y="38" font-family="NanumGothic" font-size="22" font-weight="bold" fill="#1E2761" text-anchor="middle">KGI→KPI→데이터→모델 — 역방향 설계</text><text x="470.0" y="62" font-family="NanumGothic" font-size="12.5" font-weight="normal" fill="#5A6472" text-anchor="middle">측정 체계는 목표에서 내려가며 설계된다(GQM) — 기술에서 출발하는 상향식은 실패한다</text><text x="320" y="102" font-family="NanumGothic" font-size="14" font-weight="bold" fill="#028090" text-anchor="middle">역방향 설계 — 목표에서 데이터로</text><rect x="110.0" y="120" width="420" height="60" rx="10" fill="#1E2761" stroke="#1E2761" stroke-width="1.6"/><text x="320" y="146" font-family="NanumGothic" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">KGI — 경영 목표</text><text x="320" y="167" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#CADCFC" text-anchor="middle">예: 2년 내 납기준수율 95% 달성</text><line x1="320" y1="182" x2="320" y2="192" stroke="#1E2761" stroke-width="2" marker-end="url(#ah)"/><rect x="140.0" y="194" width="360" height="60" rx="10" fill="#028090" stroke="#1E2761" stroke-width="1.6"/><text x="320" y="220" font-family="NanumGothic" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">경영 질문</text><text x="320" y="241" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#CADCFC" text-anchor="middle">지연의 주된 원인 공정은 어디인가</text><line x1="320" y1="256" x2="320" y2="266" stroke="#1E2761" stroke-width="2" marker-end="url(#ah)"/><rect x="170.0" y="268" width="300" height="60" rx="10" fill="#CADCFC" stroke="#1E2761" stroke-width="1.6"/><text x="320" y="294" font-family="NanumGothic" font-size="14" font-weight="bold" fill="#1E2761" text-anchor="middle">KPI — 판정 지표</text><text x="320" y="315" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">공정별 지연 기여도·준수율</text><line x1="320" y1="330" x2="320" y2="340" stroke="#1E2761" stroke-width="2" marker-end="url(#ah)"/><rect x="200.0" y="342" width="240" height="60" rx="10" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.6"/><text x="320" y="368" font-family="NanumGothic" font-size="14" font-weight="bold" fill="#1E2761" text-anchor="middle">필요 데이터</text><text x="320" y="389" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">작업지시·POP 실적·외주 납기</text><line x1="320" y1="404" x2="320" y2="414" stroke="#1E2761" stroke-width="2" marker-end="url(#ah)"/><rect x="227.5" y="416" width="185" height="60" rx="10" fill="#EEF1F5" stroke="#1E2761" stroke-width="1.6"/><text x="320" y="442" font-family="NanumGothic" font-size="14" font-weight="bold" fill="#1E2761" text-anchor="middle">모델·온톨로지</text><text x="320" y="463" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">언제나 마지막에 선택된다</text><text x="75" y="118" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#028090" text-anchor="middle">설계 방향</text><line x1="75" y1="128" x2="75" y2="470" stroke="#028090" stroke-width="3" marker-end="url(#ahT)"/><line x1="590" y1="95" x2="590" y2="490" stroke="#D5DBE3" stroke-width="1" stroke-dasharray="4,4"/><text x="760" y="102" font-family="NanumGothic" font-size="14" font-weight="bold" fill="#5A6472" text-anchor="middle">상향식 — 기술에서 출발</text><rect x="650" y="124" width="220" height="64" rx="10" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.5" stroke-dasharray="5,4"/><text x="760" y="150" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#5A6472" text-anchor="middle">경영 목표 달성 …?</text><text x="760" y="170" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">질문 없는 지표·모델</text><rect x="650" y="410" width="220" height="64" rx="10" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.5"/><text x="760" y="436" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#454C57" text-anchor="middle">일단 AI·모델부터 도입</text><text x="760" y="456" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">쓸모는 나중에 찾자</text><line x1="760" y1="406" x2="760" y2="192" stroke="#5A6472" stroke-width="2.5" marker-end="url(#ahG)" stroke-dasharray="6,4"/><line x1="732" y1="272" x2="788" y2="328" stroke="#B85042" stroke-width="7"/><line x1="788" y1="272" x2="732" y2="328" stroke="#B85042" stroke-width="7"/><text x="760" y="360" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#B85042" text-anchor="middle">범위 폭주 · 편익 증명 실패</text><text x="470.0" y="540" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">수집할 데이터와 만들 모델이 질문 목록에서 연역된다 — 범위 통제·사전 편익 정의·자명한 우선순위 (6.2절)</text></svg>