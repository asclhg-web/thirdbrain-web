<svg xmlns="http://www.w3.org/2000/svg" width="940" height="520" viewBox="0 0 940 520"><rect width="940" height="520" fill="#FFFFFF"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1E2761"/></marker><marker id="ahT" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#028090"/></marker><marker id="ahA" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#B85042"/></marker><marker id="ahG" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#5A6472"/></marker></defs><text x="470.0" y="40" font-family="NanumGothic" font-size="24" font-weight="bold" fill="#1E2761" text-anchor="middle">눈으로 보는 관리의 3단계 진화</text><text x="470.0" y="66" font-family="NanumGothic" font-size="13.5" font-weight="bold" fill="#5A6472" text-anchor="middle">목적은 같다 — 이상 발생과 발견 사이의 시간을 최소로 만드는 것</text><rect x="60" y="480" width="268" height="10" rx="4" fill="#EEF1F5" stroke="#EEF1F5" stroke-width="0"/><rect x="60" y="330" width="268" height="150" rx="10" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.8"/><text x="194.0" y="360" font-family="NanumGothic" font-size="16" font-weight="bold" fill="#1E2761" text-anchor="middle">1단계 · 보이는 공장</text><text x="194.0" y="382" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#028090" text-anchor="middle">상태를 화면에 띄운다</text><text x="194.0" y="410" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">칸반 보드 = 디지털 관리판</text><text x="194.0" y="432" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">대시보드 = 디지털 안돈</text><text x="194.0" y="454" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">단, 사람이 봐야 발견된다</text><rect x="336" y="385" width="268" height="105" rx="4" fill="#EEF1F5" stroke="#EEF1F5" stroke-width="0"/><rect x="336" y="235" width="268" height="150" rx="10" fill="#CADCFC" stroke="#1E2761" stroke-width="1.8"/><text x="470.0" y="265" font-family="NanumGothic" font-size="16" font-weight="bold" fill="#1E2761" text-anchor="middle">2단계 · 말하는 공장</text><text x="470.0" y="287" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#028090" text-anchor="middle">데이터가 먼저 말을 건다</text><text x="470.0" y="315" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">이상 감지·자동 경보</text><text x="470.0" y="337" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">아침 한 문장 브리핑</text><text x="470.0" y="359" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">시선 없이도 즉시 발견</text><rect x="612" y="290" width="268" height="200" rx="4" fill="#EEF1F5" stroke="#EEF1F5" stroke-width="0"/><rect x="612" y="140" width="268" height="150" rx="10" fill="#028090" stroke="#028090" stroke-width="1.8"/><text x="746.0" y="170" font-family="NanumGothic" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3단계 · 추론하는 공장</text><text x="746.0" y="192" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#CADCFC" text-anchor="middle">원인을 찾고 미래를 내다본다</text><text x="746.0" y="220" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#E8F0FB" text-anchor="middle">불량 원인 역추적</text><text x="746.0" y="242" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#E8F0FB" text-anchor="middle">납기 What-if 시뮬레이션</text><text x="746.0" y="264" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#E8F0FB" text-anchor="middle">디지털 트윈에 내일을 묻다</text><line x1="332" y1="370" x2="330" y2="345" stroke="#028090" stroke-width="2.5" marker-end="url(#ahT)"/><line x1="608" y1="275" x2="606" y2="250" stroke="#028090" stroke-width="2.5" marker-end="url(#ahT)"/><text x="470.0" y="506" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">프롤로그 — '보는 주체'에 AI가 더해지고, '보는 시제'에 미래가 더해진다</text></svg>