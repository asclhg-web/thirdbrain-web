<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><rect width="1000" height="560" fill="#FFFFFF"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1E2761"/></marker><marker id="ahT" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#028090"/></marker><marker id="ahA" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#B85042"/></marker></defs><text x="500.0" y="40" font-family="NanumGothic" font-size="24" font-weight="bold" fill="#1E2761" text-anchor="middle">AX 컨설팅 5단계 로드맵</text><text x="500.0" y="66" font-family="NanumGothic" font-size="13.5" font-weight="normal" fill="#5A6472" text-anchor="middle">진단에서 환류까지 — 목표지향 설계(KGI→KPI→데이터→모델)의 실행 순서</text><path d="M28.0,100 h158 l18,26 l-18,26 h-158 l18,-26 z" fill="#028090" /><text x="116.0" y="122" font-family="NanumGothic" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1. 진단</text><text x="116.0" y="141" font-family="NanumGothic" font-size="12" font-weight="normal" fill="#CADCFC" text-anchor="middle">2~4주</text><rect x="28.0" y="170" width="176" height="118" rx="8" fill="#E8F0FB" stroke="#028090" stroke-width="1.4"/><text x="116.0" y="190" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#028090" text-anchor="middle">핵심 활동</text><text x="116.0" y="210" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">경영 질문 정의</text><text x="116.0" y="228" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">데이터 성숙도 진단</text><text x="116.0" y="246" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">현장 5S 진단</text><rect x="28.0" y="300" width="176" height="96" rx="8" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.2"/><text x="116.0" y="320" font-fam