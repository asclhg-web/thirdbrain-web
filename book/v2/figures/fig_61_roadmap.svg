idth="1.2"/><text x="884.0" y="320" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#1E2761" text-anchor="middle">산출물</text><text x="884.0" y="340" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">운영 리듬</text><text x="884.0" y="358" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">KPI 개선 실적</text><path d="M942.0,430 Q500.0,525 58.0,430" fill="none" stroke="#B85042" stroke-width="2.5" marker-end="url(#ahA)" stroke-dasharray="7,5"/><text x="500.0" y="502" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#B85042" text-anchor="middle">학습 루프 — 환류의 결과가 다음 진단의 입력이 된다</text><text x="500.0" y="544" font-family="NanumGothic" font-size="12" font-weight="normal" fill="#5A6472" text-anchor="middle">각 단계의 성공 판정을 통과한 뒤 다음 단계로 진입한다 (1부 6장)</text></svg>