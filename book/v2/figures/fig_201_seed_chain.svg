<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><rect width="1000" height="560" fill="#FFFFFF"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1E2761"/></marker><marker id="ahT" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#028090"/></marker><marker id="ahA" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#B85042"/></marker></defs><text x="500.0" y="40" font-family="NanumGothic" font-size="23" font-weight="bold" fill="#1E2761" text-anchor="middle">Seed 성장 사슬 — 한 문장이 온톨로지가 되기까지</text><text x="500.0" y="66" font-family="NanumGothic" font-size="13" font-weight="normal" fill="#5A6472" text-anchor="middle">PTGDA: Progressive Tacit-to-Governed Discovery &amp; Adoption</text><circle cx="95.0" cy="155.0" r="10" fill="#D8E4F5" stroke="#1E2761" stroke-width="1.2"/><rect x="21.0" y="210" width="148" height="96" rx="9" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.5"/><text x="95.0" y="244" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#1E2761" text-anchor="middle">현장의 발화</text><text x="95.0" y="268" font-family="NanumGothic" font-size="10.5" font-weight="normal" fill="#5A6472" text-anchor="middle">“지난달 C라인에서” “그</text><text x="95.0" y="283" font-family="NanumGothic" font-size="10.5" font-weight="normal" fill="#5A6472" text-anchor="middle">런 적이 두 번…”</text><line x1="170.0" y1="258" x2="182.0" y2="258" stroke="#028090" stroke-width="2.2" marker-end="url(#ahT)"/><circle cx="257.0" cy="152.0" r="16" fill="#BFD3EE" stroke="#1E2761" stroke-width="1.2"/><rect x="183.0" y="210" width="148" height="96" rx="9" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.5"/><text x="257.0" y="244" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#1E2761" text-anchor="middle">Linguistic Seed</text><text x="257.0" y="268" font-family="NanumGothic" font-size="10.5" font-weight="normal" fill="#5A6472" text-anchor="middle">문장을 Chunk로 분해</text><line x1="332.0" y1="258" x2="344.0" y2="258" stroke="#028090" stroke-width="2.2" marker-end="url(#ahT)"/><circle cx="419.0" cy="149.0" r="22" fill="#9FC2E4" stroke="#1E2761" stroke-width="1.2"/><rect x="345.0" y="210" width="148" height="96" rx="9" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.5"/><text x="419.0" y="244" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#1E2761" text-anchor="middle">Semantic Seed</text><text x="419.0" y="268" font-family="NanumGothic" font-size="10.5" font-weight="normal" fill="#5A6472" text-anchor="middle">TA 코드 분류 (경계 유</text><text x="419.0" y="283" font-family="NanumGothic" font-size="10.5" font-weight="normal" fill="#5A6472" text-anchor="middle">형)</text><line x1="494.0" y1="258" x2="506.0" y2="258" stroke="#028090" stroke-width="2.2" marker-end="url(#ahT)"/><circle cx="581.0" cy="146.0" r="28" fill="#7AA8D2" stroke="#1E2761" stroke-width="1.2"/><rect x="507.0" y="210" width="148" height="96" rx="9" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.5"/><text x="581.0" y="244" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#1E2761" text-anchor="middle">SEED_HYPOTHESIS</text><text x="581.0" y="268" font-family="NanumGothic" font-size="10.5" font-weight="normal" fill="#5A6472" text-anchor="middle">공명 신호로 가설 강화</text><line x1="656.0" y1="258" x2="668.0" y2="258" stroke="#028090" stroke-width="2.2" marker-end="url(#ahT)"/><circle cx="743.0" cy="143.0" r="34" fill="#3E7CB8" stroke="#1E2761" stroke-width="1.2"/><rect x="669.0" y="210" width="148" height="96" rx="9" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.5"/><text x="743.0" y="244" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#1E2761" text-anchor="middle">Ontological Seed</text><text x="743.0" y="268" font-family="NanumGothic" font-size="10.5" font-weight="normal" fill="#5A6472" text-anchor="middle">HITL 승인으로 확정</text><line x1="818.0" y1="258" x2="830.0" y2="258" stroke="#028090" stroke-width="2.2" marker-end="url(#ahT)"/><circle cx="905.0" cy="140.0" r="40" fill="#028090" stroke="#1E2761" stroke-width="1.2"/><path d="M893.0,140.0 l8,10 l16,-20" stroke="#FFFFFF" stroke-width="4" fill="none"/><rect x="831.0" y="210" width="148" height="96" rx="9" fill="#E5F4F3" stroke="#028090" stroke-width="1.5"/><text x="905.0" y="238" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#028090" text-anchor="middle">OWL</text><text x="905.0" y="255" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#028090" text-anchor="middle">Class·Property</text><text x="905.0" y="268" font-family="NanumGothic" font-size="10.5" font-weight="normal" fill="#5A6472" text-anchor="middle">실행 가능한 의미 구조</text><rect x="815.0" y="184" width="18" height="24" rx="3" fill="#B85042"/><text x="824.0" y="178" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#B85042" text-anchor="middle">HITL 게이트</text><text x="500.0" y="370" font-family="NanumGothic" font-size="13" font-weight="normal" fill="#5A6472" text-anchor="middle">씨앗이 자랄수록(원이 커질수록) 확신도가 오르고, 확정의 문턱에는 반드시 사람의 승인이 있다</text><text x="500.0" y="394" font-family="NanumGothic" font-size="13" font-weight="normal" fill="#5A6472" text-anchor="middle">확정된 OWL 클래스는 Agent Workflow의 실행 근거가 되어 표준 업무 흐름에 반영된다</text><rect x="150" y="420" width="700" height="66" rx="10" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.3"/><text x="500.0" y="447" font-family="NanumGothic" font-size="12" font-weight="normal" fill="#1E2761" text-anchor="middle">예시: “지난달 C라인에서 그런 적이 두 번 있었습니다”</text><text x="500.0" y="469" font-family="NanumGothic" font-size="12" font-weight="normal" fill="#1E2761" text-anchor="middle">→ TA 분류 → 가설 → HITL 확정 → InventoryRisk 클래스 → 안전재고 재계산 Agent</text><text x="500.0" y="544" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">3부 20장 — PTGDA와 TA: 암묵지 발굴의 알고리즘 (정인호, 2026)</text></svg>