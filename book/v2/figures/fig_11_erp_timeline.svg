="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">경영 논리의 충돌</text><line x1="579.0" y1="376" x2="589.0" y2="376" stroke="#B85042" stroke-width="1.8" marker-end="url(#ahA)" stroke-dasharray="4,3"/><circle cx="678.0" cy="128" r="8" fill="#1E2761"/><text x="678.0" y="114" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#1E2761" text-anchor="middle">2000~2010년대</text><line x1="678.0" y1="136" x2="678.0" y2="160" stroke="#1E2761" stroke-width="1.3"/><rect x="590.0" y="160" width="176" height="44" rx="9" fill="#1E2761" stroke="#1E2761" stroke-width="1.5"/><text x="678.0" y="188" font-family="NanumGothic" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">확장·클라우드</text><rect x="590.0" y="218" width="176" height="96" rx="9" fill="#E8F0FB" stroke="#028090" stroke-width="1.4"/><text x="678.0" y="242" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#028090" text-anchor="middle">해결한 문제</text><text x="678.0" y="268" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#454C57" text-anchor="middle">기업 경계의 확장</text><text x="678.0" y="289" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#454C57" text-anchor="middle">SaaS로 문턱 하락</text><rect x="590.0" y="328" width="176" height="96" rx="9" fill="#FFFFFF" stroke="#B85042" stroke-width="1.4" stroke-dasharray="6,4"/><text x="678.0" y="352" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#B85042" text-anchor="middle">남긴 한계</text><text x="678.0" y="378" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">데이터는 느는데</text><text x="678.0" y="399" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">판단 능력은 정체</text><line x1="767.0" y1="376" x2="777.0" y2="376" stroke="#B85042" stroke-width="1.8" marker-end="url(#ahA)" stroke-dasharray="4,3"/><circle cx="866.0" cy="128" r="8" fill="#028090"/><text x="866.0" y="114" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#028090" text-anchor="middle">2020년대~</text><line x1="866.0" y1="136" x2="866.0" y2="160" stroke="#028090" stroke-width="1.3"/><rect x="778.0" y="160" width="176" height="44" rx="9" fill="#028090" stroke="#028090" stroke-width="1.5"/><text x="866.0" y="188" font-family="NanumGothic" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">AI ERP</text><rect x="778.0" y="218" width="176" height="96" rx="9" fill="#E8F0FB" stroke="#028090" stroke-width="1.4"/><text x="866.0" y="242" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#028090" text-anchor="middle">해결한 문제</text><text x="866.0" y="268" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#454C57" text-anchor="middle">판단의 지능화</text><text x="866.0" y="289" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#454C57" text-anchor="middle">(진행 중)</text><rect x="778.0" y="328" width="176" height="96" rx="9" fill="#FFFFFF" stroke="#B85042" stroke-width="1.4" stroke-dasharray="6,4"/><text x="866.0" y="352" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#B85042" text-anchor="middle">남긴 한계</text><text x="866.0" y="378" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">의미 통합·신뢰성</text><text x="866.0" y="399" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">— 이 책의 주제</text><text x="490.0" y="486" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#1E2761" text-anchor="middle">기록 능력은 완성으로 향했으나 판단 능력은 정체되었다 — 한계가 다음 세대를 낳는다</text><text x="490.0" y="514" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">1부 1장 — ERP 50년과 지능형 ERP</text></svg>