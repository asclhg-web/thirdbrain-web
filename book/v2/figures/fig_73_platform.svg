<svg xmlns="http://www.w3.org/2000/svg" width="940" height="700" viewBox="0 0 940 700"><rect width="940" height="700" fill="#FFFFFF"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1E2761"/></marker><marker id="ahT" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#028090"/></marker><marker id="ahA" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#B85042"/></marker></defs><text x="470.0" y="40" font-family="NanumGothic" font-size="24" font-weight="bold" fill="#1E2761" text-anchor="middle">예측 플랫폼 통합 아키텍처</text><text x="470.0" y="66" font-family="NanumGothic" font-size="13.5" font-weight="bold" fill="#5A6472" text-anchor="middle">One Platform + Three Boosters — 1부의 결론 그림</text><rect x="150" y="95" width="640" height="82" rx="10" fill="#1E2761" stroke="#1E2761" stroke-width="1.6"/><text x="470.0" y="129" font-family="NanumGothic" font-size="16.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">경영의 질문</text><text x="470.0" y="153" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#CADCFC" text-anchor="middle">자연어 질의 · 아침 브리핑 · What-if 시뮬레이션</text><rect x="150" y="187" width="640" height="82" rx="10" fill="#028090" stroke="#1E2761" stroke-width="1.6"/><text x="470.0" y="221" font-family="NanumGothic" font-size="16.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">지식 계층 — 3rd Brain</text><text x="470.0" y="245" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#CADCFC" text-anchor="middle">Neo4j 온톨로지 지식그래프 + LLM(Claude/Ollama) · GraphRAG 융합판단</text><rect x="150" y="279" width="640" height="82" rx="10" fill="#CADCFC" stroke="#1E2761" stroke-width="1.6"/><text x="470.0" y="313" font-family="NanumGothic" font-size="16.5" font-weight="bold" fill="#1E2761" text-anchor="middle">AX 계층</text><text x="470.0" y="337" font-family="NanumGothic" font-size="12.5"