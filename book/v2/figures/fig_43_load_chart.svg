71428572" stroke="#EEF1F5" stroke-width="1"/><text x="100" y="149.71428571428572" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#5A6472" text-anchor="end">200</text><text x="46" y="295.0" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#1E2761" text-anchor="middle"></text><text x="40" y="295.0" font-family="NanumGothic" font-size="11.5" fill="#5A6472" text-anchor="middle" transform="rotate(-90 40 295.0)">부하 공수 (시간/주)</text><rect x="137.0" y="271.42857142857144" width="86" height="188.57142857142856" rx="3" fill="#028090" stroke="#028090" stroke-width="1"/><text x="180" y="261.42857142857144" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#5A6472" text-anchor="middle">120h</text><text x="180" y="484" font-family="NanumGothic" font-size="13.5" font-weight="bold" fill="#1E2761" text-anchor="middle">선반</text><rect x="287.0" y="232.14285714285714" width="86" height="227.85714285714286" rx="3" fill="#028090" stroke="#028090" stroke-width="1"/><text x="330" y="222.14285714285714" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#5A6472" text-anchor="middle">145h</text><text x="330" y="484" font-family="NanumGothic" font-size="13.5" font-weight="bold" fill="#1E2761" text-anchor="middle">밀링</text><rect x="437.0" y="208.57142857142858" width="86" height="251.42857142857142" rx="3" fill="#028090" stroke="#028090" stroke-width="1"/><rect x="437.0" y="153.57142857142856" width="86" height="55.00000000000003" rx="3" fill="#B85042" stroke="#B85042" stroke-width="1"/><text x="480" y="143.57142857142856" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#B85042" text-anchor="middle">195h</text><text x="480" y="484" font-family="NanumGothic" font-size="13.5" font-weight="bold" fill="#B85042" text-anchor="middle">용접</text><text x="480" y="504" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#B85042" text-anchor="middle">← Neck 공정</text><rect x="587.0" y="255.71428571428572" width="86" height="204.28571428571428" rx="3" fill="#028090" stroke="#028090" stroke-width="1"/><text x="630" y="245.71428571428572" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#5A6472" text-anchor="middle">130h</text><text x="630" y="484" font-family="NanumGothic" font-size="13.5" font-weight="bold" fill="#1E2761" text-anchor="middle">조립</text><rect x="737.0" y="326.42857142857144" width="86" height="133.57142857142856" rx="3" fill="#028090" stroke="#028090" stroke-width="1"/><text x="780" y="316.42857142857144" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#5A6472" text-anchor="middle">85h</text><text x="780" y="484" font-family="NanumGothic" font-size="13.5" font-weight="bold" fill="#1E2761" text-anchor="middle">도장</text><line x1="110" y1="208.57142857142858" x2="880" y2="208.57142857142858" stroke="#1E2761" stroke-width="2.5" stroke-dasharray="8,5"/><text x="118" y="198.57142857142858" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#1E2761" text-anchor="start">능력선 160h/주</text><line x1="110" y1="460" x2="880" y2="460" stroke="#5A6472" stroke-width="1.5"/><rect x="600" y="116" width="300" height="96" rx="10" fill="#FFFFFF" stroke="#B85042" stroke-width="1.6"/><text x="620" y="142" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#B85042" text-anchor="start">넥(Neck) 공정 — 부하 195h &gt; 능력 160h</text><text x="620" y="166" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="start">초과 35h가 전체 산출량과 납기를 결정한다</text><text x="620" y="186" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="start">대책: 잔업·응원·내외작 전환·로트 분할</text><line x1="596" y1="170" x2="530" y2="150" stroke="#B85042" stroke-width="2" marker-end="url(#ahA)" stroke-dasharray="5,4"/><text x="470.0" y="536" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#1E2761" text-anchor="middle">실전은 중점주의 — 넥 공정의 공수계획만 정밀하면 전체 계획의 실행 가능성이 대략 보증된다</text><text x="470.0" y="564" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">1부 4장 — frePPLe의 자원별 부하 화면이 이 산적표의 디지털 대응물이다</text></svg>