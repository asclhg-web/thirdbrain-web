<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440"><rect width="960" height="440" fill="#FFFFFF"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1E2761"/></marker><marker id="ahT" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#028090"/></marker><marker id="ahA" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#B85042"/></marker><marker id="ahG" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#5A6472"/></marker></defs><text x="480.0" y="40" font-family="NanumGothic" font-size="24" font-weight="bold" fill="#1E2761" text-anchor="middle">30년의 진화 — 관리판에서 예측 플랫폼으로</text><text x="480.0" y="66" font-family="NanumGothic" font-size="13.5" font-weight="normal" fill="#5A6472" text-anchor="middle">원리는 같다: 보이게 만든 자에게만 현장은 말을 건다</text><line x1="50" y1="128" x2="925" y2="128" stroke="#5A6472" stroke-width="2" marker-end="url(#ahG)"/><circle cx="150" cy="128" r="9" fill="#1E2761"/><text x="150" y="112" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">1990년대</text><rect x="50.0" y="158" width="200" height="168" rx="10" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.6"/><line x1="150" y1="137" x2="150" y2="158" stroke="#1E2761" stroke-width="1.4"/><text x="150" y="188" font-family="NanumGothic" font-size="14.5" font-weight="bold" fill="#1E2761" text-anchor="middle">관리판·3정5S</text><text x="150" y="210" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#5A6472" text-anchor="middle">현장의 규율</text><line x1="68.0" y1="222" x2="232.0" y2="222" stroke="#CADCFC" stroke-width="1"/><text x="150" y="246" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">벽의 관리판·작업 카드</text><text x="150" y="268" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">눈으로 보는 관리</text><text x="150" y="290" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">사람이 걸어서 확인</text><circle cx="370" cy="128" r="9" fill="#1E2761"/><text x="370" y="112" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">2000년대</text><rect x="270.0" y="158" width="200" height="168" rx="10" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.6"/><line x1="370" y1="137" x2="370" y2="158" stroke="#1E2761" stroke-width="1.4"/><text x="370" y="188" font-family="NanumGothic" font-size="14.5" font-weight="bold" fill="#1E2761" text-anchor="middle">ERP 전산화</text><text x="370" y="210" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#5A6472" text-anchor="middle">기록의 통합</text><line x1="288.0" y1="222" x2="452.0" y2="222" stroke="#CADCFC" stroke-width="1"/><text x="370" y="246" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">전표 → 데이터베이스</text><text x="370" y="268" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">월말 결산 며칠 → 하루</text><text x="370" y="290" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">기록은 디지털, 판단은 사람</text><circle cx="590" cy="128" r="9" fill="#028090"/><text x="590" y="112" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#028090" text-anchor="middle">2010년대</text><rect x="490.0" y="158" width="200" height="168" rx="10" fill="#E5F4F3" stroke="#028090" stroke-width="1.6"/><line x1="590" y1="137" x2="590" y2="158" stroke="#028090" stroke-width="1.4"/><text x="590" y="188" font-family="NanumGothic" font-size="14.5" font-weight="bold" fill="#028090" text-anchor="middle">스마트공장 DX</text><text x="590" y="210" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#5A6472" text-anchor="middle">실시간 수집</text><line x1="508.0" y1="222" x2="672.0" y2="222" stroke="#CADCFC" stroke-width="1"/><text x="590" y="246" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">바코드·POP·IoT</text><text x="590" y="268" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">대시보드 가시화</text><text x="590" y="290" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">다수가 기초 수준에 머묾</text><circle cx="810" cy="128" r="9" fill="#028090"/><text x="810" y="112" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#028090" text-anchor="middle">2020년대~</text><rect x="710.0" y="158" width="200" height="168" rx="10" fill="#E5F4F3" stroke="#028090" stroke-width="1.6"/><line x1="810" y1="137" x2="810" y2="158" stroke="#028090" stroke-width="1.4"/><text x="810" y="188" font-family="NanumGothic" font-size="14.5" font-weight="bold" fill="#028090" text-anchor="middle">LLM 예측 플랫폼 AX</text><text x="810" y="210" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#B85042" text-anchor="middle">판단의 지능화</text><line x1="728.0" y1="222" x2="892.0" y2="222" stroke="#CADCFC" stroke-width="1"/><text x="810" y="246" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">언어를 다루는 AI</text><text x="810" y="268" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">수집→학습→추론→환류</text><text x="810" y="290" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">스스로 정확해지는 예측</text><text x="480.0" y="394" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#1E2761" text-anchor="middle">기록의 시대에서 판단의 시대로 — 30년의 원칙을 데이터의 세계로 옮기는 것이 AX다</text><text x="480.0" y="422" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">프롤로그 — 왜 지금, 지능형 AI ERP인가</text></svg>