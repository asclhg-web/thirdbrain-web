<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430"><rect width="980" height="430" fill="#FFFFFF"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1E2761"/></marker><marker id="ahT" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#028090"/></marker><marker id="ahA" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#B85042"/></marker><marker id="ahG" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#5A6472"/></marker></defs><text x="490.0" y="38" font-family="NanumGothic" font-size="23" font-weight="bold" fill="#1E2761" text-anchor="middle">3부의 지도 — 네 개의 징검돌</text><text x="490.0" y="64" font-family="NanumGothic" font-size="13" font-weight="normal" fill="#5A6472" text-anchor="middle">문제를 보고 → 말이 시스템이 되고 → 실행하고 → 증명한다</text><ellipse cx="133.0" cy="406" rx="92" ry="9" fill="#EEF1F5"/><rect x="28.0" y="250" width="210" height="140" rx="12" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.6"/><rect x="40.0" y="262" width="52" height="24" rx="12" fill="#1E2761" stroke="#1E2761" stroke-width="1"/><text x="66.0" y="279" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">18장</text><text x="133.0" y="314" font-family="NanumGothic" font-size="17" font-weight="bold" fill="#1E2761" text-anchor="middle">사각지대</text><text x="133.0" y="338" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#028090" text-anchor="middle">문제를 본다</text><text x="133.0" y="362" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">ERP가 비추지 못하는 곳을</text><text x="133.0" y="378" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">먼저 드러낸다</text><line x1="240.0" y1="302" x2="264.0" y2="296" stroke="#1E2761" stroke-width="2.5" marker-end="url(#ah)"/><ellipse cx="371.0" cy="368" rx="92" ry="9" fill="#EEF1F5"/><rect x="266.0" y="212" width="210" height="140" rx="12" fill="#CADCFC" stroke="#1E2761" stroke-width="1.6"/><rect x="278.0" y="224" width="52" height="24" rx="12" fill="#1E2761" stroke="#1E2761" stroke-width="1"/><text x="304.0" y="241" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">19장</text><text x="371.0" y="276" font-family="NanumGothic" font-size="17" font-weight="bold" fill="#1E2761" text-anchor="middle">JEDAIX 온톨로지</text><text x="371.0" y="300" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#028090" text-anchor="middle">말이 시스템이 된다</text><text x="371.0" y="324" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">5 Space × 6 Station으로</text><text x="371.0" y="340" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">회사의 말을 구조화한다</text><line x1="478.0" y1="264" x2="502.0" y2="258" stroke="#1E2761" stroke-width="2.5" marker-end="url(#ah)"/><ellipse cx="609.0" cy="330" rx="92" ry="9" fill="#EEF1F5"/><rect x="504.0" y="174" width="210" height="140" rx="12" fill="#CFE9E7" stroke="#1E2761" stroke-width="1.6"/><rect x="516.0" y="186" width="52" height="24" rx="12" fill="#1E2761" stroke="#1E2761" stroke-width="1"/><text x="542.0" y="203" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">20장</text><text x="609.0" y="238" font-family="NanumGothic" font-size="17" font-weight="bold" fill="#1E2761" text-anchor="middle">실행</text><text x="609.0" y="262" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#028090" text-anchor="middle">에이전트와 Odoo</text><text x="609.0" y="286" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">온톨로지가 실행 코드가</text><text x="609.0" y="302" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">되어 움직인다</text><line x1="716.0" y1="226" x2="740.0" y2="220" stroke="#1E2761" stroke-width="2.5" marker-end="url(#ah)"/><ellipse cx="847.0" cy="292" rx="92" ry="9" fill="#EEF1F5"/><rect x="742.0" y="136" width="210" height="140" rx="12" fill="#028090" stroke="#028090" stroke-width="1.6"/><rect x="754.0" y="148" width="52" height="24" rx="12" fill="#1E2761" stroke="#1E2761" stroke-width="1"/><text x="780.0" y="165" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">21장</text><text x="847.0" y="200" font-family="NanumGothic" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">증명</text><text x="847.0" y="224" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#CFF0EC" text-anchor="middle">사례와 첫 90일</text><text x="847.0" y="248" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#CADCFC" text-anchor="middle">현장 사례와 함께</text><text x="847.0" y="264" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#CADCFC" text-anchor="middle">첫 90일 로드맵을 제시한다</text><text x="490.0" y="414" font-family="NanumGothic" font-size="12" font-weight="normal" fill="#5A6472" text-anchor="middle">3부 — 사각지대에서 시작해 90일의 증명으로 끝난다</text></svg>