<svg xmlns="http://www.w3.org/2000/svg" width="920" height="480" viewBox="0 0 920 480"><rect width="920" height="480" fill="#FFFFFF"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1E2761"/></marker><marker id="ahT" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#028090"/></marker><marker id="ahA" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#B85042"/></marker><marker id="ahG" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#5A6472"/></marker></defs><text x="460.0" y="40" font-family="NanumGothic" font-size="22" font-weight="bold" fill="#1E2761" text-anchor="middle">현금전환주기(CCC) — 현금은 며칠 잠겨 있는가</text><text x="460.0" y="66" font-family="NanumGothic" font-size="14" font-weight="bold" fill="#028090" text-anchor="middle">CCC = 재고일수(DIO) + 채권일수(DSO) - 채무일수(DPO)</text><line x1="80.0" y1="140" x2="868.0" y2="140" stroke="#5A6472" stroke-width="1.4"/><text x="80.0" y="108" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#1E2761" text-anchor="middle">원자재 매입·입고</text><text x="80.0" y="124" font-family="NanumGothic" font-size="11" font-weight="normal" fill="#5A6472" text-anchor="middle">Day 0</text><circle cx="80.0" cy="140" r="4" fill="#1E2761"/><line x1="80.0" y1="144" x2="80.0" y2="330" stroke="#C6CCD5" stroke-width="1" stroke-dasharray="3,3"/><text x="241.0" y="108" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#1E2761" text-anchor="middle">매입 대금 지급</text><text x="241.0" y="124" font-family="NanumGothic" font-size="11" font-weight="normal" fill="#5A6472" text-anchor="middle">Day 23</text><circle cx="241.0" cy="140" r="4" fill="#1E2761"/><line x1="241.0" y1="144" x2="241.0" y2="330" stroke="#C6CCD5" stroke-width="1" stroke-dasharray="3,3"/><text x="444.0" y="108" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#1E2761" text-anchor="middle">제품 판매(출하)</text><text x="444.0" y="124" font-family="NanumGothic" font-size="11" font-weight="normal" fill="#5A6472" text-anchor="middle">Day 52</text><circle cx="444.0" cy="140" r="4" fill="#1E2761"/><line x1="444.0" y1="144" x2="444.0" y2="330" stroke="#C6CCD5" stroke-width="1" stroke-dasharray="3,3"/><text x="850.0" y="108" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#1E2761" text-anchor="middle">판매 대금 회수</text><text x="850.0" y="124" font-family="NanumGothic" font-size="11" font-weight="normal" fill="#5A6472" text-anchor="middle">Day 110</text><circle cx="850.0" cy="140" r="4" fill="#1E2761"/><line x1="850.0" y1="144" x2="850.0" y2="330" stroke="#C6CCD5" stroke-width="1" stroke-dasharray="3,3"/><rect x="80.0" y="170" width="364.0" height="46" rx="6" fill="#CADCFC" stroke="#1E2761" stroke-width="1.5"/><text x="262.0" y="198" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">재고일수 DIO 52일</text><rect x="444.0" y="170" width="406.0" height="46" rx="6" fill="#E5F4F3" stroke="#028090" stroke-width="1.5"/><text x="647.0" y="198" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#028090" text-anchor="middle">채권일수 DSO 58일</text><rect x="80.0" y="240" width="161.0" height="46" rx="6" fill="#1E2761" stroke="#1E2761" stroke-width="1.5"/><text x="160.5" y="268" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">채무 DPO 23일</text><text x="255.0" y="268" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="start">← 공급업체 외상이 현금 지출을 미룬다</text><line x1="241.0" y1="322" x2="850.0" y2="322" stroke="#B85042" stroke-width="2.5"/><line x1="241.0" y1="313" x2="241.0" y2="331" stroke="#B85042" stroke-width="2.5"/><line x1="850.0" y1="313" x2="850.0" y2="331" stroke="#B85042" stroke-width="2.5"/><text x="545.5" y="352" font-family="NanumGothic" font-size="14" font-weight="bold" fill="#B85042" text-anchor="middle">현금전환주기 CCC = 52 + 58 - 23 = 87일</text><text x="545.5" y="374" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">Day 23(현금 지출)부터 Day 110(현금 회수)까지 — 현금이 잠겨 있는 기간</text><text x="460.0" y="412" font-family="NanumGothic" font-size="12" font-weight="normal" fill="#5A6472" text-anchor="middle">루프의 목표: 87일 → 70일 — 채권 회수 강화(DSO)와 안전재고 하향(DIO)으로 단축한다</text><text x="460.0" y="466" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">2부 14장 — 수치는 14.5절 DMAIC 시나리오 예시</text></svg>