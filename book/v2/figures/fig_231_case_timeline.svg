<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520"><rect width="980" height="520" fill="#FFFFFF"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1E2761"/></marker><marker id="ahT" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#028090"/></marker><marker id="ahA" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#B85042"/></marker><marker id="ahG" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#5A6472"/></marker></defs><text x="490.0" y="40" font-family="NanumGothic" font-size="22" font-weight="bold" fill="#1E2761" text-anchor="middle">안전재고 사례 타임라인 — 증언에서 O2C 반영까지</text><text x="490.0" y="66" font-family="NanumGothic" font-size="12.2" font-weight="normal" fill="#5A6472" text-anchor="middle">관통 5단계가 한 회전을 완주한 기록: 위화감의 언어화 → 확정 → 대안 → 승인 → 표준 반영</text><line x1="60" y1="260" x2="920" y2="260" stroke="#1E2761" stroke-width="2.5"/><line x1="918" y1="260" x2="934" y2="260" stroke="#1E2761" stroke-width="2.5" marker-end="url(#ah)"/><circle cx="110" cy="260" r="9" fill="#028090" stroke="#FFFFFF" stroke-width="2"/><line x1="110" y1="251" x2="110" y2="236" stroke="#5A6472" stroke-width="1.2"/><rect x="24" y="140" width="172" height="92" rx="9" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.4"/><text x="110" y="162" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#1E2761" text-anchor="middle">증언</text><text x="110" y="182" font-family="NanumGothic" font-size="10.4" font-weight="normal" fill="#5A6472" text-anchor="middle">“지난달 C라인에서</text><text x="110" y="198" font-family="NanumGothic" font-size="10.4" font-weight="normal" fill="#5A6472" text-anchor="middle">두 번 있었습니다”</text><text x="110" y="214" font-family="NanumGothic" font-size="10.4" font-weight="normal" fill="#5A6472" text-anchor="middle">6 Station 대화</text><text x="110" y="378" font-family="NanumGothic" font-size="10" font-weight="normal" fill="#5A6472" text-anchor="middle"></text><circle cx="300" cy="260" r="9" fill="#028090" stroke="#FFFFFF" stroke-width="2"/><line x1="300" y1="269" x2="300" y2="284" stroke="#5A6472" stroke-width="1.2"/><rect x="214" y="288" width="172" height="92" rx="9" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.3"/><text x="300" y="310" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#1E2761" text-anchor="middle">공명·반복 확인</text><text x="300" y="330" font-family="NanumGothic" font-size="10.4" font-weight="normal" fill="#5A6472" text-anchor="middle">공명 신호 점등</text><text x="300" y="346" font-family="NanumGothic" font-size="10.4" font-weight="normal" fill="#5A6472" text-anchor="middle">3라운드에 걸쳐</text><text x="300" y="362" font-family="NanumGothic" font-size="10.4" font-weight="normal" fill="#5A6472" text-anchor="middle">wave 상승</text><text x="300" y="242" font-family="NanumGothic" font-size="10" font-weight="normal" fill="#5A6472" text-anchor="middle"></text><circle cx="490" cy="260" r="9" fill="#1E2761" stroke="#FFFFFF" stroke-width="2"/><line x1="490" y1="251" x2="490" y2="236" stroke="#5A6472" stroke-width="1.2"/><rect x="404" y="140" width="172" height="92" rx="9" fill="#E5F4F3" stroke="#028090" stroke-width="1.4"/><text x="490" y="162" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#028090" text-anchor="middle">TA06 확정</text><text x="490" y="182" font-family="NanumGothic" font-size="10.4" font-weight="normal" fill="#5A6472" text-anchor="middle">임계 70% 돌파(입자화)</text><text x="490" y="198" font-family="NanumGothic" font-size="10.4" font-weight="normal" fill="#5A6472" text-anchor="middle">품질손실비 계정 반영</text><text x="490" y="214" font-family="NanumGothic" font-size="10.4" font-weight="normal" fill="#5A6472" text-anchor="middle">연 약 6천만 원 추정</text><text x="490" y="378" font-family="NanumGothic" font-size="10" font-weight="normal" fill="#5A6472" text-anchor="middle"></text><circle cx="680" cy="260" r="9" fill="#028090" stroke="#FFFFFF" stroke-width="2"/><line x1="680" y1="269" x2="680" y2="284" stroke="#5A6472" stroke-width="1.2"/><rect x="594" y="288" width="172" height="92" rx="9" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.3"/><text x="680" y="310" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#1E2761" text-anchor="middle">Agent 실행</text><text x="680" y="330" font-family="NanumGothic" font-size="10.4" font-weight="normal" fill="#5A6472" text-anchor="middle">정량화·보정계수 계산</text><text x="680" y="346" font-family="NanumGothic" font-size="10.4" font-weight="normal" fill="#5A6472" text-anchor="middle">안전재고 100→115</text><text x="680" y="362" font-family="NanumGothic" font-size="10.4" font-weight="normal" fill="#5A6472" text-anchor="middle">ROP 150→173 · 승인</text><text x="680" y="242" font-family="NanumGothic" font-size="10" font-weight="normal" fill="#5A6472" text-anchor="middle"></text><circle cx="870" cy="260" r="9" fill="#028090" stroke="#FFFFFF" stroke-width="2"/><line x1="870" y1="251" x2="870" y2="236" stroke="#5A6472" stroke-width="1.2"/><rect x="784" y="140" width="172" height="92" rx="9" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.4"/><text x="870" y="162" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#1E2761" text-anchor="middle">O2C 반영</text><text x="870" y="182" font-family="NanumGothic" font-size="10.4" font-weight="normal" fill="#5A6472" text-anchor="middle">모든 수주→수금 흐름에</text><text x="870" y="198" font-family="NanumGothic" font-size="10.4" font-weight="normal" fill="#5A6472" text-anchor="middle">새 값 자동 적용</text><text x="870" y="214" font-family="NanumGothic" font-size="10.4" font-weight="normal" fill="#5A6472" text-anchor="middle">BPMN 위 실시간 추적</text><text x="870" y="378" font-family="NanumGothic" font-size="10" font-weight="normal" fill="#5A6472" text-anchor="middle"></text><text x="110" y="120" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#028090" text-anchor="middle">① 진단</text><text x="300" y="400" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#028090" text-anchor="middle">② 확정으로 가는 검증</text><text x="490" y="120" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#028090" text-anchor="middle">③ 확정·근거</text><text x="680" y="400" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#028090" text-anchor="middle">④ 대안·HITL</text><text x="870" y="120" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#028090" text-anchor="middle">⑤ 표준 반영</text><text x="490.0" y="448" font-family="NanumGothic" font-size="12.2" font-weight="bold" fill="#1E2761" text-anchor="middle">사람이 개입한 지점은 대화와 승인뿐 — 전 과정(발화·확인·근거·승인)이 재구성 가능한 기록으로 남는다</text><text x="490.0" y="504" font-family="NanumGothic" font-size="11" font-weight="normal" fill="#5A6472" text-anchor="middle">※ A정밀부품㈜는 JEDAIX 운영 매뉴얼 v9가 예시로 쓰는 가상의 제조회사다 — 방법론 작동의 기록이지 실측 성과가 아니다</text></svg>