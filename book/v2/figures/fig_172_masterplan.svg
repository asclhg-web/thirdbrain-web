="512" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#B85042" text-anchor="middle">관문① 시스템 월 마감 · 이중 입력 제거</text><text x="580.0" y="534" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#B85042" text-anchor="middle">관문② 재고 정확도 95% · 실적 24시간 이내</text><text x="865.0" y="512" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#B85042" text-anchor="middle">관문③ 질문 커버리지 70% · 루프 1회전 완주</text><text x="500.0" y="560" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#5A6472" text-anchor="middle">관문 미달 시의 표준 대응은 일정 연기가 아니라 범위 축소 — 모듈 수를 줄여서라도 관문을 먼저 통과한다</text><text x="500.0" y="596" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">2부 17장 — 관문은 일정의 장식이 아니라 다음 투자의 조건이다 (17.5절)</text></svg>