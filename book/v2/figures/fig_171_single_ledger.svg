11475" font-family="NanumGothic" font-size="14.5" font-weight="bold" fill="#1E2761" text-anchor="middle">제조</text><text x="564.6181241970322" y="502.75831390311475" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#028090" text-anchor="middle">13장</text><text x="564.6181241970322" y="522.7583139031148" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#5A6472" text-anchor="middle">MRP·작업지시·실적</text><rect x="260.3818758029678" y="457.75831390311475" width="150" height="80" rx="12" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.8"/><text x="335.3818758029678" y="483.75831390311475" font-family="NanumGothic" font-size="14.5" font-weight="bold" fill="#1E2761" text-anchor="middle">회계</text><text x="335.3818758029678" y="502.75831390311475" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#028090" text-anchor="middle">14장</text><text x="335.3818758029678" y="522.7583139031148" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#5A6472" text-anchor="middle">자동 분개·실시간 원가</text><rect x="189.543979322445" y="239.7416860968853" width="150" height="80" rx="12" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.8"/><text x="264.543979322445" y="265.7416860968853" font-family="NanumGothic" font-size="14.5" font-weight="bold" fill="#1E2761" text-anchor="middle">분석·AI</text><text x="264.543979322445" y="284.7416860968853" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#028090" text-anchor="middle">15~16장</text><text x="264.543979322445" y="304.7416860968853" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#5A6472" text-anchor="middle">브리핑·예측·환류</text><circle cx="450.0" cy="340" r="92" fill="#1E2761"/><text x="450.0" y="322" font-family="NanumGothic" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">단일 PostgreSQL</text><text x="450.0" y="346" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#CADCFC" text-anchor="middle">하나의 원장</text><text x="450.0" y="368" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#CADCFC" text-anchor="middle">같은 품목·거래처 코드</text><text x="450.0" y="598" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#1E2761" text-anchor="middle">사건은 발생 지점에서 한 번 기록되고, 관점으로 다르게 조회될 뿐 복제되지 않는다 (17.3절)</text><text x="450.0" y="618" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">2부 17장 — 이 단일성이 온톨로지 역추적과 DMAIC 루프의 성립 전제다</text></svg>