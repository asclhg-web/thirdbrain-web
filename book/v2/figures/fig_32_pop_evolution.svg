<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="#FFFFFF"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1E2761"/></marker><marker id="ahT" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#028090"/></marker><marker id="ahA" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#B85042"/></marker><marker id="ahG" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#5A6472"/></marker></defs><text x="480.0" y="40" font-family="NanumGothic" font-size="23" font-weight="bold" fill="#1E2761" text-anchor="middle">데이터 수집의 3단 진화 — 종이에서 생산 시점 관리로</text><text x="480.0" y="66" font-family="NanumGothic" font-size="13.5" font-weight="normal" fill="#5A6472" text-anchor="middle">입력 비용이 0에 가까워질수록 데이터는 진실에 가까워진다</text><rect x="30.0" y="100" width="280" height="400" rx="12" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.8"/><text x="170.0" y="132" font-family="NanumGothic" font-size="15.5" font-weight="bold" fill="#5A6472" text-anchor="middle">① 종이 작업일보</text><rect x="144.0" y="162" width="52" height="68" rx="3" fill="#FFFFFF" stroke="#5A6472" stroke-width="1.6"/><line x1="154.0" y1="178" x2="186.0" y2="178" stroke="#5A6472" stroke-width="1.6"/><line x1="154.0" y1="192" x2="186.0" y2="192" stroke="#5A6472" stroke-width="1.6"/><line x1="154.0" y1="206" x2="186.0" y2="206" stroke="#5A6472" stroke-width="1.6"/><line x1="154.0" y1="220" x2="186.0" y2="220" stroke="#5A6472" stroke-width="1.6"/><text x="170.0" y="272" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#454C57" text-anchor="middle">퇴근 전에 몰아서 기입</text><text x="170.0" y="295" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#454C57" text-anchor="middle">사후 보고 — 액션 불가</text><text x="170.0" y="318" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#454C57" text-anchor="middle">기억 보정·왜곡이 섞임</text><line x1="50.0" y1="352" x2="290.0" y2="352" stroke="#5A6472" stroke-width="1" stroke-dasharray="3,3"/><text x="50.0" y="382" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="start">입력 시점</text><text x="50.0" y="404" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#454C57" text-anchor="start">하루 뒤 (일 단위)</text><text x="50.0" y="436" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="start">데이터 특징</text><text x="50.0" y="458" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#454C57" text-anchor="start">왜곡·누락 빈발</text><text x="50.0" y="478" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#454C57" text-anchor="start">— 아무도 보지 않는다</text><line x1="313.0" y1="300.0" x2="337.0" y2="300.0" stroke="#028090" stroke-width="2.6" marker-end="url(#ahT)"/><rect x="340.0" y="100" width="280" height="400" rx="12" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.8"/><text x="480.0" y="132" font-family="NanumGothic" font-size="15.5" font-weight="bold" fill="#1E2761" text-anchor="middle">② 바코드 작업표</text><rect x="440.0" y="170" width="80" height="52" rx="3" fill="#FFFFFF" stroke="#1E2761" stroke-width="1.6"/><rect x="450.0" y="180" width="3" height="32" fill="#1E2761"/><rect x="456.0" y="180" width="2" height="32" fill="#1E2761"/><rect x="461.0" y="180" width="4" height="32" fill="#1E2761"/><rect x="468.0" y="180" width="2" height="32" fill="#1E2761"/><rect x="473.0" y="180" width="3" height="32" fill="#1E2761"/><rect x="479.0" y="180" width="5" height="32" fill="#1E2761"/><rect x="487.0" y="180" width="2" height="32" fill="#1E2761"/><rect x="492.0" y="180" width="3" height="32" fill="#1E2761"/><rect x="498.0" y="180" width="2" height="32" fill="#1E2761"/><rect x="503.0" y="180" width="4" height="32" fill="#1E2761"/><text x="480.0" y="272" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#454C57" text-anchor="middle">착수·완료 시 그 자리에서 스캔</text><text x="480.0" y="295" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#454C57" text-anchor="middle">식별 정보는 바코드에 사전 내장</text><text x="480.0" y="318" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#454C57" text-anchor="middle">입력은 1초 — 수량만 키 입력</text><line x1="360.0" y1="352" x2="600.0" y2="352" stroke="#1E2761" stroke-width="1" stroke-dasharray="3,3"/><text x="360.0" y="382" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#1E2761" text-anchor="start">입력 시점</text><text x="360.0" y="404" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#454C57" text-anchor="start">작업 직후 (준실시간)</text><text x="360.0" y="436" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#1E2761" text-anchor="start">데이터 특징</text><text x="360.0" y="458" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#454C57" text-anchor="start">식별 오류 소멸</text><text x="360.0" y="478" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#454C57" text-anchor="start">집계 자동화</text><line x1="623.0" y1="300.0" x2="647.0" y2="300.0" stroke="#028090" stroke-width="2.6" marker-end="url(#ahT)"/><rect x="650.0" y="100" width="280" height="400" rx="12" fill="#E5F4F3" stroke="#028090" stroke-width="1.8"/><text x="790.0" y="132" font-family="NanumGothic" font-size="15.5" font-weight="bold" fill="#028090" text-anchor="middle">③ 태블릿 POP</text><rect x="756.0" y="166" width="68" height="60" rx="7" fill="#454C57" stroke="#454C57" stroke-width="1.6"/><rect x="763.0" y="173" width="54" height="40" rx="3" fill="#E5F4F3" stroke="#028090" stroke-width="1"/><circle cx="790.0" cy="220" r="2.6" fill="#FFFFFF"/><text x="790.0" y="272" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#454C57" text-anchor="middle">작업 그 자체가 기록이 된다</text><text x="790.0" y="295" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#454C57" text-anchor="middle">실적·품질·공수 동시 수집</text><text x="790.0" y="318" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#454C57" text-anchor="middle">IoT로 측정값 입력도 자동</text><line x1="670.0" y1="352" x2="910.0" y2="352" stroke="#028090" stroke-width="1" stroke-dasharray="3,3"/><text x="670.0" y="382" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#028090" text-anchor="start">입력 시점</text><text x="670.0" y="404" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#454C57" text-anchor="start">실시간 (초 단위)</text><text x="670.0" y="436" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#028090" text-anchor="start">데이터 특징</text><text x="670.0" y="458" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#454C57" text-anchor="start">공명정대한 공장</text><text x="670.0" y="478" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#454C57" text-anchor="start">작업일보 폐지</text><text x="480.0" y="554" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#1E2761" text-anchor="middle">원칙: 중요 데이터는 바코드에 미리 넣고, 현장에는 스캔 한 번·터치 한 번만 요구한다</text><text x="480.0" y="582" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">1부 3장 — POP: 작업일보의 폐지와 공명정대한 공장</text></svg>