<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620"><rect width="960" height="620" fill="#FFFFFF"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1E2761"/></marker><marker id="ahT" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#028090"/></marker><marker id="ahA" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#B85042"/></marker></defs><text x="480.0" y="40" font-family="NanumGothic" font-size="23" font-weight="bold" fill="#1E2761" text-anchor="middle">OEE 폭포 — 100%는 어디서 깎여 나가는가</text><text x="480.0" y="66" font-family="NanumGothic" font-size="13" font-weight="normal" fill="#5A6472" text-anchor="middle">OEE = 가동률(A) × 성능(P) × 품질(Q) — 손실을 보이게 만드는 것이 개선의 출발</text><rect x="56" y="150.0" width="98" height="320.0" rx="4" fill="#1E2761" stroke="#1E2761" stroke-width="1.2"/><text x="105.0" y="172.0" font-family="NanumGothic" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">100%</text><text x="105.0" y="492" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">총가용시간</text><line x1="154" y1="150.0" x2="168" y2="150.0" stroke="#5A6472" stroke-width="1" stroke-dasharray="3,3"/><rect x="168" y="150.0" width="98" height="25.6" rx="4" fill="#B85042" stroke="#8B3A30" stroke-width="1.2"/><text x="217.0" y="167.8" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">-8%</text><text x="217.0" y="492" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">계획 정지</text><line x1="266" y1="175.6" x2="280" y2="175.6" stroke="#5A6472" stroke-width="1" stroke-dasharray="3,3"/><rect x="280" y="175.6" width="98" height="44.800000000000004" rx="4" fill="#B85042" stroke="#8B3A30" stroke-width="1.2"/><text x="329.0" y="203.0" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">-14%</text><text x="329.0" y="492" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">고장</text><text x="329.0" y="508" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">준비교체</text><line x1="378" y1="220.4" x2="392" y2="220.4" stroke="#5A6472" stroke-width="1" stroke-dasharray="3,3"/><rect x="392" y="220.39999999999998" width="98" height="249.60000000000002" rx="4" fill="#CADCFC" stroke="#1E2761" stroke-width="1.2"/><text x="441.0" y="242.39999999999998" font-family="NanumGothic" font-size="14" font-weight="bold" fill="#1E2761" text-anchor="middle">78%</text><text x="441.0" y="492" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">가동시간</text><text x="441.0" y="532" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#028090" text-anchor="middle">가동률 A=78%</text><line x1="490" y1="220.39999999999998" x2="504" y2="220.39999999999998" stroke="#5A6472" stroke-width="1" stroke-dasharray="3,3"/><rect x="504" y="220.39999999999998" width="98" height="51.2" rx="4" fill="#B85042" stroke="#8B3A30" stroke-width="1.2"/><text x="553.0" y="250.99999999999997" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">-16%</text><text x="553.0" y="492" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">속도 손실</text><text x="553.0" y="508" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">소정지</text><line x1="602" y1="271.59999999999997" x2="616" y2="271.59999999999997" stroke="#5A6472" stroke-width="1" stroke-dasharray="3,3"/><rect x="616" y="271.6" width="98" height="198.4" rx="4" fill="#CADCFC" stroke="#1E2761" stroke-width="1.2"/><text x="665.0" y="293.6" font-family="NanumGothic" font-size="14" font-weight="bold" fill="#1E2761" text-anchor="middle">62%</text><text x="665.0" y="492" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">정미가동</text><text x="665.0" y="532" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#028090" text-anchor="middle">성능 P=79%</text><line x1="714" y1="271.6" x2="728" y2="271.6" stroke="#5A6472" stroke-width="1" stroke-dasharray="3,3"/><rect x="728" y="271.6" width="98" height="22.400000000000002" rx="4" fill="#B85042" stroke="#8B3A30" stroke-width="1.2"/><text x="777.0" y="287.8" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">-7%</text><text x="777.0" y="492" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">불량</text><text x="777.0" y="508" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">재작업</text><line x1="826" y1="294.0" x2="840" y2="294.0" stroke="#5A6472" stroke-width="1" stroke-dasharray="3,3"/><rect x="840" y="294.0" width="98" height="176.0" rx="4" fill="#028090" stroke="#1E2761" stroke-width="1.2"/><text x="889.0" y="316.0" font-family="NanumGothic" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">55%</text><text x="889.0" y="492" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">OEE</text><text x="889.0" y="532" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#028090" text-anchor="middle">품질 Q=89%</text><text x="480.0" y="560" font-family="NanumGothic" font-size="12.5" font-weight="normal" fill="#5A6472" text-anchor="middle">세계 수준 OEE는 85%, 국내 중소 제조 평균은 50~60%대 — 손실 구간이 곧 개선 과제 목록이다</text><text x="480.0" y="604" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">2부 13장 — 제조 관리: 생산의 컨설팅 (수치는 예시)</text></svg>