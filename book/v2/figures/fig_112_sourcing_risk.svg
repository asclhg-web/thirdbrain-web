<svg xmlns="http://www.w3.org/2000/svg" width="920" height="620" viewBox="0 0 920 620"><rect width="920" height="620" fill="#FFFFFF"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1E2761"/></marker><marker id="ahT" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#028090"/></marker><marker id="ahA" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#B85042"/></marker><marker id="ahG" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#5A6472"/></marker></defs><text x="460.0" y="38" font-family="NanumGothic" font-size="23" font-weight="bold" fill="#1E2761" text-anchor="middle">단일 소싱 리스크 — 한 업체에만 이어진 품목</text><text x="460.0" y="64" font-family="NanumGothic" font-size="13.5" font-weight="normal" fill="#5A6472" text-anchor="middle">품목-공급업체 연결망에서 대체 공급선이 없는 품목이 위험 노드다</text><text x="194.0" y="116" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#5A6472" text-anchor="middle">공급업체</text><rect x="110" y="157.0" width="168" height="58" rx="8" fill="#CADCFC" stroke="#1E2761" stroke-width="1.5"/><text x="194.0" y="182" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">업체 A</text><text x="194.0" y="202" font-family="NanumGothic" font-size="10.8" font-weight="normal" fill="#5A6472" text-anchor="middle">납기준수율 94%</text><rect x="110" y="297.0" width="168" height="58" rx="8" fill="#CADCFC" stroke="#1E2761" stroke-width="1.5"/><text x="194.0" y="322" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">업체 B</text><text x="194.0" y="342" font-family="NanumGothic" font-size="10.8" font-weight="normal" fill="#5A6472" text-anchor="middle">납기준수율 88%</text><rect x="110" y="437.0" width="168" height="58" rx="8" fill="#FFFFFF" stroke="#B85042" stroke-width="1.5"/><tex