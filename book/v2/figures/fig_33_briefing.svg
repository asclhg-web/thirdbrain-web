<svg xmlns="http://www.w3.org/2000/svg" width="940" height="620" viewBox="0 0 940 620"><rect width="940" height="620" fill="#FFFFFF"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1E2761"/></marker><marker id="ahT" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#028090"/></marker><marker id="ahA" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#B85042"/></marker><marker id="ahG" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#5A6472"/></marker></defs><text x="470.0" y="40" font-family="NanumGothic" font-size="24" font-weight="bold" fill="#1E2761" text-anchor="middle">'말하는 공장'의 아침 브리핑</text><text x="470.0" y="66" font-family="NanumGothic" font-size="13.5" font-weight="bold" fill="#5A6472" text-anchor="middle">시스템이 이상을 먼저 감지하고, 맥락을 붙여, 자연어로 말을 건다</text><rect x="100" y="100" width="280" height="460" rx="26" fill="#454C57" stroke="#454C57" stroke-width="2"/><rect x="112" y="134" width="256" height="398" rx="8" fill="#FFFFFF" stroke="#C4CAD3" stroke-width="1"/><text x="240.0" y="122" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">07:30</text><rect x="112" y="134" width="256" height="34" rx="8" fill="#1E2761" stroke="#1E2761" stroke-width="1"/><rect x="112" y="152" width="256" height="16" fill="#1E2761"/><text x="240.0" y="156" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">아침 브리핑 — 말하는 공장</text><rect x="124" y="184" width="232" height="74" rx="10" fill="#E8F0FB" stroke="#B85042" stroke-width="1.3"/><text x="136" y="206" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#B85042" text-anchor="start">납기 경보</text><text x="136" y="228" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#454C57" text-anchor="start">OO정밀 브래킷 납기 D-2</text><text x="136" y="246" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#454C57" text-anchor="start">— 조립 2공정에서 대기 중</text><rect x="124" y="272" width="232" height="74" rx="10" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.3"/><text x="136" y="294" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#1E2761" text-anchor="start">재고 부족</text><text x="136" y="316" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#454C57" text-anchor="start">알루미늄 원자재 가용 3일분</text><text x="136" y="334" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#454C57" text-anchor="start">— 발주 초안 생성해 두었습니다</text><rect x="124" y="360" width="232" height="74" rx="10" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.3"/><text x="136" y="382" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#1E2761" text-anchor="start">품질 이상</text><text x="136" y="404" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#454C57" text-anchor="start">5번 품목 불량 2건 — 원인</text><text x="136" y="422" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#454C57" text-anchor="start">후보: 금형 마모(유사 3건)</text><rect x="124" y="448" width="232" height="56" rx="10" fill="#028090" stroke="#028090" stroke-width="1.3"/><text x="136" y="471" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#FFFFFF" text-anchor="start">발주를 승인하시겠습니까?</text><text x="136" y="491" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#D9F0EE" text-anchor="start">[승인]  [보류]  [상세 보기]</text><rect x="470" y="200" width="400" height="84" rx="10" fill="#FFFFFF" stroke="#1E2761" stroke-width="1.5"/><text x="490" y="226" font-family="NanumGothic" font-size="13.5" font-weight="bold" fill="#1E2761" text-anchor="start">① 이상 감지</text><text x="490" y="250" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="start">재고·진도·품질 지표가 관리 한계를</text><text x="490" y="270" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="start">벗어나면 이벤트 발생 (사람을 기다리지 않는다)</text><path d="M466,242 Q420,231.5 366,221" fill="none" stroke="#028090" stroke-width="1.8" marker-end="url(#ahT)" stroke-dasharray="5,4"/><rect x="470" y="330" width="400" height="84" rx="10" fill="#FFFFFF" stroke="#1E2761" stroke-width="1.5"/><text x="490" y="356" font-family="NanumGothic" font-size="13.5" font-weight="bold" fill="#1E2761" text-anchor="start">② 맥락 결합</text><text x="490" y="380" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="start">관련 수주·자재·과거 이력을 단일 DB와</text><text x="490" y="400" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="start">지식 계층에서 모아 붙인다 (n8n 워크플로)</text><path d="M466,372 Q420,340.5 366,309" fill="none" stroke="#028090" stroke-width="1.8" marker-end="url(#ahT)" stroke-dasharray="5,4"/><rect x="470" y="460" width="400" height="84" rx="10" fill="#FFFFFF" stroke="#1E2761" stroke-width="1.5"/><text x="490" y="486" font-family="NanumGothic" font-size="13.5" font-weight="bold" fill="#1E2761" text-anchor="start">③ 자연어 브리핑</text><text x="490" y="510" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="start">LLM이 한 문단으로 요약해 모바일로 발송,</text><text x="490" y="530" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="start">액션 후보 제시 — 승인(HITL)은 사람의 몫</text><path d="M466,502 Q420,486.0 366,470" fill="none" stroke="#028090" stroke-width="1.8" marker-end="url(#ahT)" stroke-dasharray="5,4"/><text x="470.0" y="604" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">1부 3장 — 순찰이 '확인의 시간'에서 '대화의 시간'으로 바뀐다 (문안은 예시)</text></svg>