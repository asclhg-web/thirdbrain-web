<svg xmlns="http://www.w3.org/2000/svg" width="1301" height="900" viewBox="0 0 1301 900"><rect width="1301" height="900" fill="#FFFFFF"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1E2761"/></marker><marker id="ahT" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#028090"/></marker><marker id="ahA" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#B85042"/></marker></defs><text x="60" y="74" font-family="NanumGothic" font-size="34" font-weight="bold" fill="#111111" text-anchor="start">4. 기업의 노하우를 지식센터 지능화</text><text x="62" y="104" font-family="NanumGothic" font-size="16" font-weight="normal" fill="#1CA5E5" text-anchor="start">Turning Corporate Know-how into Intelligent Knowledge</text><line x1="60" y1="122" x2="1241" y2="122" stroke="#1CA5E5" stroke-width="3"/><text x="1241" y="66" font-family="NanumGothic" font-size="40" font-weight="bold" fill="#1CA5E5" text-anchor="end">ASC</text><path d="M1135,72 q50,14 106,2" stroke="#B85042" stroke-width="3" fill="none"/><text x="1238" y="92" font-family="NanumGothic" font-size="12" font-weight="normal" fill="#B85042" text-anchor="end">AI System Creator</text><rect x="60" y="150" width="560" height="420" rx="14" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.8"/><text x="340" y="184" font-family="NanumGothic" font-size="19" font-weight="bold" fill="#1E2761" text-anchor="middle">SECI 나선 — 암묵지가 조직의 자산이 되는 길</text><rect x="100" y="202" width="210" height="96" rx="12" fill="#FFFFFF" stroke="#1E2761" stroke-width="1.8"/><text x="205" y="240" font-family="NanumGothic" font-size="19" font-weight="bold" fill="#1E2761" text-anchor="middle">공동화</text><text x="205" y="268" font-family="NanumGothic" font-size="13.5" font-weight="normal" fill="#5A6472" text-anchor="middle">현장의 경험 공유</text><rect x="370" y="202" width="210" height="96" rx="12" fill="#FFDD2D" stroke="#1E2761" stroke-width="1.8"/><text x="475" y="240" font-family="NanumGothic" font-size="19" font-weight="bold" fill="#1E2761" text-anchor="middle">표출화</text><text x="475" y="268" font-family="NanumGothic" font-size="13.5" font-weight="normal" fill="#5A6472" text-anchor="middle">말이 문서가 된다</text><rect x="370" y="372" width="210" height="96" rx="12" fill="#FFFFFF" stroke="#1E2761" stroke-width="1.8"/><text x="475" y="410" font-family="NanumGothic" font-size="19" font-weight="bold" fill="#1E2761" text-anchor="middle">연결화</text><text x="475" y="438" font-family="NanumGothic" font-size="13.5" font-weight="normal" fill="#5A6472" text-anchor="middle">문서가 지식망이 된다</text><rect x="100" y="372" width="210" height="96" rx="12" fill="#FFFFFF" stroke="#1E2761" stroke-width="1.8"/><text x="205" y="410" font-family="NanumGothic" font-size="19" font-weight="bold" fill="#1E2761" text-anchor="middle">내면화</text><text x="205" y="438" font-family="NanumGothic" font-size="13.5" font-weight="normal" fill="#5A6472" text-anchor="middle">지식이 몸에 밴다</text><line x1="315" y1="250" x2="365" y2="250" stroke="#028090" stroke-width="2.5" marker-end="url(#ahT)"/><line x1="475" y1="303" x2="475" y2="367" stroke="#028090" stroke-width="2.5" marker-end="url(#ahT)"/><line x1="365" y1="420" x2="315" y2="420" stroke="#028090" stroke-width="2.5" marker-end="url(#ahT)"/><line x1="205" y1="367" x2="205" y2="303" stroke="#028090" stroke-width="2.5" marker-end="url(#ahT)"/><text x="340" y="500" font-family="NanumGothic" font-size="14.5" font-weight="bold" fill="#B85042" text-anchor="middle">최대 장벽: “쓸 시간이 없다”</text><text x="340" y="523" font-family="NanumGothic" font-size="14.5" font-weight="bold" fill="#B85042" text-anchor="middle">→ 초안은 AI가, 승인은 베테랑이 — “고칠 시간만 있으면 된다”</text><text x="340" y="550" font-family="NanumGothic" font-size="12.5" font-weight="normal" fill="#5A6472" text-anchor="middle">(Nonaka &amp; Takeuchi, 1995 — 표출화의 자동화가 지능화의 요체)</text><rect x="660" y="150" width="581" height="420" rx="14" fill="#FFFFFF" stroke="#1E2761" stroke-width="1.8"/><text x="950" y="184" font-family="NanumGothic" font-size="19" font-weight="bold" fill="#1E2761" text-anchor="middle">Odoo 지식센터 + RAG 프로세스</text><rect x="688" y="208" width="524" height="56" rx="10" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.4"/><text x="710" y="232" font-family="NanumGothic" font-size="16" font-weight="bold" fill="#1E2761" text-anchor="start">지식 수집</text><text x="710" y="253" font-family="NanumGothic" font-size="13" font-weight="normal" fill="#5A6472" text-anchor="start">회의 음성 AI 요약 · 현장 메모 · 메일 · CS 이력</text><line x1="950" y1="265" x2="950" y2="277" stroke="#5A6472" stroke-width="2" marker-end="url(#ah)"/><rect x="688" y="278" width="524" height="56" rx="10" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.4"/><text x="710" y="302" font-family="NanumGothic" font-size="16" font-weight="bold" fill="#1E2761" text-anchor="start">구조화·정돈</text><text x="710" y="323" font-family="NanumGothic" font-size="13" font-weight="normal" fill="#5A6472" text-anchor="start">문서 트리·템플릿 = 지식의 정위치·정품</text><line x1="950" y1="335" x2="950" y2="347" stroke="#5A6472" stroke-width="2" marker-end="url(#ah)"/><rect x="688" y="348" width="524" height="56" rx="10" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.4"/><text x="710" y="372" font-family="NanumGothic" font-size="16" font-weight="bold" fill="#1E2761" text-anchor="start">RAG 색인</text><text x="710" y="393" font-family="NanumGothic" font-size="13" font-weight="normal" fill="#5A6472" text-anchor="start">사내문서 검색증강 — 출처 병기 답변</text><line x1="950" y1="405" x2="950" y2="417" stroke="#5A6472" stroke-width="2" marker-end="url(#ah)"/><rect x="688" y="418" width="524" height="56" rx="10" fill="#EEF1F5" stroke="#1CA5E5" stroke-width="1.4"/><text x="710" y="442" font-family="NanumGothic" font-size="16" font-weight="bold" fill="#1E2761" text-anchor="start">맥락 활용</text><text x="710" y="463" font-family="NanumGothic" font-size="13" font-weight="normal" fill="#5A6472" text-anchor="start">도면 열면 과거 불량 포인트·베테랑 메모 표시</text><line x1="950" y1="475" x2="950" y2="487" stroke="#5A6472" stroke-width="2" marker-end="url(#ah)"/><rect x="688" y="488" width="524" height="56" rx="10" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.4"/><text x="710" y="512" font-family="NanumGothic" font-size="16" font-weight="bold" fill="#1E2761" text-anchor="start">갱신·정리</text><text x="710" y="533" font-family="NanumGothic" font-size="13" font-weight="normal" fill="#5A6472" text-anchor="start">사용 통계 · 미사용 문서 빨간 패 → 온톨로지 씨앗</text><text x="650.0" y="630" font-family="NanumGothic" font-size="15.5" font-weight="bold" fill="#028090" text-anchor="middle">AI 에이전트 파이프라인 (상시 루프)</text><rect x="120.0" y="640" width="200.8" height="52" rx="10" fill="#E5F4F3" stroke="#028090" stroke-width="1.5"/><text x="220.4" y="662" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">수집</text><text x="220.4" y="680" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">녹취·메모</text><line x1="321.8" y1="666" x2="333.8" y2="666" stroke="#028090" stroke-width="2.2" marker-end="url(#ahT)"/><rect x="334.8" y="640" width="200.8" height="52" rx="10" fill="#E5F4F3" stroke="#028090" stroke-width="1.5"/><text x="435.20000000000005" y="662" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">구조화</text><text x="435.20000000000005" y="680" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">AI 초안</text><line x1="536.6" y1="666" x2="548.6" y2="666" stroke="#028090" stroke-width="2.2" marker-end="url(#ahT)"/><rect x="549.6" y="640" width="200.8" height="52" rx="10" fill="#E5F4F3" stroke="#028090" stroke-width="1.5"/><text x="650.0" y="662" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">검증</text><text x="650.0" y="680" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">중복·출처</text><line x1="751.4000000000001" y1="666" x2="763.4000000000001" y2="666" stroke="#028090" stroke-width="2.2" marker-end="url(#ahT)"/><rect x="764.4000000000001" y="640" width="200.8" height="52" rx="10" fill="#E5F4F3" stroke="#028090" stroke-width="1.5"/><text x="864.8000000000001" y="662" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">활용</text><text x="864.8000000000001" y="680" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">RAG·push</text><line x1="966.2" y1="666" x2="978.2" y2="666" stroke="#028090" stroke-width="2.2" marker-end="url(#ahT)"/><rect x="979.2" y="640" width="200.8" height="52" rx="10" fill="#E5F4F3" stroke="#028090" stroke-width="1.5"/><text x="1079.6000000000001" y="662" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">환류</text><text x="1079.6000000000001" y="680" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">통계·정리</text><rect x="1062" y="608" width="118" height="24" rx="12" fill="#B85042" stroke="#B85042" stroke-width="1"/><text x="1121" y="624" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">HITL 승인 게이트</text><text x="650.0" y="712" font-family="NanumGothic" font-size="12.5" font-weight="normal" fill="#5A6472" text-anchor="middle">읽히지 않는 천 건보다 매일 읽히는 백 건이 지능이다 — 축적은 온톨로지(PTGDA)의 텃밭이 된다</text><rect x="221.5" y="826" width="270" height="46" rx="23" fill="#1E2761" stroke="#1E2761" stroke-width="1"/><text x="356.5" y="855" font-family="NanumGothic" font-size="15.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">핵심 표준 문서화율 ↑</text><rect x="515.5" y="826" width="270" height="46" rx="23" fill="#1E2761" stroke="#1E2761" stroke-width="1"/><text x="650.5" y="855" font-family="NanumGothic" font-size="15.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">RAG 답변 채택률</text><rect x="809.5" y="826" width="270" height="46" rx="23" fill="#1E2761" stroke="#1E2761" stroke-width="1"/><text x="944.5" y="855" font-family="NanumGothic" font-size="15.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">신입 온보딩 기간 ↓</text></svg>