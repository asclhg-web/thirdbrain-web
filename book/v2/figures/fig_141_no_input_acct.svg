<svg xmlns="http://www.w3.org/2000/svg" width="940" height="480" viewBox="0 0 940 480"><rect width="940" height="480" fill="#FFFFFF"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1E2761"/></marker><marker id="ahT" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#028090"/></marker><marker id="ahA" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#B85042"/></marker><marker id="ahG" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#5A6472"/></marker></defs><text x="470.0" y="40" font-family="NanumGothic" font-size="22" font-weight="bold" fill="#1E2761" text-anchor="middle">“입력 없는 회계” — 자동화 파이프라인</text><text x="470.0" y="66" font-family="NanumGothic" font-size="13.5" font-weight="bold" fill="#5A6472" text-anchor="middle">입력은 AI가, 승인은 사람이 — 기록 노동이 판단 노동으로 바뀐다</text><rect x="250" y="95" width="440" height="56" rx="10" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.5"/><text x="470.0" y="118" font-family="NanumGothic" font-size="14" font-weight="bold" fill="#1E2761" text-anchor="middle">사람의 일 = 승인·판단</text><text x="470.0" y="140" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">자동 생성된 전표·대사 결과를 검토하고 승인만 한다</text><rect x="24.0" y="200" width="196" height="112" rx="10" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.6"/><text x="122.0" y="226" font-family="NanumGothic" font-size="14" font-weight="bold" fill="#1E2761" text-anchor="middle">증빙 발생</text><text x="122.0" y="248" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#028090" text-anchor="middle">현장·수신함</text><text x="122.0" y="272" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">청구서 스캔·사진</text><text x="122.0" y="292" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">이메일 수신</text><line x1="222.0" y1="256" x2="254.0" y2="256" stroke="#028090" stroke-width="2.6" marker-end="url(#ahT)"/><rect x="256.0" y="200" width="196" height="112" rx="10" fill="#E5F4F3" stroke="#028090" stroke-width="1.6"/><text x="354.0" y="226" font-family="NanumGothic" font-size="14" font-weight="bold" fill="#1E2761" text-anchor="middle">AI 캡처</text><text x="354.0" y="248" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#028090" text-anchor="middle">인식률 98%</text><text x="354.0" y="272" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">공급업체·금액·세액 추출</text><text x="354.0" y="292" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">전표 초안 0.1초</text><line x1="454.0" y1="256" x2="486.0" y2="256" stroke="#028090" stroke-width="2.6" marker-end="url(#ahT)"/><rect x="488.0" y="200" width="196" height="112" rx="10" fill="#E5F4F3" stroke="#028090" stroke-width="1.6"/><text x="586.0" y="226" font-family="NanumGothic" font-size="14" font-weight="bold" fill="#1E2761" text-anchor="middle">은행 자동 대사</text><text x="586.0" y="248" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#028090" text-anchor="middle">자동 매칭 95%</text><text x="586.0" y="272" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">28,000개 은행 연동</text><text x="586.0" y="292" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">입출금 ↔ 청구서 대조</text><line x1="686.0" y1="256" x2="718.0" y2="256" stroke="#028090" stroke-width="2.6" marker-end="url(#ahT)"/><rect x="720.0" y="200" width="196" height="112" rx="10" fill="#1E2761" stroke="#1E2761" stroke-width="1.6"/><text x="818.0" y="226" font-family="NanumGothic" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">실시간 보고</text><text x="818.0" y="248" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#CADCFC" text-anchor="middle">마감 대기 없음</text><text x="818.0" y="272" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#CADCFC" text-anchor="middle">손익·현금·채권 연령</text><text x="818.0" y="292" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#CADCFC" text-anchor="middle">드릴다운 즉시 조회</text><line x1="354.0" y1="153" x2="354.0" y2="196" stroke="#1E2761" stroke-width="1.8" marker-end="url(#ah)" stroke-dasharray="5,4"/><line x1="586.0" y1="153" x2="586.0" y2="196" stroke="#1E2761" stroke-width="1.8" marker-end="url(#ah)" stroke-dasharray="5,4"/><text x="470.0" y="178" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#1E2761" text-anchor="middle">승인 게이트</text><rect x="140" y="350" width="660" height="58" rx="10" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.4"/><text x="470.0" y="374" font-family="NanumGothic" font-size="13.5" font-weight="bold" fill="#1E2761" text-anchor="middle">KPMG: 부가세 결산 4일 → 3시간</text><text x="470.0" y="396" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">절감된 시간은 인력 감축이 아니라 판단 노동으로 재투자된다 (Odoo 공식 소개자료)</text><text x="470.0" y="440" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#5A6472" text-anchor="middle">AI 캡처의 전표 초안도 승인 게이트를 반드시 거친다 — 98%는 2%의 오류를 뜻한다</text><text x="470.0" y="466" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">2부 14장 — 회계: 재무의 컨설팅</text></svg>