<svg xmlns="http://www.w3.org/2000/svg" width="940" height="620" viewBox="0 0 940 620"><rect width="940" height="620" fill="#FFFFFF"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1E2761"/></marker><marker id="ahT" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#028090"/></marker><marker id="ahA" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#B85042"/></marker></defs><text x="470.0" y="40" font-family="NanumGothic" font-size="24" font-weight="bold" fill="#1E2761" text-anchor="middle">ERP의 조명과 경영 사각지대</text><text x="470.0" y="66" font-family="NanumGothic" font-size="14" font-weight="bold" fill="#B85042" text-anchor="middle">손실은 시스템이 비추지 않는 곳에서 발생한다</text><rect x="40" y="95" width="860" height="430" rx="14" fill="#454C57" stroke="#454C57" stroke-width="0"/><path d="M120,110 L60,510 L560,510 L420,110 z" fill="#E8F0FB" fill-opacity="0.95"/><circle cx="270" cy="122" r="18" fill="#1E2761"/><text x="270" y="88" font-family="NanumGothic" font-size="13.5" font-weight="bold" fill="#1E2761" text-anchor="middle">ERP의 조명 — 등록된 것만 비춘다</text><rect x="115" y="178" width="170" height="44" rx="8" fill="#FFFFFF" stroke="#1E2761" stroke-width="1.5"/><text x="200" y="205" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">수주·발주 전표</text><rect x="245" y="238" width="170" height="44" rx="8" fill="#FFFFFF" stroke="#1E2761" stroke-width="1.5"/><text x="330" y="265" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">재고 수불</text><rect x="105" y="298" width="170" height="44" rx="8" fill="#FFFFFF" stroke="#1E2761" stroke-width="1.5"/><text x="190" y="325" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">BOM·작업지시</text><rect x="235" y="368" width="170" height="44" rx="8" fill="#FFFFFF" stroke="#1E2761" stroke-width="1.5"/><text x="320" y="395" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">회계 분개</text><text x="300" y="470" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">형식지 — 기록된 세계</text><rect x="595" y="148" width="210" height="44" rx="8" fill="none" stroke="#9AA3AE" stroke-width="1.3" stroke-dasharray="6,5"/><text x="700" y="175" font-family="NanumGothic" font-size="12.5" font-weight="normal" fill="#B8C0CA" text-anchor="middle">베테랑의 감(感)</text><rect x="635" y="228" width="210" height="44" rx="8" fill="none" stroke="#9AA3AE" stroke-width="1.3" stroke-dasharray="6,5"/><text x="740" y="255" font-family="NanumGothic" font-size="12.5" font-weight="normal" fill="#B8C0CA" text-anchor="middle">부서 사이의 관행</text><rect x="585" y="308" width="210" height="44" rx="8" fill="none" stroke="#9AA3AE" stroke-width="1.3" stroke-dasharray="6,5"/><text x="690" y="335" font-family="NanumGothic" font-size="12.5" font-weight="normal" fill="#B8C0CA" text-anchor="middle">구두 결정·예외 처리</text><rect x="625" y="388" width="210" height="44" rx="8" fill="none" stroke="#9AA3AE" stroke-width="1.3" stroke-dasharray="6,5"/><text x="730" y="415" font-family="NanumGothic" font-size="12.5" font-weight="normal" fill="#B8C0CA" text-anchor="middle">“원래 그렇게 해 왔다”</text><text x="715" y="470" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#B8C0CA" text-anchor="middle">암묵지 — 사각지대</text><line x1="620" y1="528" x2="620" y2="560" stroke="#B85042" stroke-width="2.5" marker-end="url(#ahA)"/><text x="620" y="580" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#B85042" text-anchor="middle">결품·과잉재고</text><line x1="750" y1="528" x2="750" y2="560" stroke="#B85042" stroke-width="2.5" marker-end="url(#ahA)"/><text x="750" y="580" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#B85042" text-anchor="middle">중복 발주</text><line x1="870" y1="528" x2="870" y2="560" stroke="#B85042" stroke-width="2.5" marker-end="url(#ahA)"/><text x="870" y="580" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#B85042" text-anchor="middle">납기 지연·불량 재발</text><text x="470.0" y="606" font-family="NanumGothic" font-size="12" font-weight="normal" fill="#5A6472" text-anchor="middle">3부 18장 — 사각지대의 암묵지를 온톨로지로 발굴·통치하는 것이 AX의 마지막 관문이다</text></svg>