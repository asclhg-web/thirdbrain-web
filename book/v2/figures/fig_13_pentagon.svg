ke-dasharray="3,3"/><line x1="377.12993013778924" y1="477.8246851112417" x2="288" y2="545" stroke="#5A6472" stroke-width="1" stroke-dasharray="3,3"/><line x1="319.7330704253657" y1="301.17531488875835" x2="180" y2="268" stroke="#5A6472" stroke-width="1" stroke-dasharray="3,3"/><rect x="362.0" y="86.0" width="216" height="84" rx="10" fill="#FFFFFF" stroke="#1E2761" stroke-width="1.6"/><text x="470" y="110.0" font-family="NanumGothic" font-size="13.5" font-weight="bold" fill="#1E2761" text-anchor="middle">① 단일 데이터 원천</text><text x="470" y="132.0" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#5A6472" text-anchor="middle">하나의 마스터·하나의 원장(SSOT)</text><text x="470" y="154.0" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#028090" text-anchor="middle">뿌리: ERP 통합·기준정보</text><rect x="652.0" y="226.0" width="216" height="84" rx="10" fill="#FFFFFF" stroke="#1E2761" stroke-width="1.6"/><text x="760" y="250.0" font-family="NanumGothic" font-size="13.5" font-weight="bold" fill="#1E2761" text-anchor="middle">② 의미 기반 통합</text><text x="760" y="272.0" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#5A6472" text-anchor="middle">코드체계·온톨로지로 의미 연결</text><text x="760" y="294.0" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#028090" text-anchor="middle">뿌리: 눈으로 보는 관리</text><rect x="544.0" y="503.0" width="216" height="84" rx="10" fill="#FFFFFF" stroke="#1E2761" stroke-width="1.6"/><text x="652" y="527.0" font-family="NanumGothic" font-size="13.5" font-weight="bold" fill="#1E2761" text-anchor="middle">③ 실시간 수집</text><text x="652" y="549.0" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#5A6472" text-anchor="middle">발생한 그 자리·그 순간에 기록</text><text x="652" y="571.0" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#028090" text-anchor="middle">뿌리: POP 생산시점관리</text><rect x="180.0" y="503.0" width="216" height="84" rx="10" fill="#FFFFFF" stroke="#1E2761" stroke-width="1.6"/><text x="288" y="527.0" font-family="NanumGothic" font-size="13.5" font-weight="bold" fill="#1E2761" text-anchor="middle">④ 학습·추론 루프</text><text x="288" y="549.0" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#5A6472" text-anchor="middle">수집→학습→추론→환류의 상시화</text><text x="288" y="571.0" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#028090" text-anchor="middle">뿌리: QC 스토리·DMAIC</text><rect x="72.0" y="226.0" width="216" height="84" rx="10" fill="#FFFFFF" stroke="#1E2761" stroke-width="1.6"/><text x="180" y="250.0" font-family="NanumGothic" font-size="13.5" font-weight="bold" fill="#1E2761" text-anchor="middle">⑤ 인간 협업</text><text x="180" y="272.0" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#5A6472" text-anchor="middle">HITL 승인 게이트·경험의 환류</text><text x="180" y="294.0" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#028090" text-anchor="middle">뿌리: 자율협조 생산방식</text><circle cx="470" cy="350" r="74" fill="#1E2761"/><text x="470" y="342" font-family="NanumGothic" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">지능형 ERP</text><text x="470" y="368" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#CADCFC" text-anchor="middle">기록을 넘어 판단으로</text><text x="470.0" y="644" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">1부 1장 — 기록하는 시스템(SoR)에서 판단하는 시스템(SoI)으로</text></svg>