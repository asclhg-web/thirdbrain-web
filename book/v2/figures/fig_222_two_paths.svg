<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640"><rect width="960" height="640" fill="#FFFFFF"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1E2761"/></marker><marker id="ahT" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#028090"/></marker><marker id="ahA" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#B85042"/></marker><marker id="ahG" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#5A6472"/></marker></defs><text x="480.0" y="40" font-family="NanumGothic" font-size="22" font-weight="bold" fill="#1E2761" text-anchor="middle">도입 유형 2경로 — 두 개의 출발점, 같은 온톨로지</text><text x="480.0" y="66" font-family="NanumGothic" font-size="12.2" font-weight="normal" fill="#5A6472" text-anchor="middle">방향은 반대지만 도구는 같다 — 사람의 말에서 시작해 시스템의 값으로 끝나는 하나의 파이프라인</text><rect x="330" y="92" width="300" height="54" rx="12" fill="#1E2761" stroke="#1E2761" stroke-width="1.6"/><text x="480" y="114" font-family="NanumGothic" font-size="14.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">도입의 출발점</text><text x="480" y="134" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#CADCFC" text-anchor="middle">우리 회사에 ERP가 있는가?</text><path d="M400,150 Q300,180 245,208" fill="none" stroke="#1E2761" stroke-width="2.4" marker-end="url(#ah)"/><path d="M560,150 Q660,180 715,208" fill="none" stroke="#1E2761" stroke-width="2.4" marker-end="url(#ah)"/><text x="280" y="178" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#1E2761" text-anchor="middle">없다</text><text x="680" y="178" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#1E2761" text-anchor="middle">있다</text><rect x="60" y="214" width="375" height="320" rx="12" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.6"/><text x="247.5" y="242" font-family="NanumGothic" font-size="13.5" font-weight="bold" fill="#1E2761" text-anchor="middle">시나리오 1 — ERP 없는 소상공인·소기업</text><text x="247.5" y="262" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#028090" text-anchor="middle">JEDAIX 단독 시작 → 성장 후 Odoo 확장</text><rect x="78" y="280" width="339" height="34" rx="7" fill="#FFFFFF" stroke="#1E2761" stroke-width="1.1"/><text x="90" y="302" font-family="NanumGothic" font-size="10.8" font-weight="normal" fill="#454C57" text-anchor="start">① 엑셀 편입 — 데이터 매핑 마법사 (1~2주)</text><line x1="247.5" y1="315" x2="247.5" y2="323" stroke="#028090" stroke-width="1.8" marker-end="url(#ahT)"/><rect x="78" y="324" width="339" height="34" rx="7" fill="#FFFFFF" stroke="#1E2761" stroke-width="1.1"/><text x="90" y="346" font-family="NanumGothic" font-size="10.8" font-weight="normal" fill="#454C57" text-anchor="start">② 표준 템플릿으로 O2C·P2P 가동 (2~4주)</text><line x1="247.5" y1="359" x2="247.5" y2="367" stroke="#028090" stroke-width="1.8" marker-end="url(#ahT)"/><rect x="78" y="368" width="339" height="34" rx="7" fill="#FFFFFF" stroke="#1E2761" stroke-width="1.1"/><text x="90" y="390" font-family="NanumGothic" font-size="10.8" font-weight="normal" fill="#454C57" text-anchor="start">③ 6 Station 대화 축적 — 첫 TA 확정 (1~3개월)</text><line x1="247.5" y1="403" x2="247.5" y2="411" stroke="#028090" stroke-width="1.8" marker-end="url(#ahT)"/><rect x="78" y="412" width="339" height="34" rx="7" fill="#FFFFFF" stroke="#1E2761" stroke-width="1.1"/><text x="90" y="434" font-family="NanumGothic" font-size="10.8" font-weight="normal" fill="#454C57" text-anchor="start">④ Agent 첫 승인·실행 연결 (3~6개월)</text><line x1="247.5" y1="447" x2="247.5" y2="462" stroke="#028090" stroke-width="2.2" marker-end="url(#ahT)"/><rect x="78" y="460" width="339" height="40" rx="8" fill="#E5F4F3" stroke="#028090" stroke-width="1.4"/><text x="247.5" y="477" font-family="NanumGothic" font-size="10.8" font-weight="bold" fill="#028090" text-anchor="middle">⑤ 성장 시 Odoo 확장 — 같은 온톨로지 위의 이행</text><text x="247.5" y="493" font-family="NanumGothic" font-size="10.2" font-weight="normal" fill="#5A6472" text-anchor="middle">축적된 코드·프로세스 자산의 승계 (이중 입력 없음)</text><text x="247.5" y="520" font-family="NanumGothic" font-size="10.8" font-weight="normal" fill="#1E2761" text-anchor="middle">상시 인력 2명 이내 · 암묵지의 형식지화가 곧 기반 구축</text><rect x="525" y="214" width="375" height="320" rx="12" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.6"/><text x="712.5" y="242" font-family="NanumGothic" font-size="13.5" font-weight="bold" fill="#1E2761" text-anchor="middle">시나리오 2 — ERP 보유 중소기업</text><text x="712.5" y="262" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#028090" text-anchor="middle">Odoo(원장·실행) × JEDAIX(발굴·판단) 병행</text><rect x="543" y="280" width="339" height="34" rx="7" fill="#FFFFFF" stroke="#1E2761" stroke-width="1.1"/><text x="555" y="302" font-family="NanumGothic" font-size="10.8" font-weight="normal" fill="#454C57" text-anchor="start">① 진단 결합 — 6 Station 파일럿 인터뷰 (2~4주)</text><line x1="712.5" y1="315" x2="712.5" y2="323" stroke="#028090" stroke-width="1.8" marker-end="url(#ahT)"/><rect x="543" y="324" width="339" height="34" rx="7" fill="#FFFFFF" stroke="#1E2761" stroke-width="1.1"/><text x="555" y="346" font-family="NanumGothic" font-size="10.8" font-weight="normal" fill="#454C57" text-anchor="start">② 데이터 연계 — 명시 이벤트 자동 등록 (1~2개월)</text><line x1="712.5" y1="359" x2="712.5" y2="367" stroke="#028090" stroke-width="1.8" marker-end="url(#ahT)"/><rect x="543" y="368" width="339" height="34" rx="7" fill="#FFFFFF" stroke="#1E2761" stroke-width="1.1"/><text x="555" y="390" font-family="NanumGothic" font-size="10.8" font-weight="normal" fill="#454C57" text-anchor="start">③ 발굴 사이클 — 확정 3건·GL 반영 (2~3개월)</text><line x1="712.5" y1="403" x2="712.5" y2="411" stroke="#028090" stroke-width="1.8" marker-end="url(#ahT)"/><rect x="543" y="412" width="339" height="34" rx="7" fill="#FFFFFF" stroke="#1E2761" stroke-width="1.1"/><text x="555" y="434" font-family="NanumGothic" font-size="10.8" font-weight="normal" fill="#454C57" text-anchor="start">④ 실행·통치 — Agent·War Room 가동 (3~6개월)</text><rect x="543" y="460" width="339" height="40" rx="8" fill="#CADCFC" stroke="#1E2761" stroke-width="1.4"/><text x="712.5" y="477" font-family="NanumGothic" font-size="10.5" font-weight="bold" fill="#1E2761" text-anchor="middle">데이터는 위로(기록→신호) · 판단은 아래로(확정→파라미터)</text><text x="712.5" y="493" font-family="NanumGothic" font-size="10.2" font-weight="normal" fill="#5A6472" text-anchor="middle">JEDAIX는 ERP를 대체하지 않고 연결한다</text><text x="712.5" y="520" font-family="NanumGothic" font-size="10.8" font-weight="normal" fill="#1E2761" text-anchor="middle">4역할 체제(6~12개월) · KGI 개선이 성공 판정</text><text x="480.0" y="598" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#1E2761" text-anchor="middle">공통 원칙: 작게 시작해 얇게 완주한다 — 부서 두 곳·질문 몇 개로 시작해 첫 확정과 첫 승인까지 6개월 이내</text><text x="480.0" y="624" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">3부 22장 — 도입 유형별 시나리오 (JEDAIX 운영 매뉴얼 v9 · 정인호, 2026)</text></svg>