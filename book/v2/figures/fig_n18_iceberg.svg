<svg xmlns="http://www.w3.org/2000/svg" width="940" height="660" viewBox="0 0 940 660"><rect width="940" height="660" fill="#FFFFFF"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1E2761"/></marker><marker id="ahT" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#028090"/></marker><marker id="ahA" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#B85042"/></marker><marker id="ahG" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#5A6472"/></marker></defs><text x="470.0" y="38" font-family="NanumGothic" font-size="22" font-weight="bold" fill="#1E2761" text-anchor="middle">빙산 — 기록되는 것과 기록되지 않는 것</text><text x="470.0" y="64" font-family="NanumGothic" font-size="13" font-weight="normal" fill="#5A6472" text-anchor="middle">ERP는 수면 위를 기록한다 — 판단의 대부분은 수면 아래에 있다</text><rect x="40" y="270" width="860" height="310" fill="#D2E4F6"/><line x1="40" y1="270" x2="900" y2="270" stroke="#5B8AC7" stroke-width="2" stroke-dasharray="8,6"/><text x="58" y="262" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#5B8AC7" text-anchor="start">수면</text><path d="M370,270 L410,180 L448,205 L495,150 L555,270 z" fill="#FFFFFF" stroke="#1E2761" stroke-width="2"/><path d="M370,270 L555,270 L640,350 L668,460 L560,545 L410,558 L318,485 L300,370 z" fill="#A9C4E8" stroke="#5B8AC7" stroke-width="2"/><text x="185" y="200" font-family="NanumGothic" font-size="15" font-weight="bold" fill="#1E2761" text-anchor="middle">형식지 — ERP에 기록되는 것</text><text x="185" y="224" font-family="NanumGothic" font-size="12.5" font-weight="normal" fill="#5A6472" text-anchor="middle">전표 · 마스터 · 보고서</text><line x1="300" y1="210" x2="388" y2="228" stroke="#5A6472" stroke-width="1.2" stroke-dasharray="4,4"/><text x="478" y="330" font-family="NanumGothic" font-size="15" font-weight="bold" fill="#1E2761" text-anchor="middle">암묵지 — 기록되지 않는 것</text><text x="478" y="362" font-family="NanumGothic" font-size="12.5" font-weight="normal" fill="#27406E" text-anchor="middle">베테랑의 판단</text><text x="478" y="386" font-family="NanumGothic" font-size="12.5" font-weight="normal" fill="#27406E" text-anchor="middle">예외 처리</text><text x="478" y="410" font-family="NanumGothic" font-size="12.5" font-weight="normal" fill="#27406E" text-anchor="middle">구두 협의</text><text x="478" y="434" font-family="NanumGothic" font-size="12.5" font-weight="normal" fill="#27406E" text-anchor="middle">감각의 기준</text><path d="M590,500 Q780,470 830,250" fill="none" stroke="#028090" stroke-width="3.5" marker-end="url(#ahT)"/><text x="760" y="200" font-family="NanumGothic" font-size="13.5" font-weight="bold" fill="#028090" text-anchor="middle">온톨로지가</text><text x="760" y="220" font-family="NanumGothic" font-size="13.5" font-weight="bold" fill="#028090" text-anchor="middle">수면 아래를 끌어올린다</text><text x="478" y="610" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">기록 아래에 훨씬 큰 판단의 세계가 있다 — 그것을 형식지로 끌어올리는 도구가 온톨로지다</text><text x="470.0" y="646" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">3부 18장 — 빙산 비유: 형식지와 암묵지</text></svg>