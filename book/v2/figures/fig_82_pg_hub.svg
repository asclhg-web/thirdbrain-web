amily="NanumGothic" font-size="11" font-weight="normal" fill="#5A6472" text-anchor="middle">10장</text><rect x="367.0" y="92" width="100" height="50" rx="8" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.4"/><text x="417.0" y="113" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#1E2761" text-anchor="middle">판매</text><text x="417.0" y="132" font-family="NanumGothic" font-size="11" font-weight="normal" fill="#5A6472" text-anchor="middle">10장</text><rect x="473.0" y="92" width="100" height="50" rx="8" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.4"/><text x="523.0" y="113" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#1E2761" text-anchor="middle">매입</text><text x="523.0" y="132" font-family="NanumGothic" font-size="11" font-weight="normal" fill="#5A6472" text-anchor="middle">11장</text><rect x="579.0" y="92" width="100" height="50" rx="8" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.4"/><text x="629.0" y="113" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#1E2761" text-anchor="middle">재고</text><text x="629.0" y="132" font-family="NanumGothic" font-size="11" font-weight="normal" fill="#5A6472" text-anchor="middle">12장</text><rect x="685.0" y="92" width="100" height="50" rx="8" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.4"/><text x="735.0" y="113" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#1E2761" text-anchor="middle">제조</text><text x="735.0" y="132" font-family="NanumGothic" font-size="11" font-weight="normal" fill="#5A6472" text-anchor="middle">13장</text><rect x="791.0" y="92" width="100" height="50" rx="8" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.4"/><text x="841.0" y="113" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#1E2761" text-anchor="middle">회계</text><text x="841.0" y="132" font-family="NanumGothic" font-size="11" font-weight="normal" fill="#5A6472" text-anchor="middle">14장</text><rect x="102.0" y="148" width="100" height="50" rx="8" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.2"/><text x="152.0" y="177" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#1E2761" text-anchor="middle">인사</text><rect x="208.0" y="148" width="100" height="50" rx="8" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.2"/><text x="258.0" y="177" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#1E2761" text-anchor="middle">프로젝트</text><rect x="314.0" y="148" width="100" height="50" rx="8" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.2"/><text x="364.0" y="177" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#1E2761" text-anchor="middle">문서</text><rect x="420.0" y="148" width="100" height="50" rx="8" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.2"/><text x="470.0" y="177" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#1E2761" text-anchor="middle">마케팅</text><rect x="526.0" y="148" width="100" height="50" rx="8" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.2"/><text x="576.0" y="177" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#1E2761" text-anchor="middle">POS</text><rect x="632.0" y="148" width="100" height="50" rx="8" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.2"/><text x="682.0" y="169" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#1E2761" text-anchor="middle">지식센터</text><text x="682.0" y="188" font-family="NanumGothic" font-size="11" font-weight="normal" fill="#5A6472" text-anchor="middle">15장</text><rect x="738.0" y="148" width="100" height="50" rx="8" fill="#FFFFFF" stroke="#028090" stroke-width="1.4" stroke-dasharray="5,4"/><text x="788.0" y="169" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#028090" text-anchor="middle">+ 새 앱</text><text x="788.0" y="188" font-family="NanumGothic" font-size="11" font-weight="normal" fill="#5A6472" text-anchor="middle">60여 개</text><rect x="49.0" y="204" width="842" height="38" rx="8" fill="#1E2761" stroke="#1E2761" stroke-width="1.5"/><text x="470.0" y="228" font-family="NanumGothic" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">파이썬 ORM 계층 — 70+ 앱이 동일한 객체 모델로 접근한다</text><line x1="200.0" y1="246" x2="200.0" y2="282" stroke="#028090" stroke-width="2.4" marker-end="url(#ahT)"/><line x1="380.0" y1="246" x2="380.0" y2="282" stroke="#028090" stroke-width="2.4" marker-end="url(#ahT)"/><line x1="560.0" y1="246" x2="560.0" y2="282" stroke="#028090" stroke-width="2.4" marker-end="url(#ahT)"/><line x1="740.0" y1="246" x2="740.0" y2="282" stroke="#028090" stroke-width="2.4" marker-end="url(#ahT)"/><rect x="180.0" y="314" width="580" height="114" fill="#E8F0FB"/><ellipse cx="470.0" cy="428" rx="290" ry="24" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.8"/><line x1="180.0" y1="314" x2="180.0" y2="428" stroke="#1E2761" stroke-width="1.8"/><line x1="760.0" y1="314" x2="760.0" y2="428" stroke="#1E2761" stroke-width="1.8"/><ellipse cx="470.0" cy="314" rx="290" ry="24" fill="#CADCFC" stroke="#1E2761" stroke-width="1.8"/><text x="470.0" y="368" font-family="NanumGothic" font-size="17" font-weight="bold" fill="#1E2761" text-anchor="middle">PostgreSQL — 단일 데이터베이스</text><text x="470.0" y="393" font-family="NanumGothic" font-size="12" font-weight="normal" fill="#5A6472" text-anchor="middle">고객 res.partner 한 자리 · 품목 마스터 한 자리 · 재고 원장 한 자리</text><text x="470.0" y="416" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#028090" text-anchor="middle">새 앱을 설치해도 이미 쌓인 데이터가 그대로 새 앱의 마스터가 된다</text><text x="470.0" y="498" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">하나의 사실이 살 수 있는 자리가 아키텍처 수준에서 한 곳뿐이다 — 데이터 정위치의 플랫폼적 보장</text><text x="470.0" y="544" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">2부 8장 — Odoo 플랫폼 총론</text></svg>