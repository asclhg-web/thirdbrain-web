<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430"><rect width="980" height="430" fill="#FFFFFF"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1E2761"/></marker><marker id="ahT" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#028090"/></marker><marker id="ahA" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#B85042"/></marker><marker id="ahG" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#5A6472"/></marker></defs><text x="490.0" y="38" font-family="NanumGothic" font-size="23" font-weight="bold" fill="#1E2761" text-anchor="middle">첫 90일 — 작게 시작해 빠르게 증명한다</text><text x="490.0" y="64" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#5A6472" text-anchor="middle">진단하고, 하나의 사각지대로 파일럿하고, KPI로 증명한다</text><path d="M45,100 h272 l18,33.0 l-18,33.0 h-272 l18,-33.0 z" fill="#CADCFC"/><text x="199.0" y="128" font-family="NanumGothic" font-size="15" font-weight="bold" fill="#1E2761" text-anchor="middle">1~30일</text><text x="199.0" y="150" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#1E2761" text-anchor="middle">진단 · 데이터 정비</text><rect x="54" y="190" width="281" height="128" rx="10" fill="#FFFFFF" stroke="#1E2761" stroke-width="1.5"/><text x="75" y="226" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#454C57" text-anchor="start">· 기준정보·마스터 정비</text><text x="75" y="262" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#454C57" text-anchor="start">· 사각지대 후보 목록화</text><text x="75" y="298" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#454C57" text-anchor="start">· 경영 스폰서 지정</text><path d="M345,100 h272 l18,33.0 l-18,33.0 h-272 l18,-33.0 z" fill="#028090"/><text x="499.0" y="128" font-family="NanumGothic" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">31~60일</text><text x="499.0" y="150" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">파일럿 — 사각지대 1개</text><rect x="354" y="190" width="281" height="128" rx="10" fill="#FFFFFF" stroke="#028090" stroke-width="1.5"/><text x="375" y="226" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#454C57" text-anchor="start">· 현장 대화로 Seed 발굴</text><text x="375" y="262" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#454C57" text-anchor="start">· HITL 승인 절차 정착</text><text x="375" y="298" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#454C57" text-anchor="start">· 워크플로 1개 가동</text><path d="M645,100 h272 l18,33.0 l-18,33.0 h-272 l18,-33.0 z" fill="#1E2761"/><text x="799.0" y="128" font-family="NanumGothic" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">61~90일</text><text x="799.0" y="150" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">실행 · KPI 검증</text><rect x="654" y="190" width="281" height="128" rx="10" fill="#FFFFFF" stroke="#1E2761" stroke-width="1.5"/><text x="675" y="226" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#454C57" text-anchor="start">· KPI 전후 비교</text><text x="675" y="262" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#454C57" text-anchor="start">· 확산 대상 업무 선정</text><text x="675" y="298" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#454C57" text-anchor="start">· 운영 조직으로 이관</text><text x="490.0" y="366" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">원칙: 전사 빅뱅이 아니라 한 곳에서의 증명 — 90일의 성공이 확산의 근거가 된다</text><text x="490.0" y="414" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">3부 21장 — 첫 90일 로드맵</text></svg>