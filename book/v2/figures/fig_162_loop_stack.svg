<svg xmlns="http://www.w3.org/2000/svg" width="940" height="690" viewBox="0 0 940 690"><rect width="940" height="690" fill="#FFFFFF"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1E2761"/></marker><marker id="ahT" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#028090"/></marker><marker id="ahA" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#B85042"/></marker><marker id="ahG" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#5A6472"/></marker></defs><text x="470.0" y="40" font-family="NanumGothic" font-size="21" font-weight="bold" fill="#1E2761" text-anchor="middle">무한 루프의 기술 스택 배치 — 배관·작업대·기억·두뇌·손발</text><text x="470.0" y="66" font-family="NanumGothic" font-size="13" font-weight="normal" fill="#5A6472" text-anchor="middle">1부 5장의 DMAIC 방법론이 오픈소스 스택 위에 실장된다 (16.3절)</text><path d="M550.9016994374947,238.77852522924732 Q592.196773798105,221.81056980438254 588.8201689844875,266.32790595201374" fill="none" stroke="#028090" stroke-width="3" marker-end="url(#ahT)"/><path d="M638.8201689844875,420.2120828107764 Q667.7185333209165,454.242645786248 624.336602418914,464.78791718922355" fill="none" stroke="#028090" stroke-width="3" marker-end="url(#ahT)"/><path d="M493.4349029814193,559.8935688187389 Q470.0,597.8935688187389 446.5650970185807,559.8935688187389" fill="none" stroke="#028090" stroke-width="3" marker-end="url(#ahT)"/><path d="M315.6633975810859,464.78791718922355 Q272.2814666790834,454.242645786248 301.1798310155125,420.21208281077645" fill="none" stroke="#028090" stroke-width="3" marker-end="url(#ahT)"/><path d="M351.1798310155125,266.3279059520138 Q347.8032262018949,221.81056980438254 389.09830056250524,238.77852522924732" fill="none" stroke="#028090" stroke-width="3" marker-end="url(#ahT)"/><rect x="382.0" y="132.0" width="176" height="96" rx="14" fill="#E8F0FB" stroke="#1E2761" stroke-width="2"/><text x="470.0" y="156.0" font-family="NanumGothic" font-size="15" font-weight="bold" fill="#1E2761" text-anchor="middle">Define</text><text x="470.0" y="175.0" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#028090" text-anchor="middle">정의</text><text x="470.0" y="196.0" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#1E2761" text-anchor="middle">n8n + Dify</text><text x="470.0" y="215.0" font-family="NanumGothic" font-size="11" font-weight="normal" fill="#5A6472" text-anchor="middle">관리도 감시·문제정의 초안</text><rect x="581.7218684219822" y="277.10643118126103" width="176" height="96" rx="14" fill="#E8F0FB" stroke="#1E2761" stroke-width="2"/><text x="669.7218684219822" y="301.10643118126103" font-family="NanumGothic" font-size="15" font-weight="bold" fill="#1E2761" text-anchor="middle">Measure</text><text x="669.7218684219822" y="320.10643118126103" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#028090" text-anchor="middle">수집</text><text x="669.7218684219822" y="341.10643118126103" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#1E2761" text-anchor="middle">Odoo + n8n</text><text x="669.7218684219822" y="360.10643118126103" font-family="NanumGothic" font-size="11" font-weight="normal" fill="#5A6472" text-anchor="middle">트랜잭션·POP·외부 수집</text><rect x="505.4349029814193" y="511.8935688187389" width="176" height="96" rx="14" fill="#E8F0FB" stroke="#1E2761" stroke-width="2"/><text x="593.4349029814193" y="535.8935688187389" font-family="NanumGothic" font-size="15" font-weight="bold" fill="#1E2761" text-anchor="middle">Analyze</text><text x="593.4349029814193" y="554.8935688187389" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#028090" text-anchor="middle">학습</text><text x="593.4349029814193" y="575.8935688187389" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#1E2761" text-anchor="middle">Neo4j + LLM</text><text x="593.4349029814193" y="594.8935688187389" font-family="NanumGothic" font-size="11" font-weight="normal" fill="#5A6472" text-anchor="middle">경로 역추적·가설 생성</text><rect x="258.5650970185807" y="511.8935688187389" width="176" height="96" rx="14" fill="#E8F0FB" stroke="#1E2761" stroke-width="2"/><text x="346.5650970185807" y="535.8935688187389" font-family="NanumGothic" font-size="15" font-weight="bold" fill="#1E2761" text-anchor="middle">Improve</text><text x="346.5650970185807" y="554.8935688187389" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#028090" text-anchor="middle">추론</text><text x="346.5650970185807" y="575.8935688187389" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#1E2761" text-anchor="middle">LLM + frePPLe</text><text x="346.5650970185807" y="594.8935688187389" font-family="NanumGothic" font-size="11" font-weight="normal" fill="#5A6472" text-anchor="middle">대책 초안·What-if 성적표</text><rect x="182.27813157801774" y="277.1064311812611" width="176" height="96" rx="14" fill="#E8F0FB" stroke="#1E2761" stroke-width="2"/><text x="270.27813157801774" y="301.1064311812611" font-family="NanumGothic" font-size="15" font-weight="bold" fill="#1E2761" text-anchor="middle">Control</text><text x="270.27813157801774" y="320.1064311812611" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#028090" text-anchor="middle">환류</text><text x="270.27813157801774" y="341.1064311812611" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#1E2761" text-anchor="middle">Odoo + n8n</text><text x="270.27813157801774" y="360.1064311812611" font-family="NanumGothic" font-size="11" font-weight="normal" fill="#5A6472" text-anchor="middle">마스터·규칙 반영</text><rect x="252" y="441" width="20" height="26" rx="4" fill="#B85042" stroke="#B85042" stroke-width="0"/><path d="M256,454 l5,6 l9,-11" stroke="#FFFFFF" stroke-width="2.5" fill="none"/><text x="180" y="448" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#B85042" text-anchor="middle">HITL</text><text x="180" y="464" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#B85042" text-anchor="middle">승인 게이트</text><circle cx="470.0" cy="390" r="86" fill="#1E2761"/><text x="470.0" y="376" font-family="NanumGothic" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">LLM = 두뇌</text><text x="470.0" y="402" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#CADCFC" text-anchor="middle">가설과 서사 생성 —</text><text x="470.0" y="418" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#CADCFC" text-anchor="middle">사실·검정 위에서만</text><text x="470.0" y="642" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#1E2761" text-anchor="middle">역할: n8n=배관 · Dify=작업대 · Neo4j=기억 · LLM=두뇌 · Odoo=손발</text><text x="470.0" y="668" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">지능은 교체 가능하게, 기억과 배관은 안정되게 — 루프의 가치는 두뇌가 아니라 기억에 쌓인다</text></svg>