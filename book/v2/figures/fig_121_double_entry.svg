<svg xmlns="http://www.w3.org/2000/svg" width="920" height="600" viewBox="0 0 920 600"><rect width="920" height="600" fill="#FFFFFF"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1E2761"/></marker><marker id="ahT" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#028090"/></marker><marker id="ahA" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#B85042"/></marker></defs><text x="460.0" y="40" font-family="NanumGothic" font-size="21" font-weight="bold" fill="#1E2761" text-anchor="middle">이중 기록 재고 — 재고는 사라지지 않는다, 위치를 바꿀 뿐이다</text><text x="460.0" y="66" font-family="NanumGothic" font-size="13" font-weight="normal" fill="#5A6472" text-anchor="middle">복식부기가 돈의 흐름을 기록하듯, 하나의 이동이 두 위치에 동시에 기록된다</text><rect x="120" y="100" width="280" height="120" rx="10" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.8"/><text x="260" y="128" font-family="NanumGothic" font-size="14.5" font-weight="bold" fill="#1E2761" text-anchor="middle">위치 A — 자재창고</text><line x1="150" y1="145" x2="370" y2="145" stroke="#1E2761" stroke-width="1"/><text x="260" y="172" font-family="NanumGothic" font-size="16" font-weight="bold" fill="#B85042" text-anchor="middle">출고  −100 EA</text><text x="260" y="198" font-family="NanumGothic" font-size="12" font-weight="normal" fill="#5A6472" text-anchor="middle">장부 잔량 400 → 300</text><rect x="520" y="100" width="280" height="120" rx="10" fill="#E5F4F3" stroke="#028090" stroke-width="1.8"/><text x="660" y="128" font-family="NanumGothic" font-size="14.5" font-weight="bold" fill="#028090" text-anchor="middle">위치 B — 생산라인</text><line x1="550" y1="145" x2="770" y2="145" stroke="#028090" stroke-width="1"/><text x="660" y="172" font-family="NanumGothic" font-size="16" font-weight="bold" fill="#028090" text-anchor="middle">입고  +100 EA</text><text x="660" y="198" font-family="NanumGothic" font-size="12" font-weight="normal" fill="#5A6472" text-anchor="middle">장부 잔량 0 → 100</text><line x1="404" y1="160" x2="516" y2="160" stroke="#1E2761" stroke-width="3" marker-end="url(#ah)"/><text x="460" y="145" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#1E2761" text-anchor="middle">이동 전표 1건</text><text x="460" y="246" font-family="NanumGothic" font-size="13.5" font-weight="bold" fill="#1E2761" text-anchor="middle">하나의 이동 = 두 위치의 동시 기록 → 수량은 시스템 안에서 보존된다</text><rect x="51.0" y="300" width="128" height="64" rx="8" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.3" stroke-dasharray="5,4"/><text x="115.0" y="328" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#5A6472" text-anchor="middle">공급업체</text><text x="115.0" y="348" font-family="NanumGothic" font-size="10.5" font-weight="normal" fill="#5A6472" text-anchor="middle">가상 위치</text><line x1="180.0" y1="332" x2="188.0" y2="332" stroke="#028090" stroke-width="2" marker-end="url(#ahT)"/><rect x="189.0" y="300" width="128" height="64" rx="8" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.3"/><text x="253.0" y="328" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">입고 구역</text><text x="253.0" y="348" font-family="NanumGothic" font-size="10.5" font-weight="normal" fill="#5A6472" text-anchor="middle">실물 위치</text><line x1="318.0" y1="332" x2="326.0" y2="332" stroke="#028090" stroke-width="2" marker-end="url(#ahT)"/><rect x="327.0" y="300" width="128" height="64" rx="8" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.3"/><text x="391.0" y="328" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">자재창고</text><text x="391.0" y="348" font-family="NanumGothic" font-size="10.5" font-weight="normal" fill="#5A6472" text-anchor="middle">실물 위치</text><line x1="456.0" y1="332" x2="464.0" y2="332" stroke="#028090" stroke-width="2" marker-end="url(#ahT)"/><rect x="465.0" y="300" width="128" height="64" rx="8" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.3"/><text x="529.0" y="328" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">생산라인</text><text x="529.0" y="348" font-family="NanumGothic" font-size="10.5" font-weight="normal" fill="#5A6472" text-anchor="middle">실물 위치</text><line x1="594.0" y1="332" x2="602.0" y2="332" stroke="#028090" stroke-width="2" marker-end="url(#ahT)"/><rect x="603.0" y="300" width="128" height="64" rx="8" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.3"/><text x="667.0" y="328" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">출하 구역</text><text x="667.0" y="348" font-family="NanumGothic" font-size="10.5" font-weight="normal" fill="#5A6472" text-anchor="middle">실물 위치</text><line x1="732.0" y1="332" x2="740.0" y2="332" stroke="#028090" stroke-width="2" marker-end="url(#ahT)"/><rect x="741.0" y="300" width="128" height="64" rx="8" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.3" stroke-dasharray="5,4"/><text x="805.0" y="328" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#5A6472" text-anchor="middle">고객</text><text x="805.0" y="348" font-family="NanumGothic" font-size="10.5" font-weight="normal" fill="#5A6472" text-anchor="middle">가상 위치</text><text x="460.0" y="420" font-family="NanumGothic" font-size="12.5" font-weight="normal" fill="#5A6472" text-anchor="middle">구매 입고 = (공급업체) → (입고 구역) 이동  ·  판매 출하 = (출하 구역) → (고객) 이동</text><text x="460.0" y="444" font-family="NanumGothic" font-size="12.5" font-weight="normal" fill="#5A6472" text-anchor="middle">모든 증감이 '어디서 와서 어디로 갔는가'로 기록되므로, 수불부가 곧 추적 이력이 된다</text><rect x="180" y="480" width="560" height="60" rx="10" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.4"/><text x="460.0" y="505.0" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#1E2761" text-anchor="middle">기대 효과: 재고 정확도의 구조적 보장 · 로트 추적성 · 실사 차이의 원인 규명</text><text x="460.0" y="584" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">2부 12장 — 재고 관리: 물류의 컨설팅</text></svg>