<svg xmlns="http://www.w3.org/2000/svg" width="920" height="700" viewBox="0 0 920 700"><rect width="920" height="700" fill="#FFFFFF"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1E2761"/></marker><marker id="ahT" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#028090"/></marker><marker id="ahA" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#B85042"/></marker></defs><text x="460.0" y="40" font-family="NanumGothic" font-size="24" font-weight="bold" fill="#1E2761" text-anchor="middle">물리의 3정5S ↔ 데이터의 3정5S</text><text x="460.0" y="66" font-family="NanumGothic" font-size="13.5" font-weight="bold" fill="#5A6472" text-anchor="middle">한 세대 전 공장 바닥의 규율이 그대로 데이터 품질의 규율이 된다</text><rect x="60" y="92" width="330" height="40" rx="8" fill="#1E2761" stroke="#1E2761" stroke-width="1.5"/><text x="225.0" y="118" font-family="NanumGothic" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">물리적 현장 — 공장 바닥</text><rect x="530" y="92" width="330" height="40" rx="8" fill="#028090" stroke="#028090" stroke-width="1.5"/><text x="695.0" y="118" font-family="NanumGothic" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">데이터의 세계 — 데이터베이스</text><rect x="60" y="150" width="330" height="50" rx="8" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.3"/><text x="112" y="181" font-family="NanumGothic" font-size="15" font-weight="bold" fill="#1E2761" text-anchor="middle">정위치</text><text x="132" y="181" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#5A6472" text-anchor="start">정해진 자리에 보관한다</text><rect x="530" y="150" width="330" height="50" rx="8" fill="#E8F0FB" stroke="#028090" stroke-width="1.3"/><text x="548" y="181" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#5A6472" text-anchor="start">코드체계 — 품목 하나에 코드 하나</text><line x1="402" y1="175.0" x2="518" y2="175.0" stroke="#028090" stroke-width="2.2" marker-end="url(#ahT)"/><rect x="60" y="210" width="330" height="50" rx="8" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.3"/><text x="112" y="241" font-family="NanumGothic" font-size="15" font-weight="bold" fill="#1E2761" text-anchor="middle">정품</text><text x="132" y="241" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#5A6472" text-anchor="start">그 자리에는 정해진 물건만</text><rect x="530" y="210" width="330" height="50" rx="8" fill="#E8F0FB" stroke="#028090" stroke-width="1.3"/><text x="548" y="241" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#5A6472" text-anchor="start">입력 규칙 — 필드에 정해진 값만</text><line x1="402" y1="235.0" x2="518" y2="235.0" stroke="#028090" stroke-width="2.2" marker-end="url(#ahT)"/><rect x="60" y="270" width="330" height="50" rx="8" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.3"/><text x="112" y="301" font-family="NanumGothic" font-size="15" font-weight="bold" fill="#1E2761" text-anchor="middle">정량</text><text x="132" y="301" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#5A6472" text-anchor="start">정해진 양만큼 둔다</text><rect x="530" y="270" width="330" height="50" rx="8" fill="#E8F0FB" stroke="#028090" stroke-width="1.3"/><text x="548" y="301" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#5A6472" text-anchor="start">실시간 수집·실사 — 장부 = 실물</text><line x1="402" y1="295.0" x2="518" y2="295.0" stroke="#028090" stroke-width="2.2" marker-end="url(#ahT)"/><rect x="60" y="330" width="330" height="50" rx="8" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.3"/><text x="112" y="361" font-family="NanumGothic" font-size="15" font-weight="bold" fill="#1E2761" text-anchor="middle">정리</text><text x="132" y="361" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#5A6472" text-anchor="start">필요 없는 것을 버린다</text><rect x="530" y="330" width="330" height="50" rx="8" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.3"/><text x="548" y="361" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#5A6472" text-anchor="start">불용 코드·중복 코드 폐기</text><line x1="402" y1="355.0" x2="518" y2="355.0" stroke="#028090" stroke-width="2.2" marker-end="url(#ahT)"/><rect x="60" y="390" width="330" height="50" rx="8" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.3"/><text x="112" y="421" font-family="NanumGothic" font-size="15" font-weight="bold" fill="#1E2761" text-anchor="middle">정돈</text><text x="132" y="421" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#5A6472" text-anchor="start">주소를 주고 표찰을 단다</text><rect x="530" y="390" width="330" height="50" rx="8" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.3"/><text x="548" y="421" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#5A6472" text-anchor="start">기준정보·코드체계 정비</text><line x1="402" y1="415.0" x2="518" y2="415.0" stroke="#028090" stroke-width="2.2" marker-end="url(#ahT)"/><rect x="60" y="450" width="330" height="50" rx="8" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.3"/><text x="112" y="481" font-family="NanumGothic" font-size="15" font-weight="bold" fill="#1E2761" text-anchor="middle">청소</text><text x="132" y="481" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#5A6472" text-anchor="start">닦아내며 이상을 드러낸다</text><rect x="530" y="450" width="330" height="50" rx="8" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.3"/><text x="548" y="481" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#5A6472" text-anchor="start">오류·결측 데이터 클렌징</text><line x1="402" y1="475.0" x2="518" y2="475.0" stroke="#028090" stroke-width="2.2" marker-end="url(#ahT)"/><rect x="60" y="510" width="330" height="50" rx="8" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.3"/><text x="112" y="541" font-family="NanumGothic" font-size="15" font-weight="bold" fill="#1E2761" text-anchor="middle">청결</text><text x="132" y="541" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#5A6472" text-anchor="start">오염을 예방하는 상태 유지</text><rect x="530" y="510" width="330" height="50" rx="8" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.3"/><text x="548" y="541" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#5A6472" text-anchor="start">검증 규칙·입력 통제</text><line x1="402" y1="535.0" x2="518" y2="535.0" stroke="#028090" stroke-width="2.2" marker-end="url(#ahT)"/><rect x="60" y="570" width="330" height="50" rx="8" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.3"/><text x="112" y="601" font-family="NanumGothic" font-size="15" font-weight="bold" fill="#1E2761" text-anchor="middle">습관화</text><text x="132" y="601" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#5A6472" text-anchor="start">몸에 배게 한다</text><rect x="530" y="570" width="330" height="50" rx="8" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.3"/><text x="548" y="601" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#5A6472" text-anchor="start">현장이 데이터를 지키는 문화</text><line x1="402" y1="595.0" x2="518" y2="595.0" stroke="#028090" stroke-width="2.2" marker-end="url(#ahT)"/><text x="460.0" y="652" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#5A6472" text-anchor="middle">3정(위)은 상태의 기준, 5S(아래)는 그 상태에 이르는 다섯 걸음이다 — 5S 없이 AI 없다</text></svg>