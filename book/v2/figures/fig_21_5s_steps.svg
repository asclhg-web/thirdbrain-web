<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620"><rect width="980" height="620" fill="#FFFFFF"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1E2761"/></marker><marker id="ahT" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#028090"/></marker><marker id="ahA" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#B85042"/></marker><marker id="ahG" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#5A6472"/></marker></defs><text x="490.0" y="40" font-family="NanumGothic" font-size="23" font-weight="bold" fill="#1E2761" text-anchor="middle">5S 다섯 걸음 — 물리 현장과 데이터에 같은 순서로</text><text x="490.0" y="66" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#5A6472" text-anchor="middle">버리기 전에 자리 잡을 수 없고, 표준 없이 습관은 생기지 않는다 — 순서가 방법론이다</text><rect x="96" y="262" width="166" height="68" rx="8" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.5"/><text x="179.0" y="288" font-family="NanumGothic" font-size="15" font-weight="bold" fill="#1E2761" text-anchor="middle">1. 정리</text><text x="179.0" y="309" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#5A6472" text-anchor="middle">整理 · 버린다</text><rect x="270" y="224" width="166" height="106" rx="8" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.5"/><text x="353.0" y="250" font-family="NanumGothic" font-size="15" font-weight="bold" fill="#1E2761" text-anchor="middle">2. 정돈</text><text x="353.0" y="271" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#5A6472" text-anchor="middle">整頓 · 자리를 준다</text><rect x="444" y="186" width="166" height="144" rx="8" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.5"/><text x="527.0" y="212" font-family="NanumGothic" font-size="15" font-weight="bold" fill="#1E2761" text-anchor="middle">3. 청소</text><text x="527.0" y="233" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#5A6472" text-anchor="middle">淸掃 · 닦으며 점검</text><rect x="618" y="148" width="166" height="182" rx="8" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.5"/><text x="701.0" y="174" font-family="NanumGothic" font-size="15" font-weight="bold" fill="#1E2761" text-anchor="middle">4. 청결</text><text x="701.0" y="195" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#5A6472" text-anchor="middle">淸潔 · 상태를 지킨다</text><rect x="792" y="110" width="166" height="220" rx="8" fill="#028090" stroke="#028090" stroke-width="1.5"/><text x="875.0" y="136" font-family="NanumGothic" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5. 습관화</text><text x="875.0" y="157" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#CADCFC" text-anchor="middle">예절 · 몸에 배게</text><path d="M126,236 Q490.0,96 928,96" fill="none" stroke="#028090" stroke-width="2.2" marker-end="url(#ahT)" stroke-dasharray="6,4"/><rect x="10" y="356" width="78" height="76" rx="8" fill="#1E2761" stroke="#1E2761" stroke-width="1.3"/><text x="49" y="388" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">물리</text><text x="49" y="408" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5S</text><rect x="96" y="356" width="166" height="76" rx="8" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.2"/><text x="179.0" y="386" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#454C57" text-anchor="middle">빨간 패 작전</text><text x="179.0" y="408" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#454C57" text-anchor="middle">불용품 폐기</text><rect x="270" y="356" width="166" height="76" rx="8" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.2"/><text x="353.0" y="386" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#454C57" text-anchor="middle">번지·구획·정위치</text><text x="353.0" y="408" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#454C57" text-anchor="middle">찾기 로스 격감</text><rect x="444" y="356" width="166" height="76" rx="8" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.2"/><text x="527.0" y="386" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#454C57" text-anchor="middle">청소는 곧 점검</text><text x="527.0" y="408" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#454C57" text-anchor="middle">미결함을 드러낸다</text><rect x="618" y="356" width="166" height="76" rx="8" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.2"/><text x="701.0" y="386" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#454C57" text-anchor="middle">발생원 차단</text><text x="701.0" y="408" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#454C57" text-anchor="middle">규정의 활성화</text><rect x="792" y="356" width="166" height="76" rx="8" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.2"/><text x="875.0" y="386" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#454C57" text-anchor="middle">예외 없이 지킨다</text><text x="875.0" y="408" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#454C57" text-anchor="middle">경영자가 평가</text><rect x="10" y="448" width="78" height="76" rx="8" fill="#028090" stroke="#028090" stroke-width="1.3"/><text x="49" y="480" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">데이터</text><text x="49" y="500" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5S</text><rect x="96" y="448" width="166" height="76" rx="8" fill="#E5F4F3" stroke="#028090" stroke-width="1.2"/><text x="179.0" y="478" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#454C57" text-anchor="middle">불용·중복 코드</text><text x="179.0" y="500" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#454C57" text-anchor="middle">보관(archive) 처리</text><rect x="270" y="448" width="166" height="76" rx="8" fill="#E5F4F3" stroke="#028090" stroke-width="1.2"/><text x="353.0" y="478" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#454C57" text-anchor="middle">코드체계 정비</text><text x="353.0" y="500" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#454C57" text-anchor="middle">1품목 1코드</text><rect x="444" y="448" width="166" height="76" rx="8" fill="#E5F4F3" stroke="#028090" stroke-width="1.2"/><text x="527.0" y="478" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#454C57" text-anchor="middle">오류·결측 클렌징</text><text x="527.0" y="500" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#454C57" text-anchor="middle">재고 실사</text><rect x="618" y="448" width="166" height="76" rx="8" fill="#E5F4F3" stroke="#028090" stroke-width="1.2"/><text x="701.0" y="478" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#454C57" text-anchor="middle">입력 규정·검증 규칙</text><text x="701.0" y="500" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#454C57" text-anchor="middle">승인 게이트</text><rect x="792" y="448" width="166" height="76" rx="8" fill="#E5F4F3" stroke="#028090" stroke-width="1.2"/><text x="875.0" y="478" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#454C57" text-anchor="middle">발생 시점 입력</text><text x="875.0" y="500" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#454C57" text-anchor="middle">품질 지표 정례화</text><text x="490.0" y="574" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">다섯 걸음이 곧 데이터 품질 방법론이다 — 5S 없이 AI 없다</text><text x="490.0" y="602" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">1부 2장 — 현장 진단과 3정5S: 데이터 품질의 원점</text></svg>