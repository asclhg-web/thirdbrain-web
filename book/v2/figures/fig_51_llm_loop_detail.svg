<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640"><rect width="960" height="640" fill="#FFFFFF"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1E2761"/></marker><marker id="ahT" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#028090"/></marker><marker id="ahA" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#B85042"/></marker><marker id="ahG" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#5A6472"/></marker></defs><text x="480.0" y="38" font-family="NanumGothic" font-size="22" font-weight="bold" fill="#1E2761" text-anchor="middle">LLM 무한 루프 상세 아키텍처</text><text x="480.0" y="62" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#5A6472" text-anchor="middle">분기의 사이클에서 상시의 사이클로 — 다섯 단계를 도구가 잇는다</text><rect x="170" y="80" width="690" height="52" rx="10" fill="#1E2761" stroke="#1E2761" stroke-width="2"/><text x="515" y="101" font-family="NanumGothic" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">LLM 에이전트 오케스트레이터</text><text x="515" y="121" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#CADCFC" text-anchor="middle">각 단계의 산출을 읽고 다음 도구를 호출하며 전체를 서사로 기록 — Dify 에이전트 · n8n 워크플로</text><line x1="245" y1="134" x2="245" y2="162" stroke="#028090" stroke-width="2.5" marker-end="url(#ahT)"/><text x="258" y="152" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#028090" text-anchor="start">상시 반복</text><rect x="170" y="166" width="150" height="58" rx="10" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.8"/><text x="245" y="191" font-family="NanumGothic" font-size="15" font-weight="bold" fill="#1E2761" text-anchor="middle">Define</text><text x="245" y="211" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#028090" text-anchor="middle">정의</text><text x="340" y="192" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#454C57" text-anchor="start">관리도 이상·경영 질문을 받아</text><text x="340" y="211" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#454C57" text-anchor="start">문제 정의문·CTQ·판정 기준 작성</text><rect x="620" y="166" width="240" height="58" rx="8" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.2"/><text x="740" y="192" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">Odoo 대시보드</text><text x="740" y="210" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">SPC 관리도 알람</text><rect x="170" y="236" width="150" height="58" rx="10" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.8"/><text x="245" y="261" font-family="NanumGothic" font-size="15" font-weight="bold" fill="#1E2761" text-anchor="middle">Measure</text><text x="245" y="281" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#028090" text-anchor="middle">수집</text><text x="340" y="262" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#454C57" text-anchor="start">3원천(트랜잭션·현장·암묵지) 수집</text><text x="340" y="281" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#454C57" text-anchor="start">+ 측정 신뢰성 검증</text><rect x="620" y="236" width="240" height="58" rx="8" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.2"/><text x="740" y="262" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">Odoo 트랜잭션·태블릿 POP·IoT</text><text x="740" y="280" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">n8n ETL 파이프라인</text><rect x="170" y="306" width="150" height="58" rx="10" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.8"/><text x="245" y="331" font-family="NanumGothic" font-size="15" font-weight="bold" fill="#1E2761" text-anchor="middle">Analyze</text><text x="245" y="351" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#028090" text-anchor="middle">학습</text><text x="340" y="332" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#454C57" text-anchor="start">통계 검정 × ML 패턴 × 그래프 역추적</text><text x="340" y="351" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#454C57" text-anchor="start">→ 원인 확정</text><rect x="620" y="306" width="240" height="58" rx="8" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.2"/><text x="740" y="332" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">통계·ML 모델</text><text x="740" y="350" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">Neo4j 지식그래프</text><rect x="170" y="376" width="150" height="58" rx="10" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.8"/><text x="245" y="401" font-family="NanumGothic" font-size="15" font-weight="bold" fill="#1E2761" text-anchor="middle">Improve</text><text x="245" y="421" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#028090" text-anchor="middle">추론</text><text x="340" y="402" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#454C57" text-anchor="start">개선안 생성 → What-if 시뮬레이션</text><text x="340" y="421" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#454C57" text-anchor="start">→ 대안 비교 성적표</text><rect x="620" y="376" width="240" height="58" rx="8" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.2"/><text x="740" y="402" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">LLM(Claude/Ollama) 생성</text><text x="740" y="420" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">frePPLe·디지털 트윈</text><rect x="170" y="510" width="150" height="58" rx="10" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.8"/><text x="245" y="535" font-family="NanumGothic" font-size="15" font-weight="bold" fill="#1E2761" text-anchor="middle">Control</text><text x="245" y="555" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#028090" text-anchor="middle">환류</text><text x="340" y="536" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#454C57" text-anchor="start">마스터·규칙 개정을 Odoo로 환류</text><text x="340" y="555" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#454C57" text-anchor="start">+ 관리도 재설정·상시 감시</text><rect x="620" y="510" width="240" height="58" rx="8" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.2"/><text x="740" y="536" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">Odoo 마스터·자동화 규칙</text><text x="740" y="554" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">감사 로그</text><line x1="245" y1="226" x2="245" y2="234" stroke="#1E2761" stroke-width="2" marker-end="url(#ah)"/><line x1="245" y1="296" x2="245" y2="304" stroke="#1E2761" stroke-width="2" marker-end="url(#ah)"/><line x1="245" y1="366" x2="245" y2="374" stroke="#1E2761" stroke-width="2" marker-end="url(#ah)"/><line x1="245" y1="436" x2="245" y2="458" stroke="#B85042" stroke-width="2" marker-end="url(#ahA)"/><rect x="170" y="460" width="690" height="36" rx="8" fill="#F7E6E2" stroke="#B85042" stroke-width="1.8" stroke-dasharray="6,4"/><text x="515" y="483" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#B85042" text-anchor="middle">승인 게이트 — Human-in-the-Loop: 승인 · 수정 · 반려(+이유 기록)</text><line x1="245" y1="496" x2="245" y2="508" stroke="#B85042" stroke-width="2" marker-end="url(#ahA)"/><line x1="170" y1="539" x2="118" y2="539" stroke="#B85042" stroke-width="2.2" stroke-dasharray="6,4"/><line x1="118" y1="539" x2="118" y2="195" stroke="#B85042" stroke-width="2.2" stroke-dasharray="6,4"/><line x1="118" y1="195" x2="166" y2="195" stroke="#B85042" stroke-width="2.2" marker-end="url(#ahA)" stroke-dasharray="6,4"/><text x="58" y="300" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#B85042" text-anchor="middle">결과 관측 —</text><text x="58" y="317" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#B85042" text-anchor="middle">예측 오차·</text><text x="58" y="334" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#B85042" text-anchor="middle">개입 기록이</text><text x="58" y="351" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#B85042" text-anchor="middle">다음 회전의</text><text x="58" y="368" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#B85042" text-anchor="middle">학습 데이터</text><text x="480.0" y="620" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">사람이 분기 단위로 돌리던 DMAIC를, 에이전트는 문제의 크기에 따라 하루·한 시간 단위로 돌린다 (5.7절)</text></svg>