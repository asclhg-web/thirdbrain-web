<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560"><rect width="960" height="560" fill="#FFFFFF"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1E2761"/></marker><marker id="ahT" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#028090"/></marker><marker id="ahA" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#B85042"/></marker><marker id="ahG" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#5A6472"/></marker></defs><text x="480.0" y="40" font-family="NanumGothic" font-size="22" font-weight="bold" fill="#1E2761" text-anchor="middle">“맞다/틀리다”에서 “점점 그럴듯해지는”으로</text><text x="480.0" y="66" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#5A6472" text-anchor="middle">전통 시스템의 이분법 vs JEDAIX의 확률적 상태 관리 (wave/particle 이중 표현)</text><rect x="50" y="92" width="860" height="150" rx="12" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.4"/><text x="70" y="120" font-family="NanumGothic" font-size="14" font-weight="bold" fill="#454C57" text-anchor="start">전통 시스템 — 이분법 상태 관리</text><rect x="170" y="140" width="240" height="74" rx="8" fill="#FFFFFF" stroke="#5A6472" stroke-width="1.6"/><text x="290" y="172" font-family="NanumGothic" font-size="16" font-weight="bold" fill="#454C57" text-anchor="middle">맞다</text><text x="290" y="196" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">승인 · 합격 · 확정</text><rect x="550" y="140" width="240" height="74" rx="8" fill="#FFFFFF" stroke="#5A6472" stroke-width="1.6"/><text x="670" y="172" font-family="NanumGothic" font-size="16" font-weight="bold" fill="#454C57" text-anchor="middle">틀리다</text><text x="670" y="196" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">반려 · 불합격 · 기각</text><line x1="440" y1="177" x2="520" y2="177" stroke="#B85042" stroke-width="2" stroke-dasharray="6,4"/><text x="480" y="160" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#B85042" text-anchor="middle">중간 상태 없음</text><text x="480" y="232" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#B85042" text-anchor="middle">“아직 확실하지 않은” 정보가 소실된다</text><rect x="50" y="268" width="860" height="220" rx="12" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.4"/><text x="70" y="296" font-family="NanumGothic" font-size="14" font-weight="bold" fill="#1E2761" text-anchor="start">JEDAIX — 확률적 상태 관리</text><rect x="100" y="322" width="64" height="56" rx="4" fill="#E3EDF8" stroke="#1E2761" stroke-width="0.8"/><rect x="168" y="322" width="64" height="56" rx="4" fill="#CFE0F1" stroke="#1E2761" stroke-width="0.8"/><rect x="236" y="322" width="64" height="56" rx="4" fill="#B6D2E8" stroke="#1E2761" stroke-width="0.8"/><rect x="304" y="322" width="64" height="56" rx="4" fill="#9AC2DC" stroke="#1E2761" stroke-width="0.8"/><rect x="372" y="322" width="64" height="56" rx="4" fill="#7BB0CE" stroke="#1E2761" stroke-width="0.8"/><rect x="440" y="322" width="64" height="56" rx="4" fill="#589CBE" stroke="#1E2761" stroke-width="0.8"/><rect x="508" y="322" width="64" height="56" rx="4" fill="#3B88AC" stroke="#1E2761" stroke-width="0.8"/><rect x="576" y="322" width="64" height="56" rx="4" fill="#1F7396" stroke="#1E2761" stroke-width="0.8"/><text x="100" y="398" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="start">0%</text><text x="636" y="398" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="end">100%</text><text x="372" y="398" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">연속 확신도 wave — 반복 확인마다 상승, 엇갈린 응답이면 하락</text><line x1="480.79999999999995" y1="306" x2="480.79999999999995" y2="386" stroke="#B85042" stroke-width="2.2" stroke-dasharray="5,4"/><text x="480.79999999999995" y="298" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#B85042" text-anchor="middle">임계값 70% · 최소 3회</text><line x1="648" y1="350.0" x2="682" y2="350.0" stroke="#028090" stroke-width="2.4" marker-end="url(#ahT)"/><rect x="688" y="316" width="190" height="68" rx="8" fill="#1E2761" stroke="#1E2761" stroke-width="1.5"/><text x="783" y="342" font-family="NanumGothic" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">확정 (particle)</text><text x="783" y="364" font-family="NanumGothic" font-size="10.8" font-weight="bold" fill="#CADCFC" text-anchor="middle">사람의 승인 순간에만</text><text x="720" y="400" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#B85042" text-anchor="start">HITL 승인 게이트</text><rect x="700" y="386" width="14" height="18" rx="3" fill="#B85042"/><text x="480.0" y="452" font-family="NanumGothic" font-size="12.2" font-weight="bold" fill="#1E2761" text-anchor="middle">“아직 확실하지 않지만 점점 그럴듯해지는” 중간 상태를 숫자(0~100%)로 계속 보여주고,</text><text x="480.0" y="472" font-family="NanumGothic" font-size="12.2" font-weight="bold" fill="#1E2761" text-anchor="middle">사람이 최종 승인하는 순간에만 이분법적 ‘확정’으로 전환한다</text><text x="480.0" y="544" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">3부 19장 — JEDAIX 운영 매뉴얼 v9, 3.4절 (정인호, 2026)</text></svg>