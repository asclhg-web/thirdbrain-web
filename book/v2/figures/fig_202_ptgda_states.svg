hor="middle">GL 계정·손실 산출</text><line x1="786.0" y1="224.0" x2="814.0" y2="224.0" stroke="#028090" stroke-width="2.6" marker-end="url(#ahT)"/><rect x="816.0" y="170" width="168" height="108" rx="10" fill="#E5F4F3" stroke="#028090" stroke-width="1.8"/><text x="900.0" y="200" font-family="NanumGothic" font-size="16" font-weight="bold" fill="#028090" text-anchor="middle">통치</text><text x="900.0" y="220" font-family="NanumGothic" font-size="11" font-weight="normal" fill="#5A6472" text-anchor="middle">governed</text><text x="900.0" y="244" font-family="NanumGothic" font-size="10.8" font-weight="normal" fill="#5A6472" text-anchor="middle">Station8 Agent 승격</text><text x="900.0" y="260" font-family="NanumGothic" font-size="10.8" font-weight="normal" fill="#5A6472" text-anchor="middle">Loop·DTF 기한 추적</text><rect x="591.0" y="130" width="18" height="24" rx="3" fill="#B85042"/><circle cx="600.0" cy="124" r="6" fill="#B85042"/><text x="600.0" y="112" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#B85042" text-anchor="middle">HITL 승인</text><line x1="600.0" y1="156" x2="600.0" y2="188" stroke="#B85042" stroke-width="1.6" stroke-dasharray="4,3"/><path d="M480.0,282 Q400.0,344 320.0,284" fill="none" stroke="#B85042" stroke-width="2.2" marker-end="url(#ahA)" stroke-dasharray="6,4"/><text x="400.0" y="330" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#B85042" text-anchor="middle">엇갈린 응답 → 확신도 하락(반려)</text><path d="M260.0,282 Q210.0,328 162.0,354" fill="none" stroke="#B85042" stroke-width="2.2" marker-end="url(#ahA)" stroke-dasharray="6,4"/><rect x="30.0" y="360" width="150" height="44" rx="8" fill="none" stroke="#B85042" stroke-width="1.4" stroke-dasharray="6,5"/><text x="105.0" y="380" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#B85042" text-anchor="middle">소멸</text><text x="105.0" y="396" font-family="NanumGothic" font-size="10.5" font-weight="normal" fill="#5A6472" text-anchor="middle">반복 확인 없음 · 신호 사그라짐</text><line x1="30.0" y1="146" x2="570.0" y2="146" stroke="#028090" stroke-width="1.6"/><text x="300.0" y="138" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#028090" text-anchor="middle">연속 확신도 wave (0~100%)</text><line x1="630.0" y1="146" x2="970.0" y2="146" stroke="#1E2761" stroke-width="1.6"/><text x="800.0" y="138" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#1E2761" text-anchor="middle">이진 확정 particle</text><text x="500.0" y="448" font-family="NanumGothic" font-size="12" font-weight="normal" fill="#5A6472" text-anchor="middle">확정(입자화)의 순간, 발굴된 암묵지는 품질손실비 등 GL 계정과 연환산 손실 추정치로 물질화되고</text><text x="500.0" y="468" font-family="NanumGothic" font-size="12" font-weight="normal" fill="#5A6472" text-anchor="middle">채택된 개선활동은 DTF 기한(긴급 3일·보통 7일·여유 14일)을 가진 Loop 인스턴스로 추적된다</text><text x="500.0" y="509" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">3부 20장 — JEDAIX 운영 매뉴얼 v9, 부록 D의 상태 전이를 재구성 (정인호, 2026)</text></svg>