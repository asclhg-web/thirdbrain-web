<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620"><rect width="960" height="620" fill="#FFFFFF"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1E2761"/></marker><marker id="ahT" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#028090"/></marker><marker id="ahA" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#B85042"/></marker><marker id="ahG" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#5A6472"/></marker></defs><text x="480.0" y="40" font-family="NanumGothic" font-size="21" font-weight="bold" fill="#1E2761" text-anchor="middle">조립 병목 사례 — 계획의 기준을 바꾸다 (TOC 전후)</text><text x="480.0" y="66" font-family="NanumGothic" font-size="12.2" font-weight="normal" fill="#5A6472" text-anchor="middle">전체 라인의 실제 처리능력은 병목 공정(조립, 100개/일)을 절대 넘을 수 없다 — Goldratt의 제약이론</text><rect x="40" y="92" width="880" height="214" rx="12" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.4"/><text x="60" y="120" font-family="NanumGothic" font-size="14" font-weight="bold" fill="#1E2761" text-anchor="start">도입 전 — 재단 속도 기준 계획</text><text x="60" y="140" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="start">계획은 가장 빠른 공정(재단 160개/일)의 속도로 짜인다</text><rect x="90" y="156" width="150" height="96" rx="6" fill="#CADCFC" stroke="#1E2761" stroke-width="1.2"/><text x="165.0" y="209.0" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#1E2761" text-anchor="middle">재단</text><text x="165.0" y="272" font-family="NanumGothic" font-size="10.8" font-weight="normal" fill="#5A6472" text-anchor="middle">160개/일</text><line x1="244" y1="222" x2="276" y2="222" stroke="#1E2761" stroke-width="2.2" marker-end="url(#ah)"/><rect x="280" y="192" width="150" height="60" rx="6" fill="#B85042" stroke="#1E2761" stroke-width="1.2"/><text x="355.0" y="227.0" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">조립</text><text x="355.0" y="272" font-family="NanumGothic" font-size="10.8" font-weight="normal" fill="#5A6472" text-anchor="middle">100개/일</text><line x1="434" y1="222" x2="466" y2="222" stroke="#1E2761" stroke-width="2.2" marker-end="url(#ah)"/><rect x="470" y="174" width="150" height="78" rx="6" fill="#CADCFC" stroke="#1E2761" stroke-width="1.2"/><text x="545.0" y="218.0" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#1E2761" text-anchor="middle">품질검사</text><text x="545.0" y="272" font-family="NanumGothic" font-size="10.8" font-weight="normal" fill="#5A6472" text-anchor="middle">130개/일</text><line x1="624" y1="222" x2="656" y2="222" stroke="#1E2761" stroke-width="2.2" marker-end="url(#ah)"/><rect x="660" y="162" width="150" height="90" rx="6" fill="#CADCFC" stroke="#1E2761" stroke-width="1.2"/><text x="735.0" y="212.0" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#1E2761" text-anchor="middle">포장</text><text x="735.0" y="272" font-family="NanumGothic" font-size="10.8" font-weight="normal" fill="#5A6472" text-anchor="middle">150개/일</text><text x="864" y="184" font-family="NanumGothic" font-size="10.6" font-weight="bold" fill="#B85042" text-anchor="middle">조립 앞에</text><text x="864" y="200" font-family="NanumGothic" font-size="10.6" font-weight="bold" fill="#B85042" text-anchor="middle">재공 적체</text><text x="864" y="216" font-family="NanumGothic" font-size="10.6" font-weight="bold" fill="#B85042" text-anchor="middle">(병목 방치)</text><text x="60" y="296" font-family="NanumGothic" font-size="11.2" font-weight="normal" fill="#454C57" text-anchor="start">계획 160개/일 — 병목 능력(100개/일)의 160%를 요구하는 달성 불가능한 계획</text><text x="900" y="296" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#B85042" text-anchor="end">→ 상습 납기 지연</text><rect x="40" y="330" width="880" height="214" rx="12" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.4"/><text x="60" y="358" font-family="NanumGothic" font-size="14" font-weight="bold" fill="#1E2761" text-anchor="start">도입 후 — 병목 기준 계획</text><text x="60" y="378" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="start">경영진 결정(임시 인력 배치)으로 병목 능력을 갱신하고, MPS는 병목 기준으로 재산출</text><rect x="90" y="394" width="150" height="96" rx="6" fill="#CADCFC" stroke="#1E2761" stroke-width="1.2"/><text x="165.0" y="447.0" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#1E2761" text-anchor="middle">재단</text><text x="165.0" y="510" font-family="NanumGothic" font-size="10.8" font-weight="normal" fill="#5A6472" text-anchor="middle">160개/일</text><line x1="244" y1="460" x2="276" y2="460" stroke="#1E2761" stroke-width="2.2" marker-end="url(#ah)"/><rect x="280" y="416" width="150" height="74" rx="6" fill="#028090" stroke="#1E2761" stroke-width="1.2"/><text x="355.0" y="458.0" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">조립</text><text x="355.0" y="510" font-family="NanumGothic" font-size="10.8" font-weight="normal" fill="#5A6472" text-anchor="middle">100개/일</text><line x1="434" y1="460" x2="466" y2="460" stroke="#1E2761" stroke-width="2.2" marker-end="url(#ah)"/><rect x="470" y="412" width="150" height="78" rx="6" fill="#CADCFC" stroke="#1E2761" stroke-width="1.2"/><text x="545.0" y="456.0" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#1E2761" text-anchor="middle">품질검사</text><text x="545.0" y="510" font-family="NanumGothic" font-size="10.8" font-weight="normal" fill="#5A6472" text-anchor="middle">130개/일</text><line x1="624" y1="460" x2="656" y2="460" stroke="#1E2761" stroke-width="2.2" marker-end="url(#ah)"/><rect x="660" y="400" width="150" height="90" rx="6" fill="#CADCFC" stroke="#1E2761" stroke-width="1.2"/><text x="735.0" y="450.0" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#1E2761" text-anchor="middle">포장</text><text x="735.0" y="510" font-family="NanumGothic" font-size="10.8" font-weight="normal" fill="#5A6472" text-anchor="middle">150개/일</text><text x="864" y="422" font-family="NanumGothic" font-size="10.6" font-weight="bold" fill="#028090" text-anchor="middle">병목이 전체</text><text x="864" y="438" font-family="NanumGothic" font-size="10.6" font-weight="bold" fill="#028090" text-anchor="middle">흐름의 북(drum)</text><text x="864" y="454" font-family="NanumGothic" font-size="10.6" font-weight="bold" fill="#028090" text-anchor="middle">이 된다</text><text x="60" y="534" font-family="NanumGothic" font-size="11.2" font-weight="normal" fill="#454C57" text-anchor="start">계획 = 병목의 실제 처리능력 기준 — 불량률은 6 Station 확인 이력에서 자동 산출</text><text x="900" y="534" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#028090" text-anchor="end">→ 납기 준수</text><text x="480.0" y="572" font-family="NanumGothic" font-size="12.2" font-weight="bold" fill="#1E2761" text-anchor="middle">발견과 정량화는 시스템이, 설비·인력·납기의 판단은 경영진이 — 자동화의 경계선이 방법론에 내장되어 있다</text><text x="480.0" y="604" font-family="NanumGothic" font-size="11" font-weight="normal" fill="#5A6472" text-anchor="middle">※ A정밀부품㈜ 가상 사례(JEDAIX 운영 매뉴얼 v9) — 수치는 설명용 · Goldratt &amp; Cox (1984)</text></svg>