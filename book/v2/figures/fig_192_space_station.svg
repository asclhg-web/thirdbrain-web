idth="20" height="14" rx="3" fill="#028090" stroke="#FFFFFF" stroke-width="1"/><text x="88" y="500" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#454C57" text-anchor="start">주 활성 조합</text><rect x="190" y="488" width="20" height="14" rx="3" fill="#7FB8C0" stroke="#FFFFFF" stroke-width="1"/><text x="218" y="500" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#454C57" text-anchor="start">보조 활성</text><rect x="300" y="488" width="20" height="14" rx="3" fill="#EEF1F5" stroke="#5A6472" stroke-width="1"/><text x="328" y="500" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#454C57" text-anchor="start">드물게 일어나는 조합</text><text x="490.0" y="534" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#B85042" text-anchor="middle">회색 칸에서 반복되는 사건이 발견되면 “표준 프로세스가 미처 예상 못 한 숨은 문제”의 신호다</text><text x="490.0" y="554" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#B85042" text-anchor="middle">— 좌표 프레임 밖의 반복으로 이상을 알리는, 의미의 관리도</text><text x="490.0" y="624" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#5A6472" text-anchor="middle">칸 배치는 개념 예시 — JEDAIX 운영 매뉴얼 v9 3.2절의 좌표 프레임을 6 Station 표기로 재구성 (정인호, 2026)</text></svg>