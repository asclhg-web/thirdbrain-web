th="170" height="58" rx="9" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.5"/><text x="256.48403011065693" y="508.5" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">입고·3단계 대조</text><text x="256.48403011065693" y="530.5" font-family="NanumGothic" font-size="11" font-weight="normal" fill="#5A6472" text-anchor="middle">PO·입고·청구서 검증</text><rect x="171.48403011065693" y="249.5" width="170" height="58" rx="9" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.5"/><text x="256.48403011065693" y="273.5" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">재고·회계 반영</text><text x="256.48403011065693" y="295.5" font-family="NanumGothic" font-size="11" font-weight="normal" fill="#5A6472" text-anchor="middle">리드타임 실적 축적</text><circle cx="460" cy="396" r="96" fill="#1E2761"/><text x="460" y="374" font-family="NanumGothic" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">발주 자동화</text><text x="460" y="398" font-family="NanumGothic" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">사이클</text><text x="460" y="424" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#CADCFC" text-anchor="middle">규칙은 집행하고</text><text x="460" y="441" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#CADCFC" text-anchor="middle">사람은 판단한다</text><text x="460.0" y="720" font-family="NanumGothic" font-size="12.5" font-weight="normal" fill="#5A6472" text-anchor="middle">한 회전마다 단가·리드타임·납기준수율의 실적이 쌓여, 다음 발주가 더 정확해진다</text><text x="460.0" y="744" font-family="NanumGothic" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">2부 11장 — 매입(구매)</text></svg>