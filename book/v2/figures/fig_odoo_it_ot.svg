<svg xmlns="http://www.w3.org/2000/svg" width="690" height="1010" viewBox="0 0 690 1010"><rect x="0" y="0" width="690" height="1010" rx="0" fill="#FFFFFF"/><text x="359.0" y="44" font-family="NanumGothic" font-size="27" font-weight="bold" fill="#A31515" text-anchor="middle">Odoo 중심 AI ERP혁명 — 영업·제조 지능화</text><text x="359.0" y="70" font-family="NanumGothic" font-size="14.5" font-weight="normal" fill="#1F6FB5" text-anchor="middle">기존 ERP/MES/SCM/PLM 구축 중심에서 AI ERP 플랫폼으로 진화</text><rect x="66" y="96" width="606" height="150" rx="10" fill="#F5F5F3" stroke="#BBBBBB" stroke-width="1.2"/><text x="82" y="122" font-family="NanumGothic" font-size="16" font-weight="bold" fill="#333333" text-anchor="start">IT 영역 — 실시간 운영솔루션</text><rect x="82" y="136" width="190" height="52" rx="8" fill="#1F6FB5"/><text x="177" y="158" font-family="NanumGothic" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Odoo 플랫폼</text><text x="177" y="178" font-family="NanumGothic" font-size="12.5" font-weight="normal" fill="#DCEBFF" text-anchor="middle">(Management)</text><rect x="292" y="138" width="82" height="30" rx="6" fill="#FFFFFF" stroke="#1F6FB5" stroke-width="1.6"/><text x="333" y="158" font-family="NanumGothic" font-size="15" font-weight="bold" fill="#1F4E79" text-anchor="middle">ERP</text><rect x="387" y="138" width="82" height="30" rx="6" fill="#FFFFFF" stroke="#1F6FB5" stroke-width="1.6"/><text x="428" y="158" font-family="NanumGothic" font-size="15" font-weight="bold" fill="#1F4E79" text-anchor="middle">SCM</text><rect x="482" y="138" width="82" height="30" rx="6" fill="#FFFFFF" stroke="#1F6FB5" stroke-width="1.6"/><text x="523" y="158" font-family="NanumGothic" font-size="15" font-weight="bold" fill="#1F4E79" text-anchor="middle">PLM</text><rect x="577" y="138" width="82" height="30" rx="6" fill="#FFFFFF" stroke="#1F6FB5" stroke-width="1.6"/><text x="618" y="158" font-family="NanumGothic" font-size="15" font-weight="bold" fill="#1F4E79" text-anchor="middle">MES</text><text x="292" y="186" font-family="NanumGothic" font-size="12.5" font-weight="normal" fill="#555555" text-anchor="start">전사 ERP · 협력사 SCM · 설계 PLM · 현장 MES</text><text x="82" y="222" font-family="NanumGothic" font-size="12.8" font-weight="normal" fill="#444444" text-anchor="start">전사기업 운영의 ERP 시스템 · 협력사 연동 SCM · 설계부문 PLM · 제조현장 중심 MES</text><line x1="359.0" y1="252" x2="359.0" y2="280" stroke="#1F6FB5" stroke-width="7"/><polygon points="350.0,278 368.0,278 359.0,290" fill="#1F6FB5"/><text x="377.0" y="275.0" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#1F4E79" text-anchor="start">제조 Process · 표준데이터</text><rect x="66" y="296" width="606" height="300" rx="10" fill="#EFF7EA" stroke="#4E9A3D" stroke-width="2"/><text x="82" y="324" font-family="NanumGothic" font-size="16" font-weight="bold" fill="#2F6B22" text-anchor="start">지능화 영역 — AI에이전트 + 온톨로지·지식그래프</text><rect x="82" y="338" width="190" height="52" rx="8" fill="#E07B2E"/><text x="177" y="360" font-family="NanumGothic" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">지능형 시스템</text><text x="177" y="380" font-family="NanumGothic" font-size="12.5" font-weight="normal" fill="#FFE9D6" text-anchor="middle">(Intelligent)</text><rect x="292" y="340" width="88" height="30" rx="6" fill="#2F7D32"/><text x="336" y="360" font-family="NanumGothic" font-size="14.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">APS</text><rect x="392" y="340" width="88" height="30" rx="6" fill="#2F7D32"/><text x="436" y="360" font-family="NanumGothic" font-size="14.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CPS</text><rect x="492" y="340" width="88" height="30" rx="6" fill="#2F7D32"/><text x="536" y="360" font-family="NanumGothic" font-size="14.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">빅데이터</text><text x="292" y="392" font-family="NanumGothic" font-size="13.5" font-weight="bold" fill="#B03A2E" text-anchor="start">예측시스템: 일정·비용·품질·설비·공정</text><text x="82" y="426" font-fami