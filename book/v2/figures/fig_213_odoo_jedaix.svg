<svg xmlns="http://www.w3.org/2000/svg" width="940" height="620" viewBox="0 0 940 620"><rect width="940" height="620" fill="#FFFFFF"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1E2761"/></marker><marker id="ahT" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#028090"/></marker><marker id="ahA" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#B85042"/></marker></defs><text x="470.0" y="40" font-family="NanumGothic" font-size="23" font-weight="bold" fill="#1E2761" text-anchor="middle">Odoo × JEDAIX 통합 아키텍처 — 3뇌 구조</text><text x="470.0" y="66" font-family="NanumGothic" font-size="13.5" font-weight="normal" fill="#5A6472" text-anchor="middle">형식지의 원장과 암묵지의 판단 계층이 하나의 루프로 만난다</text><rect x="300" y="95" width="340" height="92" rx="12" fill="#1E2761" stroke="#1E2761" stroke-width="2"/><text x="470.0" y="130" font-family="NanumGothic" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">융합 판단 — 3rd Brain의 출력</text><text x="470.0" y="156" font-family="NanumGothic" font-size="12.5" font-weight="normal" fill="#CADCFC" text-anchor="middle">예측 · What-if · 실행 제안 · 자연어 답변</text><rect x="90" y="235" width="340" height="190" rx="12" fill="#E8F0FB" stroke="#1E2761" stroke-width="2"/><text x="260" y="265" font-family="NanumGothic" font-size="17" font-weight="bold" fill="#1E2761" text-anchor="middle">Odoo — 2nd Brain</text><text x="260" y="287" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#028090" text-anchor="middle">형식지의 원장 · 실행의 손발</text><text x="260" y="315" font-family="NanumGothic" font-size="12.5" font-weight="normal" fill="#5A6472" text-anchor="middle">트랜잭션: 수주·발주·재고·제조·회계</text><text x="260" y="337" font-family="NanumGothic" font-size="12.5" font-weight="normal" fill="#5A6472" text-anchor="middle">마스터: 품목·BOM·거래처·코드체계</text><text x="260" y="359" font-family="NanumGothic" font-size="12.5" font-weight="normal" fill="#5A6472" text-anchor="middle">실행: 작업지시·발주서·전표 반영</text><rect x="510" y="235" width="340" height="190" rx="12" fill="#E5F4F3" stroke="#028090" stroke-width="2"/><text x="680" y="265" font-family="NanumGothic" font-size="17" font-weight="bold" fill="#028090" text-anchor="middle">JEDAIX — 3rd Brain</text><text x="680" y="287" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">암묵지의 발굴 · 의미와 판단</text><text x="680" y="315" font-family="NanumGothic" font-size="12.5" font-weight="normal" fill="#5A6472" text-anchor="middle">5 Space × 6 Station 워크벤치</text><text x="680" y="337" font-family="NanumGothic" font-size="12.5" font-weight="normal" fill="#5A6472" text-anchor="middle">PTGDA · TA 분류 · OWL 온톨로지</text><text x="680" y="359" font-family="NanumGothic" font-size="12.5" font-weight="normal" fill="#5A6472" text-anchor="middle">Agent Workflow · War Room</text><line x1="430" y1="293" x2="508" y2="293" stroke="#1E2761" stroke-width="2.5" marker-end="url(#ah)"/><text x="469" y="279" font-family="NanumGothic" font-size="11" font-weight="normal" fill="#1E2761" text-anchor="middle">트랜잭션·이벤트</text><line x1="508" y1="369" x2="430" y2="369" stroke="#028090" stroke-width="2.5" marker-end="url(#ahT)"/><text x="469" y="391" font-family="NanumGothic" font-size="11" font-weight="normal" fill="#028090" text-anchor="middle">확정 판단·규칙 환류</text><line x1="260" y1="233" x2="400" y2="190" stroke="#1E2761" stroke-width="2" marker-end="url(#ah)"/><line x1="680" y1="233" x2="540" y2="190" stroke="#028090" stroke-width="2" marker-end="url(#ahT)"/><rect x="200" y="480" width="540" height="92" rx="12" fill="#EEF1F5" stroke="#5A6472" stroke-width="1.6"/><text x="470.0" y="510" font-family="NanumGothic" font-size="15.5" font-weight="bold" fill="#1E2761" text-anchor="middle">현장·사람 — 1st Brain</text><text x="470.0" y="534" font-family="NanumGothic" font-size="12.5" font-weight="normal" fill="#5A6472" text-anchor="middle">경험과 발화(암묵지의 원천) · HITL 승인(판단의 최종 서명자)</text><line x1="330" y1="478" x2="235" y2="429" stroke="#1E2761" stroke-width="2" marker-end="url(#ah)"/><line x1="610" y1="478" x2="705" y2="429" stroke="#028090" stroke-width="2" marker-end="url(#ahT)"/><text x="250" y="464" font-family="NanumGothic" font-size="11" font-weight="normal" fill="#1E2761" text-anchor="middle">실적·기록</text><text x="700" y="464" font-family="NanumGothic" font-size="11" font-weight="normal" fill="#028090" text-anchor="middle">발화·증언·승인</text><text x="470.0" y="606" font-family="NanumGothic" font-size="12" font-weight="normal" fill="#5A6472" text-anchor="middle">JEDAIX는 ERP를 대체하지 않는다 — 기록 없는 판단은 맹목, 판단 없는 기록은 미완 (3부 21장)</text></svg>