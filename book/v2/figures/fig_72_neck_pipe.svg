<svg xmlns="http://www.w3.org/2000/svg" width="940" height="440" viewBox="0 0 940 440"><rect width="940" height="440" fill="#FFFFFF"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1E2761"/></marker><marker id="ahT" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#028090"/></marker><marker id="ahA" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#B85042"/></marker><marker id="ahG" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#5A6472"/></marker></defs><text x="470.0" y="38" font-family="NanumGothic" font-size="22" font-weight="bold" fill="#1E2761" text-anchor="middle">Neck 공정과 리드타임</text><text x="470.0" y="62" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#5A6472" text-anchor="middle">공장 전체의 리드타임은 Neck 공정이 하나만 있어도 그것에 의해 결정된다</text><path d="M205,180.0 L235,185.0 L235,265.0 L205,270.0 z" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.2"/><path d="M385,185.0 L425,211.0 L425,239.0 L385,265.0 z" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.2"/><path d="M535,211.0 L565,185.0 L565,265.0 L535,239.0 z" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.2"/><path d="M715,185.0 L745,180.0 L745,270.0 L715,265.0 z" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.2"/><rect x="55" y="180.0" width="150" height="90" rx="4" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.6"/><rect x="235" y="185.0" width="150" height="80" rx="4" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.6"/><rect x="565" y="185.0" width="150" height="80" rx="4" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.6"/><rect x="745" y="180.0" width="150" height="90" rx="4" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.6"/><rect x="425" y="211.0" width="110" height="28" rx="4" fill="#F7E6E2" stroke="#B85042" stroke-width="2.2"/><text x="130" y="130" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">선반</text><text x="130" y="150" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">능력 100/일</text><text x="310" y="130" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">밀링</text><text x="310" y="150" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">능력 90/일</text><text x="640" y="130" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">연마</text><text x="640" y="150" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">능력 90/일</text><text x="820" y="130" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">조립</text><text x="820" y="150" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">능력 100/일</text><text x="480" y="118" font-family="NanumGothic" font-size="14" font-weight="bold" fill="#B85042" text-anchor="middle">Neck — 열처리</text><text x="480" y="138" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#B85042" text-anchor="middle">능력 35/일</text><line x1="480" y1="146" x2="480" y2="205" stroke="#B85042" stroke-width="1" stroke-dasharray="3,3"/><path d="M75,212.0 H172 L185,225 L172,238.0 H75 z" fill="#028090" fill-opacity="0.85"/><path d="M248,214.0 H320 L333,225 L320,236.0 H248 z" fill="#028090" fill-opacity="0.85"/><path d="M435,220.0 H512 L525,225 L512,230.0 H435 z" fill="#028090" fill-opacity="0.85"/><path d="M578,220.0 H690 L703,225 L690,230.0 H578 z" fill="#028090" fill-opacity="0.85"/><path d="M758,220.0 H862 L875,225 L862,230.0 H758 z" fill="#028090" fill-opacity="0.85"/><circle cx="340" cy="205" r="6" fill="#9AA4B0"/><circle cx="360" cy="205" r="6" fill="#9AA4B0"/><circle cx="380" cy="205" r="6" fill="#9AA4B0"/><circle cx="400" cy="207" r="6" fill="#9AA4B0"/><circle cx="340" cy="225" r="6" fill="#9AA4B0"/><circle cx="360" cy="225" r="6" fill="#9AA4B0"/><circle cx="380" cy="225" r="6" fill="#9AA4B0"/><circle cx="400" cy="225" r="6" fill="#9AA4B0"/><circle cx="340" cy="245" r="6" fill="#9AA4B0"/><circle cx="360" cy="245" r="6" fill="#9AA4B0"/><circle cx="380" cy="245" r="6" fill="#9AA4B0"/><circle cx="400" cy="243" r="6" fill="#9AA4B0"/><text x="340" y="302" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#454C57" text-anchor="middle">체류품의 산</text><text x="340" y="318" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#454C57" text-anchor="middle">리드타임의 80~90%는 정체</text><line x1="352" y1="288" x2="372" y2="254" stroke="#5A6472" stroke-width="1"/><text x="60" y="302" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#454C57" text-anchor="start">투입 100/일</text><text x="895" y="302" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#454C57" text-anchor="end">전체 산출 = Neck의 능력(35/일)</text><rect x="150" y="340" width="640" height="58" rx="10" fill="#E8F0FB" stroke="#1E2761" stroke-width="1.5"/><text x="470.0" y="364" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#1E2761" text-anchor="middle">병목에서 잃은 한 시간은 시스템 전체가 잃은 한 시간이다 (TOC)</text><text x="470.0" y="386" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">Neck 해소의 실상은 '이동' — 대안 평가는 반드시 차기 병목의 위치까지 계산한다 (7.2절)</text></svg>