%) · 경상남도 보도(대성종합열처리 불량률 -50%)</text><text x="480.0" y="642" font-family="NanumGothic" font-size="10.2" font-weight="normal" fill="#5A6472" text-anchor="middle">Odoo 공식 고객 사례(Kompass GmbH 생산성 최대 +50%)</text></svg>