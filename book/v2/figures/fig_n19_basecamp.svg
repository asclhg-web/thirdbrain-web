<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700"><rect width="960" height="700" fill="#FFFFFF"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1E2761"/></marker><marker id="ahT" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#028090"/></marker><marker id="ahA" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#B85042"/></marker><marker id="ahG" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#5A6472"/></marker></defs><text x="480.0" y="38" font-family="NanumGothic" font-size="21" font-weight="bold" fill="#1E2761" text-anchor="middle">베이스캠프에서 정상까지 — 5 Space와 6 Station</text><text x="480.0" y="64" font-family="NanumGothic" font-size="13" font-weight="bold" fill="#5A6472" text-anchor="middle">다섯 캠프(공간)에서 출발한 문제가 여섯 정거장(흐름)을 지나 정상(통치)에 닿는다</text><path d="M100,540 L480,140 L860,540 z" fill="#EDF2F8" stroke="#9FB3D1" stroke-width="2"/><path d="M480,140 L521,183 L497,178 L473,196 L452,180 L439,183 z" fill="#FFFFFF" stroke="#9FB3D1" stroke-width="1.2"/><line x1="480" y1="140" x2="480" y2="86" stroke="#1E2761" stroke-width="3"/><path d="M480,86 L538,86 L524,99 L538,112 L480,112 z" fill="#B85042"/><text x="548" y="104" font-family="NanumGothic" font-size="14" font-weight="bold" fill="#B85042" text-anchor="start">정상 = 통치(Governance)</text><path d="M215,540 L300,478 L600,430 L340,360 L590,300 L430,240 L505,185 L482,148" fill="none" stroke="#028090" stroke-width="2.5" stroke-dasharray="7,5"/><text x="118" y="510" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#028090" text-anchor="start">등반 루트 = 6 Station</text><rect x="271.0" y="436" width="58" height="26" rx="13" fill="#FFFFFF" stroke="#1E2761" stroke-width="1.2"/><text x="300.0" y="454" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#1E2761" text-anchor="middle">진단</text><circle cx="300" cy="478" r="11" fill="#FFFFFF" stroke="#1E2761" stroke-width="2"/><text x="300" y="482.5" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#1E2761" text-anchor="middle">1</text><rect x="616" y="417" width="58" height="26" rx="13" fill="#FFFFFF" stroke="#1E2761" stroke-width="1.2"/><text x="645.0" y="435" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#1E2761" text-anchor="middle">분석</text><circle cx="600" cy="430" r="11" fill="#FFFFFF" stroke="#1E2761" stroke-width="2"/><text x="600" y="434.5" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#1E2761" text-anchor="middle">2</text><rect x="252" y="347" width="72" height="26" rx="13" fill="#FFFFFF" stroke="#1E2761" stroke-width="1.2"/><text x="288.0" y="365" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#1E2761" text-anchor="middle">보고서</text><circle cx="340" cy="360" r="11" fill="#FFFFFF" stroke="#1E2761" stroke-width="2"/><text x="340" y="364.5" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#1E2761" text-anchor="middle">3</text><rect x="606" y="287" width="58" height="26" rx="13" fill="#FFFFFF" stroke="#1E2761" stroke-width="1.2"/><text x="635.0" y="305" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#1E2761" text-anchor="middle">정책</text><circle cx="590" cy="300" r="11" fill="#FFFFFF" stroke="#1E2761" stroke-width="2"/><text x="590" y="304.5" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#1E2761" text-anchor="middle">4</text><rect x="356" y="227" width="58" height="26" rx="13" fill="#FFFFFF" stroke="#1E2761" stroke-width="1.2"/><text x="385.0" y="245" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#1E2761" text-anchor="middle">규칙</text><circle cx="430" cy="240" r="11" fill="#FFFFFF" stroke="#1E2761" stroke-width="2"/><text x="430" y="244.5" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#1E2761" text-anchor="middle">5</text><rect x="521" y="172" width="86" height="26" rx="13" fill="#FFFFFF" stroke="#1E2761" stroke-width="1.2"/><text x="564.0" y="190" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#1E2761" text-anchor="middle">업무논리</text><circle cx="505" cy="185" r="11" fill="#FFFFFF" stroke="#1E2761" stroke-width="2"/><text x="505" y="189.5" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#1E2761" text-anchor="middle">6</text><line x1="60" y1="560" x2="900" y2="560" stroke="#9FB3D1" stroke-width="1.5"/><path d="M113,602 L140,568 L167,602 z" fill="#CADCFC" stroke="#1E2761" stroke-width="1.6"/><path d="M132,602 L140,588 L148,602 z" fill="#1E2761"/><text x="140" y="622" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#1E2761" text-anchor="middle">GovernSpace</text><text x="140" y="640" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#5A6472" text-anchor="middle">경영·의사결정</text><path d="M273,602 L300,568 L327,602 z" fill="#CADCFC" stroke="#1E2761" stroke-width="1.6"/><path d="M292,602 L300,588 L308,602 z" fill="#1E2761"/><text x="300" y="622" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#1E2761" text-anchor="middle">FlowSpace</text><text x="300" y="640" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#5A6472" text-anchor="middle">물리적 흐름</text><path d="M433,602 L460,568 L487,602 z" fill="#CADCFC" stroke="#1E2761" stroke-width="1.6"/><path d="M452,602 L460,588 L468,602 z" fill="#1E2761"/><text x="460" y="622" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#1E2761" text-anchor="middle">QualitySpace</text><text x="460" y="640" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#5A6472" text-anchor="middle">검증·품질</text><path d="M593,602 L620,568 L647,602 z" fill="#CADCFC" stroke="#1E2761" stroke-width="1.6"/><path d="M612,602 L620,588 L628,602 z" fill="#1E2761"/><text x="620" y="622" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#1E2761" text-anchor="middle">ResourceSpace</text><text x="620" y="640" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#5A6472" text-anchor="middle">자원·재고·조달</text><path d="M753,602 L780,568 L807,602 z" fill="#CADCFC" stroke="#1E2761" stroke-width="1.6"/><path d="M772,602 L780,588 L788,602 z" fill="#1E2761"/><text x="780" y="622" font-family="NanumGothic" font-size="12" font-weight="bold" fill="#1E2761" text-anchor="middle">ValueSpace</text><text x="780" y="640" font-family="NanumGothic" font-size="11" font-weight="bold" fill="#5A6472" text-anchor="middle">손익·재무 환류</text><text x="480.0" y="664" font-family="NanumGothic" font-size="12.5" font-weight="bold" fill="#1E2761" text-anchor="middle">베이스캠프 = 5 Space (업무가 일어나는 다섯 공간)</text><text x="480.0" y="686" font-family="NanumGothic" font-size="11.5" font-weight="bold" fill="#5A6472" text-anchor="middle">3부 19장 — JEDAIX 온톨로지 아키텍처: 5 Space × 6 Station</text></svg>