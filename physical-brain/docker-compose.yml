# 사용자 PC/GPU 서버용 (2차 이관 준비) — 개발 컨테이너에서는 SQLite 백엔드로 대체 검증됨
services:
  neo4j:
    image: neo4j:5
    ports: ["7474:7474", "7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change-me}
    volumes:
      - neo4j_data:/data
  app:
    build: .
    ports: ["8800:8800"]
    env_file: .env
    depends_on: [neo4j]
  # ── 2차: GPU 프로파일 (docker compose --profile gpu up -d) ──
  ollama:
    profiles: ["gpu"]
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollama_models:/root/.ollama]
    environment:
      OLLAMA_KEEP_ALIVE: 2m   # GPU 공유: 응답 후 2분 뒤 VRAM 반납 (주식학습 19:00~05:30과 동거)
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
  stt:
    profiles: ["gpu"]
    image: fedirz/faster-whisper-server:latest-cuda   # OpenAI 호환 STT 서버
    ports: ["8801:8000"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]

volumes:
  neo4j_data:
  ollama_models:
