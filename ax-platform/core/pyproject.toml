[project]
name = "axp"
version = "0.1.0"
description = "AX Platform core — 판단의 공장 (M0~M7)"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "pyyaml>=6.0",
  "networkx>=3.2",
  "matplotlib>=3.8",
  "openpyxl>=3.1",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
prod = ["psycopg[binary]>=3.1", "neo4j>=5.20", "minio>=7.2", "mlflow>=2.16", "paho-mqtt>=2.0"]
deep = ["tensorflow>=2.16"]          # M4 딥러닝 백엔드(선택)
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["axp*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
